{% extends "base.html" %}

{% block content %}
<div class="chat-panel" style="display:flex;flex-direction:column;height:calc(100vh - 88px)">
  <div class="panel" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
    <div class="panel-header">
      <span class="panel-title">Security Chat</span>
    </div>

    <!-- Messages -->
    <div id="chat-messages" style="flex:1;overflow-y:auto;padding:12px">
      <div style="margin-bottom:12px;padding:12px;background:var(--bg-secondary);border-radius:var(--radius);font-size:13px">
        <strong>Patchi:</strong> Hi! I can help you understand security findings, explain vulnerabilities, or suggest fixes. What would you like to know?
      </div>
    </div>

    <!-- Input -->
    <div style="padding:12px;border-top:1px solid var(--border);display:flex;gap:8px">
      <input type="text" id="chat-input" placeholder="Ask about security findings…"
        style="flex:1;padding:8px 12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px"
        onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="btn btn-primary" id="chat-send" onclick="sendMessage()">
        <span class="btn-text">Send</span>
        <span class="btn-spinner" style="display:none;margin-left:6px">⏳</span>
      </button>
    </div>
  </div>
</div>

<script>
function sendMessage() {
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('chat-send');
  const msg = input.value.trim();
  if (!msg) return;

  btn.disabled = true;
  btn.classList.add('loading');

  const messages = document.getElementById('chat-messages');

  // Add user message
  messages.innerHTML += `
    <div style="margin-bottom:12px;padding:12px;background:var(--bg-card);border-radius:var(--radius);font-size:13px;text-align:right">
      ${escapeHtml(msg)}
    </div>`;

  input.value = '';
  messages.scrollTop = messages.scrollHeight;

  // Add loading indicator
  const loadingId = 'loading-' + Date.now();
  messages.innerHTML += `<div id="${loadingId}" style="margin-bottom:12px;padding:12px;background:var(--bg-secondary);border-radius:var(--radius);font-size:13px;color:var(--text-dim)">
    Thinking…
  </div>`;

  // Send to API
  fetch('/api/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({message: msg}),
  })
  .then(r => r.json())
  .then(data => {
    const el = document.getElementById(loadingId);
    if (el) {
      el.innerHTML = `<strong>Patchi:</strong> ${escapeHtml(data.response || 'No response')}`;
      el.style.color = 'var(--text-primary)';
    }
    messages.scrollTop = messages.scrollHeight;
  })
  .catch(err => {
    const el = document.getElementById(loadingId);
    if (el) el.innerHTML = `<strong>Error:</strong> ${err.message}`;
  })
  .finally(() => {
    btn.disabled = false;
    btn.classList.remove('loading');
  });
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
{% endblock %}
