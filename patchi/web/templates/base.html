<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>{% block title %}Patchi{% endblock %} — Mission Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" href="/static/dashboard_v2.css?v=16" as="style">
  <link rel="stylesheet" href="/static/dashboard_v2.css?v=16">
  <!-- Shared UI helpers (styled hover tooltip + data-tooltip delegation) -->
  <script defer src="/static/brain-ui.js?v=4"></script>
  <!-- htmx + brain-map libs share one resilient loader: per-source timeout ->
       retry -> mirror fallback (local -> unpkg -> jsdelivr) with global
       verification. Every remote fetch is preceded by a preconnect hint
       (_ensurePreconnect) whose "timeout" is a short grace period and whose
       "retry" re-issues the hint when a fetch from that origin proves
       unreachable (Chromium does not fire load/error on preconnect links,
       so fetch outcome is the only truthful signal). htmx starts immediately;
       brain libs start on demand via _loadBrainLibs(). -->
  <script>
    (function(){
    'use strict';
    /* Public state (tests can pre-seed _brainLibsCfg via add_init_script):
         _brainLibsCfg  { timeout, attempts, preconnectGrace, preconnectAttempts, sources }
         _scriptStatus    per-lib outcome map  (konva/canvas/three/orbit/brain3d/htmx)
         _preconnectStatus per-origin state map: undefined -> pending -> ok | fail
       A later _loadBrainLibs()/_loadHtmx() call re-attempts only libs that
       previously failed (already-ready libs short-circuit). */
    window._brainLibsCfg=window._brainLibsCfg||{};
    window._scriptStatus={konva:false,canvas:false,three:false,orbit:false,brain3d:false,htmx:false};
    window._brainLibsStatus=window._scriptStatus; /* legacy alias */
    window._preconnectStatus={};
    window._preconnectIssues={};
    window._preconnectTimers={};
    /* Single place state is written: cancels any pending grace timer so a
       stale timer can never flip an origin after it was proven failed. */
    function _setPC(origin,state){
      var t=window._preconnectTimers[origin];
      if(t){clearTimeout(t);window._preconnectTimers[origin]=null;}
      window._preconnectStatus[origin]=state;
    }
    function _scheduleGrace(origin,grace){
      var t=window._preconnectTimers[origin];
      if(t){clearTimeout(t);window._preconnectTimers[origin]=null;}
      window._preconnectTimers[origin]=setTimeout(function(){
        if(window._preconnectStatus[origin]==='pending')_setPC(origin,'grace-ok');
      },grace);
    }
    var SRC={
      htmx:[
        '/static/htmx.min.js',
        'https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js',
        'https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js'
      ],
      konva:[
        '/static/konva.min.js',
        'https://unpkg.com/konva@9.3.22/konva.min.js',
        'https://cdn.jsdelivr.net/npm/konva@9.3.22/konva.min.js'
      ],
      canvas:['/static/canvas.js?v=28'],
      three:[
        '/static/three.min.js',
        'https://unpkg.com/three@0.160.0/build/three.min.js',
        'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js'
      ],
      orbit:[
        '/static/OrbitControls.js',
        'https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js',
        'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js'
      ],
      brain3d:['/static/brain3d.js?v=21']
    };
    function _log(msg){try{console.log('[loader] '+msg);}catch(_){}};
    function _warn(msg){try{console.warn('[loader] '+msg);}catch(_){}};
    function _libReady(name){
      try{
        if(name==='htmx')return !!(window.htmx&&typeof window.htmx.ajax==='function'&&typeof window.htmx.trigger==='function');
        if(name==='konva')return !!window.Konva;
        if(name==='canvas')return !!window.BrainMap;
        if(name==='three')return !!(window.THREE&&window.THREE.Scene);
        if(name==='orbit')return !!(window.THREE&&window.THREE.OrbitControls);
        if(name==='brain3d')return !!window.BrainMap3D;
      }catch(e){}
      return false;
    }
    function _originOf(url){
      try{var a=document.createElement('a');a.href=url;return a.origin||'';}catch(e){return '';}
    }
    function _findPreconnectLink(origin){
      var norm=function(u){return u.split('?')[0].replace(/\/+$/,'');};
      var links=document.querySelectorAll('link[rel="preconnect"]');
      for(var i=0;i<links.length;i++){if(norm(links[i].href)===norm(origin))return links[i];}
      return null;
    }
    /* Preconnect hint sharing the loader's timeout/retry discipline, tuned to
       how browsers actually behave:
         - issue: append <link rel=preconnect> once (deduped vs static hints)
         - timeout: after `preconnectGrace` ms without evidence of failure the
           origin is optimistically marked ok (link events never fire reliably)
         - retry: when a script fetch from the origin proves it unreachable
           (_markOriginResult false), the hint is dropped and _ensurePreconnect
           re-issues it on the next attempt (bounded by preconnectAttempts).
       Purely advisory — never blocks script loading. */
    window._ensurePreconnect=function(origin){
      origin=origin||'';
      if(!origin||origin===location.origin)return;
      var st=window._preconnectStatus;
      if(st[origin]==='ok'||st[origin]==='grace-ok')return;
      var cfg=window._brainLibsCfg||{};
      var grace=cfg.preconnectGrace||2000;
      var link=_findPreconnectLink(origin);
      if(link&&st[origin]!=='fail'){if(!st[origin])_scheduleGrace(origin,grace);return;} /* already issued */
      if(st[origin]==='fail'){
        /* retry: drop the stale hint so the re-issue triggers a fresh handshake.
           preconnectAttempts caps how many re-issues happen; blocked calls
           neither re-issue nor count further. */
        var issues=window._preconnectIssues[origin]||0;
        if(issues>=(cfg.preconnectAttempts||3)){
          _warn('preconnect retry limit reached for '+origin+' ('+issues+' issues)');
          return;
        }
        issues+=1;
        window._preconnectIssues[origin]=issues;
        _warn('preconnect retrying '+origin+' (issue '+issues+')');
        if(link&&link.parentNode){try{link.parentNode.removeChild(link);}catch(e){}}
      }
      link=document.createElement('link');
      link.rel='preconnect';
      link.href=origin;
      link.crossOrigin='anonymous';
      document.head.appendChild(link);
      _setPC(origin,'pending');
      /* grace period: no failure signal within the window => assume ready */
      _scheduleGrace(origin,grace);
      _log('preconnect issued: '+origin);
    };
    /* Only a real fetch outcome tells us the truth about an origin. */
    window._markOriginResult=function(origin,ok){
      if(!origin||origin===location.origin)return;
      var st=window._preconnectStatus;
      if(ok){_setPC(origin,'ok');_log('preconnect proven: '+origin);}
      else if(st[origin]==='ok'){_warn('origin unreachable despite preconnect: '+origin);}
      else if(st[origin]!=='fail'){_setPC(origin,'fail');_warn('preconnect origin unreachable: '+origin);}
    };
    /* Append one <script> with a hard timeout; resolves on load, rejects on
       error or timeout. async=false keeps execution ordered (defer-like). */
    function _loadOneScript(src,timeoutMs){
      return new Promise(function(res,rej){
        var s=document.createElement('script');
        var done=false;
        var timer=setTimeout(function(){
          if(done)return;done=true;
          s.onload=s.onerror=null;
          if(s.parentNode)s.parentNode.removeChild(s);
          rej(new Error('timeout'));
        },timeoutMs);
        s.async=false;
        s.onload=function(){if(done)return;done=true;clearTimeout(timer);res();};
        s.onerror=function(){if(done)return;done=true;clearTimeout(timer);if(s.parentNode)s.parentNode.removeChild(s);rej(new Error('error'));};
        s.src=src;
        document.head.appendChild(s);
      });
    }
    /* One dependency stage: verify the global, then walk sources; each source
       gets up to `attempts` tries (cache-busted on retry) before the next
       source. Remote origins are preconnected before each attempt and marked
       ok/fail from the fetch outcome so the next attempt re-issues the hint. */
    function _loadStage(name,srcs,timeoutMs,attempts){
      var i=0;
      function next(){
        if(_libReady(name))return Promise.resolve(true);
        if(i>=srcs.length)return Promise.resolve(false);
        var src=srcs[i];
        var attempt=0;
        function trySrc(){
          attempt++;
          var url=src;
          if(attempt>1)url+=(url.indexOf('?')>=0?'&':'?')+'_r='+attempt;
          var origin=_originOf(url);
          if(origin&&origin!==location.origin)window._ensurePreconnect(origin); /* advisory, never blocks */
          _log('loading '+name+' ('+attempt+'/'+attempts+') '+url);
          return _loadOneScript(url,timeoutMs).then(function(){
            if(origin)window._markOriginResult(origin,true);
            if(_libReady(name))return true;
            _warn(name+' loaded but global missing — retrying');
            if(attempt<attempts)return trySrc();
            i++;return next();
          },function(err){
            _warn(name+' '+url+' '+err.message+' (attempt '+attempt+'/'+attempts+')');
            if(origin)window._markOriginResult(origin,false);
            if(attempt<attempts)return trySrc();
            i++;return next();
          });
        }
        return trySrc();
      }
      return next().then(function(ok){
        window._scriptStatus[name]=ok;
        if(ok)_log(name+' ready');
        else _warn(name+' unavailable after '+srcs.length+' source(s) x '+attempts+' attempts');
        return ok;
      });
    }
    function _cfg(){return window._brainLibsCfg||{};}
    /* ── 2D/3D brain-map chains (loaded on demand) ─────────────────── */
    window._brainLibsLoaded=false;
    window._brainLibsLoading=false;
    window._brainLibsPromise=null;
    window._loadBrainLibs=function(){
      if(window._brainLibsLoading)return window._brainLibsPromise;
      window._brainLibsLoading=true;
      var cfg=_cfg();
      var TIMEOUT=cfg.timeout||12000;
      var ATTEMPTS=cfg.attempts||2;
      if(cfg.sources)for(var k in cfg.sources)if(cfg.sources[k])SRC[k]=cfg.sources[k];
      // 2D chain
      var canvasP=_loadStage('konva',SRC.konva,TIMEOUT,ATTEMPTS).then(function(ok){
        return ok?_loadStage('canvas',SRC.canvas,TIMEOUT,ATTEMPTS):false;
      });
      // 3D chain (independent of 2D — a stalled 3D dep never blocks 2D)
      var brain3dP=_loadStage('three',SRC.three,TIMEOUT,ATTEMPTS).then(function(ok){
        return ok?_loadStage('orbit',SRC.orbit,TIMEOUT,ATTEMPTS):false;
      }).then(function(ok){
        return ok?_loadStage('brain3d',SRC.brain3d,TIMEOUT,ATTEMPTS):false;
      });
      window._brainLibsPromise=Promise.all([canvasP,brain3dP]).then(function(res){
        window._brainLibsLoading=false;
        window._brainLibsLoaded=true;
        if(res[1])document.dispatchEvent(new CustomEvent('brainlibs:3dready'));
        else document.dispatchEvent(new CustomEvent('brainlibs:3dfailed',{detail:{attempted:true}}));
        return {canvas:res[0],brain3d:res[1]};
      }).catch(function(err){
        window._brainLibsLoading=false;
        window._brainLibsLoaded=true;
        _warn('brain lib loader error: '+(err&&err.message?err.message:err));
        return {canvas:false,brain3d:false};
      });
      return window._brainLibsPromise;
    };
    /* ── htmx chain (starts immediately; consumers are guarded with
           typeof htmx !== 'undefined' fetch fallbacks) ─────────────── */
    window._htmxFixing=false;
    window._htmxPromise=null;
    window._loadHtmx=function(){
      if(window._htmxFixing)return window._htmxPromise;
      window._htmxFixing=true;
      var cfg=_cfg();
      var TIMEOUT=cfg.timeout||12000;
      var ATTEMPTS=cfg.attempts||2;
      if(cfg.sources&&cfg.sources.htmx)SRC.htmx=cfg.sources.htmx;
      window._htmxPromise=_loadStage('htmx',SRC.htmx,TIMEOUT,ATTEMPTS).then(function(ok){
        window._htmxFixing=false;
        if(ok){
          /* htmx 2.x only self-initializes at document.readyState 'complete'
             (otherwise it waits for DOMContentLoaded, which it registers at
             eval time). A deferred parser script always evals before
             DOMContentLoaded, but a DYNAMIC script that finishes loading after
             it (readyState 'interactive') registers a listener that never
             fires — leaving htmx loaded but the initial document unprocessed
             (hx-trigger=load etc. never run). Detect that dead window and
             process the document explicitly. */
          try{
            var rs=document.readyState;
            if(rs==='interactive'&&document.body&&window.htmx&&window.htmx.process){
              window.htmx.process(document.body);
              _log('htmx initial document processed (late dynamic load)');
            }
          }catch(e){_warn('htmx initial process failed: '+(e&&e.message?e.message:e));}
          document.dispatchEvent(new CustomEvent('patchi-htmx-ready'));
        }
        return ok;
      });
      return window._htmxPromise;
    };
    // Warm CDN connections at page start so any later mirror fallback
    // (htmx/konva/three/orbit) has a ready socket instead of a cold one.
    window._ensurePreconnect('https://unpkg.com');
    window._ensurePreconnect('https://cdn.jsdelivr.net');
    // Kick htmx off immediately (dynamic, defer-like, non-blocking).
    window._loadHtmx();
    })();
  </script>

  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="header-left">
        <a href="/" class="logo">
          <svg class="logo-icon" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="6" fill="currentColor"/><path d="M8 12h16M8 16h12M8 20h8" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
          <span class="logo-text">Patchi</span>
          <span class="logo-badge">Mission Control</span>
        </a>
        <nav class="main-tabs" role="tablist">
          <a href="/" class="tab active" data-tab="overview"><span>◈ Overview</span></a>
          <a href="/brain" class="tab" data-tab="brain"><span>⬡ Brain</span></a>
          <a href="/chat" class="tab" data-tab="chat"><span>🧠 Chat</span></a>
          <a href="/findings" class="tab" data-tab="findings"><span>◎ Findings</span></a>
          <a href="/assurance" class="tab" data-tab="assurance"><span>🛡 Assurance</span></a>
          <a href="/live-testing" class="tab" data-tab="live"><span>🧪 Live Tests</span></a>
          <a href="/charter" class="tab" data-tab="charter"><span>📋 Charter</span></a>
          <a href="/review" class="tab" data-tab="review"><span>◪ Review</span></a>
          <a href="/guard" class="tab" data-tab="guard"><span>◬ Guard</span></a>
          <a href="/history" class="tab" data-tab="history"><span>⏱ History</span></a>
          <a href="/settings" class="tab" data-tab="settings"><span>⚙ Settings</span></a>
        </nav>
      </div>
      <div class="header-center">
        <div class="health-indicator">
          <div class="health-score" id="topbar-health">—</div>
          <div class="health-label">Health</div>
        </div>
      </div>
      <div class="header-right">
        <span class="ws-status" id="ws-status">Connecting…</span>
        <button type="button" class="btn btn-ghost btn-sm" id="commandPalette" title="Command Palette (Ctrl+K)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <kbd class="kbd-hint">⌘K</kbd>
        </button>
      </div>
    </header>
    <div class="status-bar" id="statusBar">
      <div class="status-item"><span class="status-dot online" id="connectionStatus"></span><span>Connected</span></div>
      <div class="status-divider"></div>
      <div class="status-item"><span class="scan-badge" id="topbar-scan">Ready</span></div>
    </div>
    <main class="main-content" role="main">
      <div class="content" id="main-content">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  <div id="toast"></div>
  <div class="modal-overlay" id="commandPaletteModal" hidden>
    <div class="modal">
      <header class="modal-header"><h2 style="font-size:15px;font-weight:600;margin:0">Command Palette</h2><kbd class="kbd-hint">⌘K</kbd></header>
      <div class="modal-body">
        <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:12px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="color:var(--text-muted)"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="paletteInput" placeholder="Type a command or ask the Brain..." autocomplete="off" spellcheck="false" style="flex:1;background:none;border:none;outline:none;color:var(--text-primary);font-size:14px;font-family:inherit">
        </div>
        <div id="paletteResults" style="max-height:360px;overflow-y:auto"></div>
      </div>
    </div>
  </div>
  <div class="loading-overlay" id="global-loading">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loading-text">Loading…</div>
  </div>
  <script>
  (function(){
    'use strict';
    window.toast=function(msg,type){type=type||'info';var el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.className='visible '+type;clearTimeout(el._t);el._t=setTimeout(function(){el.className='';},4000);};
    window.showGlobalLoading=function(text){var o=document.getElementById('global-loading');var t=document.getElementById('loading-text');if(o&&t){t.textContent=text||'Loading…';o.classList.add('visible');}};
    window.hideGlobalLoading=function(){var o=document.getElementById('global-loading');if(o)o.classList.remove('visible');};
    window.setBtnState=function(btn,opts){if(!btn)return;opts=opts||{};if(opts.disabled!==undefined){btn.disabled=!!opts.disabled;if(opts.disabled){btn.setAttribute('aria-disabled','true');}else{btn.removeAttribute('aria-disabled');}}if(opts.loading!==undefined){btn.classList.toggle('loading',!!opts.loading);if(opts.loading){btn.setAttribute('aria-busy','true');}else{btn.removeAttribute('aria-busy');}}};
    var _wsDelay=1000,_wsReconnectTimer=null;var wsStatus=document.getElementById('ws-status');
    function connectWS(){var proto=location.protocol==='https:'?'wss:':'ws:';var ws=new WebSocket(proto+'//'+location.host+'/ws');window._ws=ws;ws.onopen=function(){_wsDelay=1000;if(wsStatus){wsStatus.textContent='Connected';wsStatus.className='ws-status connected';}ws.send(JSON.stringify({action:'status.request',data:{}}));if(window.BrainMap&&window.BrainMap._relistenWs)window.BrainMap._relistenWs();};ws.onclose=function(){if(wsStatus){wsStatus.textContent='Reconnecting…';wsStatus.className='ws-status disconnected';}_wsReconnectTimer=setTimeout(function(){_wsDelay=Math.min(_wsDelay*2,30000);connectWS();},_wsDelay);};ws.onerror=function(){ws.close();};ws.onmessage=function(e){try{var m=JSON.parse(e.data);handleWSEvent(m.event,m.data);}catch(_){}};}
    function handleWSEvent(event,data){if(event==='status.update'&&data.health_score!==undefined){var h=document.getElementById('topbar-health');if(h){h.textContent=data.health_score;h.style.color=data.health_score>=80?'var(--success)':data.health_score>=50?'var(--warning)':'var(--danger)';}}if(event==='scan.started'){var s=document.getElementById('topbar-scan');if(s){s.textContent='Scanning…';s.className='scan-badge scanning';}var sp=document.getElementById('scan-progress');if(sp)sp.style.display='block';var sl=document.getElementById('scan-progress-label');if(sl)sl.textContent='Starting '+(data.agent_count||0)+' agents…';var sc=document.getElementById('scan-progress-count');if(sc)sc.textContent='0/'+(data.agent_count||0);var sb=document.getElementById('scan-progress-bar');if(sb)sb.style.width='0%';}if(event==='scan.progress'){var phase=data.phase||'';var current=data.current||0;var total=data.total||1;var pct=Math.round((current/total)*100);var sb=document.getElementById('scan-progress-bar');if(sb)sb.style.width=pct+'%';var sc=document.getElementById('scan-progress-count');if(sc)sc.textContent=current+'/'+total;var sl=document.getElementById('scan-progress-label');if(sl){sl.textContent=phase==='scanning'?'Scanning…':phase==='done'?'Completed':phase;sl.style.color=phase==='scanning'?'var(--accent)':'var(--text-secondary)';}var sa=document.getElementById('scan-progress-agent');if(sa)sa.textContent=data.agent||'';}if(event==='scan.complete'){var s2=document.getElementById('topbar-scan');if(s2){s2.textContent=(data.total_findings||0)+' findings';s2.className='scan-badge complete';}var sb=document.getElementById('scan-progress-bar');if(sb){sb.style.width='100%';sb.style.background='var(--success)';}var sl=document.getElementById('scan-progress-label');if(sl){sl.textContent='Scan complete — '+(data.total_findings||0)+' findings';sl.style.color='var(--success)';}var sa=document.getElementById('scan-progress-agent');if(sa)sa.textContent='';setTimeout(function(){var sp=document.getElementById('scan-progress');if(sp)sp.style.display='none';var sb2=document.getElementById('scan-progress-bar');if(sb2){sb2.style.background='var(--accent)';sb2.style.width='0%';}},4000);}if((event==='scan.finding')&&(data.severity==='critical'||data.severity==='high')){window.toast(data.severity.toUpperCase()+': '+data.message,data.severity);}if(window.BrainMap&&window.BrainMap.handleEvent)window.BrainMap.handleEvent(event,data);}
    connectWS();
    document.body.addEventListener('htmx:beforeRequest',function(evt){var elt=evt.detail.elt;var trig=(elt&&elt.getAttribute&&elt.getAttribute('hx-trigger'))||'';if(trig.indexOf('every')<0){var target=evt.detail.target;if(target&&target.closest('.content'))target.closest('.content').classList.add('loading');}var btn=elt;if(btn&&btn.classList&&btn.classList.contains('btn')){btn.classList.add('loading');btn.setAttribute('aria-busy','true');}});
    document.body.addEventListener('htmx:afterSettle',function(evt){var content=document.querySelector('.content');if(content)content.classList.remove('loading');document.querySelectorAll('.btn.loading').forEach(function(b){b.classList.remove('loading');b.removeAttribute('aria-busy');});if(evt.detail.target&&evt.detail.target.querySelector&&evt.detail.target.querySelector('#brain-map')){window._loadBrainLibs();setTimeout(function(){if(window.BrainMap)window.BrainMap.init('brain-map');},200);}});
    document.body.addEventListener('htmx:responseError',function(evt){var d=evt.detail;if(d.xhr&&d.xhr.status)window.toast('Error '+d.xhr.status+': '+d.xhr.statusText,'high');});
    document.body.addEventListener('htmx:afterSwap',function(evt){if(evt.detail.requestConfig&&evt.detail.requestConfig.path){var path=evt.detail.requestConfig.path.replace(/\/$/,'')||'/';document.querySelectorAll('.main-tabs .tab').forEach(function(tab){var href=tab.getAttribute('href').replace(/\/$/,'')||'/';tab.classList.toggle('active',href===path);});}});
    var paletteModal=document.getElementById('commandPaletteModal');var paletteInput=document.getElementById('paletteInput');var paletteResults=document.getElementById('paletteResults');
    function openPalette(){if(paletteModal){paletteModal.hidden=false;if(paletteInput){paletteInput.value='';paletteInput.focus();}renderPalette('');}}
    function closePalette(){if(paletteModal)paletteModal.hidden=true;}
    function renderPalette(q){if(!paletteResults)return;q=(q||'').toLowerCase().trim();var cmds=[{n:'Scan Project',a:'scan',c:'Security'},{n:'Fix Safe Issues',a:'fix',c:'Fix'},{n:'Dev Check',a:'devcheck',c:'Quality'},{n:'Assurance Check',a:'assurance',c:'Security'},{n:'DAST Scan',a:'dast',c:'Security'},{n:'Open Brain Map',h:'/brain',c:'Nav'},{n:'Open Chat',h:'/chat',c:'Nav'},{n:'Open Findings',h:'/findings',c:'Nav'},{n:'Open Charter',h:'/charter',c:'Nav'},{n:'View History',h:'/history',c:'Nav'},{n:'Settings',h:'/settings',c:'Nav'}];var f=cmds.filter(function(c){return!q||c.n.toLowerCase().indexOf(q)>=0;});paletteResults.innerHTML=f.map(function(c){return '<div style="display:flex;justify-content:space-between;padding:10px 12px;border-radius:6px;cursor:pointer" onmouseenter="this.style.background=\'var(--bg-tertiary)\'" onmouseleave="this.style.background=\'none\'" data-action="'+(c.a||'')+'" data-href="'+(c.h||'')+'"><span style="font-family:var(--font-mono);font-size:13px">'+c.n+'</span><span style="font-size:11px;color:var(--text-muted)">'+c.c+'</span></div>';}).join('')||'<div class="feed-empty">No matching commands</div>';}
    if(paletteInput)paletteInput.addEventListener('input',function(e){renderPalette(e.target.value);});
    if(paletteResults)paletteResults.addEventListener('click',function(e){var item=e.target.closest('[data-action],[data-href]');if(!item)return;closePalette();if(item.dataset.href)window.location.href=item.dataset.href;else if(item.dataset.action)document.body.dispatchEvent(new CustomEvent('palette:action',{detail:{action:item.dataset.action}}));});
    var cmdBtn=document.getElementById('commandPalette');if(cmdBtn)cmdBtn.addEventListener('click',openPalette);
    if(paletteModal)paletteModal.addEventListener('click',function(e){if(e.target===paletteModal)closePalette();});
    document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(paletteModal&&!paletteModal.hidden)closePalette();else openPalette();return;}if(e.key==='Escape'){closePalette();return;}});
    setInterval(function(){if(window._ws&&window._ws.readyState===WebSocket.OPEN)window._ws.send(JSON.stringify({action:'ping',data:{}}));},30000);
  })();
  </script>
  {% block scripts %}{% endblock %}
