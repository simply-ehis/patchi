domain_id: "access-control-authz"
version: "1.0.0"
display_name: "General Access Control and Authorization"
source_standard: "OWASP Application Security Verification Standard (ASVS) 5.0.0, Chapter V8: Authorization (fetched and verified directly from the official ASVS 5.0.0 markdown source, github.com/OWASP/ASVS, July 2026)"
component_type: "backend-api"
cross_cutting: true
weight: 0.85

# NOTE ON SCOPE: this domain covers authorization broadly — including non-API/monolith
# architectures — and is distinct from backend-api's existing BOLA/BFLA controls, which
# are sourced from the OWASP API Security Top 10 and framed specifically around REST/API
# object- and function-level authorization. Two controls here (AUTHZ-06 on data-specific
# access / IDOR-BOLA, and AUTHZ-07 on field-level access / BOPLA) describe the same
# underlying vulnerability classes ASVS's own text explicitly cross-references (IDOR,
# BOLA, BOPLA) that backend-api's API-Top-10-sourced controls likely already cover for
# API-shaped consumers. Where overlap exists, treat backend-api's version as the
# API-specific instance and this domain's version as the broader, non-API-specific case
# (e.g. a server-rendered monolith with no formal API layer) — do not score both
# independently for an app that is purely API-shaped; de-duplicate at taxonomy-assembly time.

activation_signals:
  required_any:
    - signal: "has_authorization_check_logic"     # role/permission checks, ACL logic, middleware guards on routes/handlers
    - signal: "has_multi_tenant_data_model"        # tenant_id/org_id-scoped data access patterns
    - signal: "has_admin_interface"                # separate admin routes/panel detected
  excluded_if:
    - signal: "no_access_differentiation"          # single-user/no-accounts app with no concept of differing permission levels

controls:
  - control_id: "AUTHZ-01"
    name: "Document function-level and data-specific authorization rules"
    description: "Authorization documentation must define rules for restricting function-level and data-specific access based on consumer permissions and resource attributes."
    source_clause: "ASVS 5.0.0, V8.1.1"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only — documentation requirement"
    remediation_ref: "fix-playbook://AUTHZ-01"

  - control_id: "AUTHZ-02"
    name: "Document field-level access restriction rules"
    description: "Authorization documentation must define rules for field-level access restrictions (both read and write) based on consumer permissions and resource attributes, noting these rules may depend on other attribute values of the data object (e.g. its state/status)."
    source_clause: "ASVS 5.0.0, V8.1.2"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — documentation requirement"
    remediation_ref: "fix-playbook://AUTHZ-02"

  - control_id: "AUTHZ-03"
    name: "Document environmental/contextual attributes used in security decisions"
    description: "Documentation must define the environmental and contextual attributes (time of day, user location, IP address, device, etc.) used to make security decisions, including authentication and authorization decisions."
    source_clause: "ASVS 5.0.0, V8.1.3"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — documentation requirement"
    remediation_ref: "fix-playbook://AUTHZ-03"

  - control_id: "AUTHZ-04"
    name: "Document how contextual factors drive decision-making and actions"
    description: "Documentation must define how environmental/contextual factors are used in decision-making alongside function-level, data-specific, and field-level authorization, including which attributes are evaluated, risk thresholds, and resulting actions (allow, challenge, deny, step-up authentication)."
    source_clause: "ASVS 5.0.0, V8.1.4"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — documentation requirement"
    remediation_ref: "fix-playbook://AUTHZ-04"

  - control_id: "AUTHZ-05"
    name: "Restrict function-level access to consumers with explicit permission"
    description: "The application must ensure function-level access (e.g. an action or operation) is restricted to consumers who have been explicitly granted permission to perform it."
    source_clause: "ASVS 5.0.0, V8.2.1"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming every sensitive route/handler/function has an accompanying permission/role check before executing its logic, rather than relying only on the route being unlisted/unlinked in the UI"
    remediation_ref: "fix-playbook://AUTHZ-05"

  - control_id: "AUTHZ-06"
    name: "Restrict data-specific access to prevent IDOR/BOLA"
    description: "The application must ensure data-specific access is restricted to consumers with explicit permission to the specific data item requested, to mitigate insecure direct object reference (IDOR) and broken object level authorization (BOLA). Possible overlap with backend-api's API-specific BOLA controls — see domain-level scope note."
    source_clause: "ASVS 5.0.0, V8.2.2"
    severity: "critical"
    check_method: "static"
    detector: "CodeQL taint-tracking rule flagging data-access call sites that use a user-supplied object identifier to fetch a record without an accompanying ownership/permission check against the requesting consumer"
    remediation_ref: "fix-playbook://AUTHZ-06"

  - control_id: "AUTHZ-07"
    name: "Restrict field-level access to prevent BOPLA"
    description: "The application must ensure field-level access is restricted to consumers with explicit permission to specific fields, to mitigate broken object property level authorization (BOPLA) — i.e. a consumer authorized to view/edit some fields of an object should not automatically gain access to all of that object's fields. Possible overlap with backend-api — see domain-level scope note."
    source_clause: "ASVS 5.0.0, V8.2.3"
    severity: "high"
    check_method: "static"
    detector: "Semgrep/CodeQL rule flagging API responses or update handlers that serialize/accept an entire object model without filtering to only the fields the requesting consumer's role is permitted to read/write"
    remediation_ref: "fix-playbook://AUTHZ-07"

  - control_id: "AUTHZ-08"
    name: "Apply adaptive, context-aware authorization controls throughout a session"
    description: "Adaptive security controls based on a consumer's environmental/contextual attributes (time, location, IP, device) must be applied both when starting a new session and during an existing session, as defined in the application's documentation."
    source_clause: "ASVS 5.0.0, V8.2.4"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — verifying adaptive controls apply consistently throughout a session, not just at login, requires tracing session-lifetime behavior, not a single static pattern"
    remediation_ref: "fix-playbook://AUTHZ-08"

  - control_id: "AUTHZ-09"
    name: "Enforce authorization at a trusted service layer, never client-side only"
    description: "The application must enforce authorization rules at a trusted service layer and must not rely on controls an untrusted consumer could manipulate, such as client-side JavaScript."
    source_clause: "ASVS 5.0.0, V8.3.1"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep/CodeQL rule flagging authorization decisions made only in frontend code (hiding a UI element, a client-side route guard) with no corresponding server-side enforcement on the actual data/action endpoint"
    remediation_ref: "fix-playbook://AUTHZ-09"

  - control_id: "AUTHZ-10"
    name: "Apply authorization-relevant data changes immediately, or mitigate the delay"
    description: "Changes to values that authorization decisions depend on must be applied immediately. Where immediate application isn't possible (e.g. self-contained/stateless tokens carrying stale permission data), mitigating controls must alert when a consumer acts after their authorization has changed, and revert the resulting action — noting this does not mitigate any information already leaked."
    source_clause: "ASVS 5.0.0, V8.3.2"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only, though a static check can flag reliance on long-lived self-contained tokens (JWTs with long expiry, no revocation check) carrying permission claims as a candidate for review"
    remediation_ref: "fix-playbook://AUTHZ-10"

  - control_id: "AUTHZ-11"
    name: "Base object access on the originating consumer's permissions, not an intermediary service's"
    description: "Access to an object must be based on the originating subject's (e.g. consumer's) permissions, not the permissions of an intermediary or service acting on their behalf — in a service-to-service call chain, downstream services must use the original consumer's identity/token, not a separate machine-to-machine credential, to make permission decisions."
    source_clause: "ASVS 5.0.0, V8.3.3"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only, supplemented by a static check flagging service-to-service call sites that pass a service-level credential instead of forwarding/re-validating the original consumer's token/claims"
    remediation_ref: "fix-playbook://AUTHZ-11"

  - control_id: "AUTHZ-12"
    name: "Enforce cross-tenant isolation in multi-tenant applications"
    description: "Multi-tenant applications must use cross-tenant controls ensuring a consumer's operations never affect tenants they do not have permission to interact with."
    source_clause: "ASVS 5.0.0, V8.4.1"
    severity: "critical"
    check_method: "static"
    detector: "CodeQL taint-tracking rule flagging data-access queries that don't include a tenant_id/org_id scoping condition derived from the authenticated consumer's own tenant, allowing a crafted request to reference another tenant's identifier"
    remediation_ref: "fix-playbook://AUTHZ-12"

  - control_id: "AUTHZ-13"
    name: "Apply layered, continuous verification for administrative interface access"
    description: "Access to administrative interfaces must incorporate multiple layers of security — continuous identity verification, device security posture assessment, and contextual risk analysis — rather than relying on network location or a trusted endpoint alone as the sole authorization factor."
    source_clause: "ASVS 5.0.0, V8.4.2"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only, though a static check can flag admin routes protected only by an IP allowlist or network-boundary check with no accompanying identity/session verification as a candidate for review"
    remediation_ref: "fix-playbook://AUTHZ-13"

deprecated_by: null
last_reviewed: "2026-07-08"
