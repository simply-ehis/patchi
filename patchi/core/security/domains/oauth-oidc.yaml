domain_id: "oauth-oidc"
version: "1.0.0"
display_name: "OAuth 2.0 and OpenID Connect Security"
source_standard: "OWASP Application Security Verification Standard (ASVS) 5.0.0, Chapter V10: OAuth and OIDC (fetched and verified directly from the official ASVS 5.0.0 markdown source, github.com/OWASP/ASVS, July 2026). Cross-referenced against RFC 9700 (OAuth 2.0 Security Best Current Practice), RFC 7636 (PKCE), RFC 9449 (DPoP), and the OWASP OAuth 2.0 Protocol Cheat Sheet, all cited directly in the ASVS chapter's own references section."
component_type: "backend-api"
cross_cutting: true
weight: 0.9

# NOTE ON SCOPE: this domain covers OAuth/OIDC-specific protocol security only. General
# session-management requirements (V7) and generic authentication requirements (V6) are
# out of scope here and likely already live in auth-session — this domain activates
# specifically when the app acts as an OAuth/OIDC client, resource server, authorization
# server, or OpenID Provider, which is a materially different and more complex threat
# model than username/password authentication. Many apps will only ever be an OAuth
# CLIENT (consuming "Sign in with X"), never a resource server or authorization server —
# scope activation to the actual role(s) the app plays, not all four roles by default.

activation_signals:
  required_any:
    - signal: "has_oauth_client_library"          # passport-oauth2, next-auth, Authlib, etc.
    - signal: "has_oidc_relying_party_config"      # "Sign in with Google/GitHub/etc." integration
    - signal: "implements_oauth_authorization_server"  # app itself issues OAuth tokens to third parties
    - signal: "has_bearer_token_validation_middleware"  # resource-server role: validates incoming access tokens
  excluded_if:
    - signal: "no_oauth_oidc_protocol_usage"       # app uses only its own session-based auth, no OAuth/OIDC anywhere

controls:
  - control_id: "OAUTH-01"
    name: "Send tokens only to components that strictly need them"
    description: "Tokens must only be sent to components that strictly need them — for example, in a backend-for-frontend (BFF) pattern for browser-based JavaScript apps, access and refresh tokens must only be accessible to the backend, never exposed to frontend JS."
    source_clause: "ASVS 5.0.0, V10.1.1"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep/CodeQL rule flagging access/refresh token values being passed to frontend-rendered responses, localStorage, or client-side JS variables rather than kept server-side in a BFF pattern"
    remediation_ref: "fix-playbook://OAUTH-01"

  - control_id: "OAUTH-02"
    name: "Bind authorization flow values to the initiating session (anti-CSRF/replay)"
    description: "The client must only accept values from the authorization server (authorization code, ID Token) if they result from a flow initiated by the same user agent session and transaction — requiring PKCE 'code_verifier', 'state', or OIDC 'nonce' values that are unguessable, transaction-specific, and securely bound to both client and session."
    source_clause: "ASVS 5.0.0, V10.1.2"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming the OAuth client library's flow includes PKCE code_verifier generation/validation and state/nonce binding to the originating session, not just passthrough of authorization-server-provided values"
    remediation_ref: "fix-playbook://OAUTH-02"

  - control_id: "OAUTH-03"
    name: "Protect against CSRF-triggered token requests in the code flow"
    description: "If using the code flow, the OAuth client must protect against CSRF attacks that trigger token requests, via PKCE or by checking the 'state' parameter sent in the authorization request."
    source_clause: "ASVS 5.0.0, V10.2.1"
    severity: "high"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming the client's token-exchange callback handler validates 'state' or uses PKCE before completing the code exchange"
    remediation_ref: "fix-playbook://OAUTH-03"

  - control_id: "OAUTH-04"
    name: "Defend against mix-up attacks with multiple authorization servers"
    description: "If the OAuth client interacts with more than one authorization server, it must defend against mix-up attacks, e.g. by requiring the authorization server to return and validating the 'iss' parameter in both the authorization response and the token response."
    source_clause: "ASVS 5.0.0, V10.2.2"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only, supplemented by a static check confirming 'iss' parameter validation exists in the callback handler when multiple authorization servers are configured"
    remediation_ref: "fix-playbook://OAUTH-04"

  - control_id: "OAUTH-05"
    name: "Request only the required scopes"
    description: "The OAuth client must only request the scopes (or other authorization parameters) it actually requires from the authorization server, following least-privilege."
    source_clause: "ASVS 5.0.0, V10.2.3"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — confirming requested scopes match actual functional need requires understanding what the app's features actually use"
    remediation_ref: "fix-playbook://OAUTH-05"

  - control_id: "OAUTH-06"
    name: "Validate access token audience before accepting"
    description: "The resource server must only accept access tokens intended for use with that specific service (audience validation), via the 'aud' claim (JWT) or a token introspection endpoint check."
    source_clause: "ASVS 5.0.0, V10.3.1"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming the bearer-token validation middleware checks the 'aud' claim (or performs introspection) before accepting a token, not just signature/expiry"
    remediation_ref: "fix-playbook://OAUTH-06"

  - control_id: "OAUTH-07"
    name: "Enforce authorization decisions from delegated-authorization claims"
    description: "The resource server must enforce authorization decisions based on claims from the access token that define delegated authorization ('sub', 'scope', 'authorization_details' where present), not merely on the token's validity."
    source_clause: "ASVS 5.0.0, V10.3.2"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep/CodeQL rule flagging endpoints that validate token signature/expiry but never read/enforce scope or authorization_details claims against the requested action"
    remediation_ref: "fix-playbook://OAUTH-07"

  - control_id: "OAUTH-08"
    name: "Identify users from non-reassignable claim combinations"
    description: "If an access control decision requires identifying a unique user from an access token, the resource server must use claims that cannot be reassigned to other users — typically a combination of 'iss' and 'sub', not 'sub' alone."
    source_clause: "ASVS 5.0.0, V10.3.3"
    severity: "high"
    check_method: "static"
    detector: "Semgrep/CodeQL rule flagging user-identification logic keyed only on the 'sub' claim without also checking 'iss'"
    remediation_ref: "fix-playbook://OAUTH-08"

  - control_id: "OAUTH-09"
    name: "Verify authentication strength/recency claims when required"
    description: "If the resource server requires specific authentication strength, method, or recency, it must verify the presented access token satisfies these constraints via the OIDC 'acr', 'amr', and 'auth_time' claims where present."
    source_clause: "ASVS 5.0.0, V10.3.4"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep/CodeQL rule flagging high-sensitivity endpoints requiring step-up/MFA that don't check 'acr'/'amr'/'auth_time' claims on the presented token"
    remediation_ref: "fix-playbook://OAUTH-09"

  - control_id: "OAUTH-10"
    name: "Use sender-constrained access tokens to prevent replay"
    description: "The resource server must prevent use of stolen or replayed access tokens by requiring sender-constrained tokens — Mutual TLS for OAuth 2 or OAuth 2 DPoP."
    source_clause: "ASVS 5.0.0, V10.3.5"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only, though a static check can flag a resource server accepting plain bearer tokens with no mTLS/DPoP binding configured (this is an L3 requirement, so may be an accepted gap for lower assurance levels)"
    remediation_ref: "fix-playbook://OAUTH-10"

  - control_id: "OAUTH-11"
    name: "Validate redirect URIs against an exact-match allowlist"
    description: "The authorization server must validate redirect URIs based on a client-specific allowlist of pre-registered URIs using exact string comparison, not prefix/substring/pattern matching."
    source_clause: "ASVS 5.0.0, V10.4.1"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep/CodeQL rule flagging redirect_uri validation logic using startsWith/regex/substring matching instead of exact string equality against a registered allowlist"
    remediation_ref: "fix-playbook://OAUTH-11"

  - control_id: "OAUTH-12"
    name: "Enforce single-use authorization codes"
    description: "If the authorization code is returned in the authorization response, it must be usable only once for a token request; a second request with an already-used code must be rejected and any tokens already issued from that code must be revoked."
    source_clause: "ASVS 5.0.0, V10.4.2"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming the token endpoint marks authorization codes as consumed after first use and rejects/revokes on reuse"
    remediation_ref: "fix-playbook://OAUTH-12"

  - control_id: "OAUTH-13"
    name: "Keep authorization codes short-lived"
    description: "The authorization code must be short-lived — maximum 10 minutes for L1/L2 applications, maximum 1 minute for L3 applications."
    source_clause: "ASVS 5.0.0, V10.4.3"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep/CodeQL rule checking authorization code expiry configuration against the level-appropriate maximum"
    remediation_ref: "fix-playbook://OAUTH-13"

  - control_id: "OAUTH-14"
    name: "Restrict clients to only the grant types they need; ban Implicit and ROPC flows"
    description: "The authorization server must only allow a given client to use the grant types it actually needs. The Implicit flow ('token') and Resource Owner Password Credentials flow ('password') must no longer be used at all."
    source_clause: "ASVS 5.0.0, V10.4.4"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep/CodeQL rule flagging any authorization-server client configuration or code path still permitting response_type=token (Implicit) or grant_type=password (ROPC)"
    remediation_ref: "fix-playbook://OAUTH-14"

  - control_id: "OAUTH-15"
    name: "Mitigate refresh token replay for public clients"
    description: "The authorization server must mitigate refresh token replay attacks for public clients, preferably via sender-constrained refresh tokens (DPoP or mTLS-bound), or via refresh token rotation with invalidation and full-family revocation for L1/L2."
    source_clause: "ASVS 5.0.0, V10.4.5"
    severity: "high"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming refresh token rotation logic invalidates the prior token and revokes the entire token family if a stale/already-used refresh token is presented"
    remediation_ref: "fix-playbook://OAUTH-15"

  - control_id: "OAUTH-16"
    name: "Require PKCE for the code grant"
    description: "If the code grant is used, the authorization server must mitigate authorization code interception attacks by requiring PKCE — a valid 'code_challenge' at the authorization request (rejecting 'plain' as the method), and validation of the 'code_verifier' at the token request."
    source_clause: "ASVS 5.0.0, V10.4.6"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming the authorization server rejects requests missing code_challenge or using code_challenge_method=plain"
    remediation_ref: "fix-playbook://OAUTH-16"

  - control_id: "OAUTH-17"
    name: "Mitigate malicious client risk in unauthenticated dynamic client registration"
    description: "If the authorization server supports unauthenticated dynamic client registration, it must mitigate malicious-client risk by validating client metadata, ensuring user consent, and warning the user before processing an authorization request with an untrusted client."
    source_clause: "ASVS 5.0.0, V10.4.7"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only — validating the adequacy of client-metadata checks and consent-warning UX requires human judgment"
    remediation_ref: "fix-playbook://OAUTH-17"

  - control_id: "OAUTH-18"
    name: "Enforce absolute expiration on refresh tokens"
    description: "Refresh tokens must have an absolute expiration, even when sliding refresh token expiration is applied, to prevent indefinite token lifetime."
    source_clause: "ASVS 5.0.0, V10.4.8"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming refresh token issuance/validation logic enforces an absolute (not just sliding) expiry ceiling"
    remediation_ref: "fix-playbook://OAUTH-18"

  - control_id: "OAUTH-19"
    name: "Allow authorized users to revoke refresh/reference tokens"
    description: "Refresh tokens and reference access tokens must be revocable by an authorized user via the authorization server's user interface."
    source_clause: "ASVS 5.0.0, V10.4.9"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only — confirming a genuinely usable revocation UI exists requires interface review"
    remediation_ref: "fix-playbook://OAUTH-19"

  - control_id: "OAUTH-20"
    name: "Authenticate confidential clients on backchannel requests"
    description: "Confidential clients must be authenticated for client-to-authorization-server backchannel requests, including token requests, pushed authorization requests (PAR), and token revocation requests."
    source_clause: "ASVS 5.0.0, V10.4.10"
    severity: "high"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming backchannel endpoints (token, PAR, revocation) require client authentication for confidential clients"
    remediation_ref: "fix-playbook://OAUTH-20"

  - control_id: "OAUTH-21"
    name: "Assign only required scopes at the authorization-server configuration level"
    description: "The authorization server configuration must only assign the scopes actually required to each OAuth client, complementing OAUTH-05's client-side request restriction."
    source_clause: "ASVS 5.0.0, V10.4.11"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only — confirming configured scopes match actual client need requires understanding each registered client's legitimate purpose"
    remediation_ref: "fix-playbook://OAUTH-21"

  - control_id: "OAUTH-22"
    name: "Restrict clients to only the response_mode values they need"
    description: "For a given client, the authorization server must only allow the 'response_mode' value that client actually needs, e.g. via validation against expected values or PAR/JAR."
    source_clause: "ASVS 5.0.0, V10.4.12"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — an L3 requirement requiring per-client configuration review"
    remediation_ref: "fix-playbook://OAUTH-22"

  - control_id: "OAUTH-23"
    name: "Require PAR alongside the code grant"
    description: "Grant type 'code' must always be used together with pushed authorization requests (PAR)."
    source_clause: "ASVS 5.0.0, V10.4.13"
    severity: "low"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming the authorization endpoint requires a PAR-issued request_uri rather than accepting authorization parameters directly in the front-channel request (L3 requirement)"
    remediation_ref: "fix-playbook://OAUTH-23"

  - control_id: "OAUTH-24"
    name: "Issue only sender-constrained access tokens"
    description: "The authorization server must issue only sender-constrained (Proof-of-Possession) access tokens, via mTLS certificate-bound tokens or DPoP-bound tokens."
    source_clause: "ASVS 5.0.0, V10.4.14"
    severity: "low"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming issued access tokens are bound via mTLS or DPoP rather than plain bearer tokens (L3 requirement)"
    remediation_ref: "fix-playbook://OAUTH-24"

  - control_id: "OAUTH-25"
    name: "Protect authorization_details from tampering for server-side clients"
    description: "For a server-side client, the authorization server must ensure the 'authorization_details' parameter value originates from the client backend and has not been tampered with by the user, e.g. via PAR or JAR."
    source_clause: "ASVS 5.0.0, V10.4.15"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — an L3 requirement needing architecture-specific verification"
    remediation_ref: "fix-playbook://OAUTH-25"

  - control_id: "OAUTH-26"
    name: "Require strong, replay-resistant client authentication for confidential clients"
    description: "For confidential clients, the authorization server must require strong client authentication methods based on public-key cryptography and resistant to replay — mutual TLS or private_key_jwt — rather than a shared client secret alone."
    source_clause: "ASVS 5.0.0, V10.4.16"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — an L3 requirement requiring configuration review of the client authentication method in use"
    remediation_ref: "fix-playbook://OAUTH-26"

  - control_id: "OAUTH-27"
    name: "Mitigate ID Token replay via nonce validation"
    description: "The client (relying party) must mitigate ID Token replay attacks, e.g. by ensuring the ID Token's 'nonce' claim matches the 'nonce' value sent in the original authentication request."
    source_clause: "ASVS 5.0.0, V10.5.1"
    severity: "high"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming the OIDC callback handler validates the 'nonce' claim against the session-stored value from the original request"
    remediation_ref: "fix-playbook://OAUTH-27"

  - control_id: "OAUTH-28"
    name: "Identify users from non-reassignable ID Token claims"
    description: "The client must uniquely identify the user from ID Token claims (usually 'sub') which cannot be reassigned to other users within the scope of that identity provider."
    source_clause: "ASVS 5.0.0, V10.5.2"
    severity: "high"
    check_method: "static"
    detector: "Semgrep/CodeQL rule flagging user-identification logic using a mutable claim (e.g. email) instead of 'sub' as the primary identifier"
    remediation_ref: "fix-playbook://OAUTH-28"

  - control_id: "OAUTH-29"
    name: "Reject authorization server metadata with a mismatched issuer"
    description: "The client must reject attempts by a malicious authorization server to impersonate another via metadata — rejecting metadata where the issuer URL does not exactly match the pre-configured expected issuer URL."
    source_clause: "ASVS 5.0.0, V10.5.3"
    severity: "high"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming issuer URL validation exists when consuming OIDC discovery/metadata documents"
    remediation_ref: "fix-playbook://OAUTH-29"

  - control_id: "OAUTH-30"
    name: "Validate ID Token audience matches the client's own client_id"
    description: "The client must validate that the ID Token is intended for that client by checking the 'aud' claim equals the client's own 'client_id'."
    source_clause: "ASVS 5.0.0, V10.5.4"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming ID Token validation logic checks the 'aud' claim against the configured client_id, not just signature validity"
    remediation_ref: "fix-playbook://OAUTH-30"

  - control_id: "OAUTH-31"
    name: "Secure OIDC back-channel logout against DoS and cross-JWT confusion"
    description: "When using OIDC back-channel logout, the relying party must mitigate forced-logout DoS and cross-JWT confusion by verifying the logout token's type is 'logout+jwt', contains the 'event' claim with the correct member name, and does not contain a 'nonce' claim."
    source_clause: "ASVS 5.0.0, V10.5.5"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming the back-channel logout endpoint validates token type, 'event' claim, and absence of 'nonce' before processing a logout request"
    remediation_ref: "fix-playbook://OAUTH-31"

  - control_id: "OAUTH-32"
    name: "Restrict OpenID Provider response modes; ban Implicit"
    description: "The OpenID Provider must only allow 'code', 'ciba', 'id_token', or 'id_token code' as response mode values; 'code' is preferred over the Hybrid flow, and any Implicit flow must not be used."
    source_clause: "ASVS 5.0.0, V10.6.1"
    severity: "high"
    check_method: "static"
    detector: "Semgrep/CodeQL rule flagging OpenID Provider configuration or code paths still permitting an Implicit-flow response_type"
    remediation_ref: "fix-playbook://OAUTH-32"

  - control_id: "OAUTH-33"
    name: "Mitigate forced-logout denial of service at the OpenID Provider"
    description: "The OpenID Provider must mitigate denial of service through forced logout, by obtaining explicit end-user confirmation or validating relying-party-initiated logout request parameters such as 'id_token_hint'."
    source_clause: "ASVS 5.0.0, V10.6.2"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming the OP's logout endpoint validates id_token_hint or requires explicit user confirmation before terminating a session"
    remediation_ref: "fix-playbook://OAUTH-33"

  - control_id: "OAUTH-34"
    name: "Require explicit user consent for each authorization request"
    description: "The authorization server must ensure the user consents to each authorization request; if the client's identity cannot be assured, the server must always explicitly prompt for consent."
    source_clause: "ASVS 5.0.0, V10.7.1"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only — confirming a genuine consent prompt exists (not auto-approved) requires UX/flow review"
    remediation_ref: "fix-playbook://OAUTH-34"

  - control_id: "OAUTH-35"
    name: "Present clear, sufficient information at the consent prompt"
    description: "The consent prompt must present sufficient and clear information about what is being consented to — the nature of requested authorizations, the identity of the authorized application, and the authorization lifetime, where applicable."
    source_clause: "ASVS 5.0.0, V10.7.2"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only — a UX/content-quality requirement not mechanically checkable"
    remediation_ref: "fix-playbook://OAUTH-35"

  - control_id: "OAUTH-36"
    name: "Allow users to review, modify, and revoke granted consents"
    description: "Users must be able to review, modify, and revoke consents they have granted through the authorization server."
    source_clause: "ASVS 5.0.0, V10.7.3"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only — confirming a genuinely usable consent-management UI exists requires interface review"
    remediation_ref: "fix-playbook://OAUTH-36"

