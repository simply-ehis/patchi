domain_id: "nextjs-app"
version: "1.0.0"
display_name: "Next.js App Security"
source_standard: "Next.js Security Best Practices + OWASP Top 10 (2021)"
component_type: "web-frontend"
cross_cutting: false
weight: 0.83

activation_signals:
  required_any:
    - signal: "build_file:next.config.js,next.config.mjs,next.config.ts"
    - signal: "deps:next"
    - signal: "import_pattern:next/server"
    - signal: "import_pattern:next/navigation"
    - signal: "import_pattern:next/headers"
    - signal: "infra_files:src/app/**/page.tsx,src/app/**/page.js,src/app/**/route.ts,src/pages/**"
  excluded_if:
    - signal: "next_import_only_in_storybook_or_tests"

controls:
  - control_id: "NJS-NEXT-001"
    name: "Server Actions without rate limiting or reCAPTCHA"
    description: "Detect Next.js 14+ Server Actions ('use server' functions, or async functions exported from a page/layout with 'use server' directive) that perform state-changing operations (write to DB, send email, charge payment) without rate limiting or bot protection. Server Actions are POST endpoints automatically created by Next.js at unpredictable URLs (/__nextjs_original-stack-frame, but the action ID is in the request body) - they are NOT protected by CSRF tokens by default (Next.js relies on Origin header check, similar to SvelteKit). An attacker can call a Server Action directly via fetch() without rendering the page. Flag any 'use server' function that does not call a rate-limiter (e.g. rate-limiter-flexible, upstash/ratelimit) or verify a reCAPTCHA token."
    source_clause: "CWE-799 + OWASP A07:2021"
    severity: "high"
    check_method: "static"
    detector: "semgrep:javascript.nextjs-server-action-without-ratelimit + semgrep:javascript.nextjs-server-action-without-recaptcha"
    remediation_ref: "fix-playbook://NJS-NEXT-001"

  - control_id: "NJS-NEXT-002"
    name: "Sensitive data leaked via getServerSideProps / Server Component return"
    description: "Detect Next.js pages with getServerSideProps (Pages Router) or Server Components (App Router, default in src/app/) that return objects containing sensitive fields to the client. In Next.js, anything returned from getServerSideProps is serialized as JSON and sent to the client as props (visible in __NEXT_DATA__ script tag in the HTML source). In App Router, anything returned from a Server Component is serialized as RSC payload (visible in the page source as encoded JSON). Flag: return { user } (spreads full DB record), return { session } (leaks session token), return { dbPassword, ...safeFields }. The fix is to destructure and return ONLY the fields the component renders: return { id: user.id, email: user.email }."
    source_clause: "CWE-200 + OWASP A01:2021"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:javascript.nextjs-getserversideprops-return-sensitive + semgrep:javascript.nextjs-server-component-return-sensitive"
    remediation_ref: "fix-playbook://NJS-NEXT-002"

  - control_id: "NJS-NEXT-003"
    name: "Middleware matcher bypass"
    description: "Detect Next.js middleware (middleware.ts in root or src/) with a matcher config that does not cover all sensitive routes, allowing auth/CSRF checks in the middleware to be bypassed. Common bypass patterns: (1) matcher: ['/api/*'] but sensitive pages under /admin are not protected; (2) matcher using negative lookahead that an attacker can evade with URL encoding (/admin%2Fsecret bypasses /admin/(?!login)); (3) middleware that checks auth but the matcher excludes /_next/static which is correct, but also excludes /api/auth which lets attackers hit the callback directly. The check should flag any middleware whose matcher does not include all routes that the middleware's auth check is meant to protect."
    source_clause: "CWE-285 + CWE-863"
    severity: "high"
    check_method: "static"
    detector: "semgrep:javascript.nextjs-middleware-matcher-bypass + manual-review of matcher vs. auth check scope"
    remediation_ref: "fix-playbook://NJS-NEXT-003"

  - control_id: "NJS-NEXT-004"
    name: "Image optimization SSRF"
    description: "Detect Next.js Image Optimization (next/image with the default loader, or the /_next/image endpoint) configured to allow remote images from arbitrary domains, enabling Server-Side Request Forgery. By default, next.config.js remotePatterns is empty (safe). Misconfigurations include: remotePatterns: [{ hostname: '**' }] (allow any host), remotePatterns with protocol: 'http' allowing internal-network SSRF, or a custom image loader that fetches arbitrary URLs. The /_next/image?url=...&w=...&q=... endpoint fetches the URL server-side, so an attacker can use it to scan internal services (http://169.254.169.254 for AWS metadata, http://localhost:6379 for Redis, etc.). The fix is to enumerate allowed hosts explicitly and reject all others."
    source_clause: "CWE-918"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:javascript.nextjs-image-remote-patterns-wildcard + semgrep:javascript.nextjs-custom-image-loader-arbitrary-url"
    remediation_ref: "fix-playbook://NJS-NEXT-004"

  - control_id: "NJS-NEXT-005"
    name: "Server-only secret leaked via process.env in Client Component"
    description: "Detect Client Components (files with 'use client' directive, or components imported by a Client Component) that reference process.env.SECRET_NAME or process.env.DATABASE_URL, leaking server-only secrets into the client bundle. Next.js only exposes env vars prefixed with NEXT_PUBLIC_ to the client; referencing process.env.SECRET in a Client Component evaluates to undefined at runtime BUT Next.js's bundler may inline the value at build time if the env var is set, leaking it. Flag any 'use client' file that references process.env.<non-NEXT_PUBLIC_> or imports from a file that does. Also flag next.config.js env: { SECRET: process.env.SECRET } which exposes the var to the client unconditionally."
    source_clause: "CWE-200 + CWE-540"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:javascript.nextjs-client-component-process-env-secret + semgrep:javascript.nextjs-config-env-exposes-secret"
    remediation_ref: "fix-playbook://NJS-NEXT-005"

  - control_id: "NJS-NEXT-006"
    name: "API route handler with weak input validation"
    description: "Detect Next.js API Route Handlers (app/api/*/route.ts with GET/POST/etc. functions, or pages/api/*.ts with req/res) that read user input from req.body, req.query, req.headers, or searchParams without validation via Zod, Yup, Joi, or similar. The Next.js App Router searchParams and request.json() return untyped data - TypeScript types are assertions, not validations. Flag any route handler that does request.json() and uses the result without a schema.parse() call. Also flag handlers that use req.query.id as a number without Number.isFinite check (NaN propagation), and handlers that interpolate req.query into SQL or fs paths without sanitization."
    source_clause: "CWE-20 + OWASP A03:2021"
    severity: "high"
    check_method: "static"
    detector: "semgrep:javascript.nextjs-api-route-without-zod + semgrep:javascript.nextjs-app-router-route-without-validation"
    remediation_ref: "fix-playbook://NJS-NEXT-006"

  - control_id: "NJS-NEXT-007"
    name: "Unsafe redirect in middleware or route handler"
    description: "Detect Next.js middleware or route handlers that call NextResponse.redirect() or NextResponse.rewrite() with a URL derived from user input (searchParams.get('next'), req.headers.get('referer'), request.nextUrl.searchParams) without an allow-list. Open redirect in Next.js is exploitable for phishing (a legitimate-looking URL on your domain redirects to an attacker site) and, when combined with session cookies, for token leakage. The check should flag redirect(url.searchParams.get('next')), redirect(req.headers.get('referer') || '/'), and any redirect to a URL constructed with new URL(userInput) without origin comparison. The fix is to validate the redirect target against an allow-list of paths, or confirm target.origin === request.nextUrl.origin."
    source_clause: "CWE-601"
    severity: "high"
    check_method: "static"
    detector: "semgrep:javascript.nextjs-redirect-with-user-input + semgrep:javascript.nextjs-rewrite-with-user-input"
    remediation_ref: "fix-playbook://NJS-NEXT-007"
