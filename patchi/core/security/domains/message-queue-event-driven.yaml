domain_id: "message-queue-event-driven"
version: "1.0.1"
display_name: "Message Queue / Event-Driven Architecture Security"
# SOURCE CURRENCY NOTE (verified 2026-07-04):
# No single dedicated OWASP project exists for asynchronous messaging/event-
# driven security, consistent with the task's framing. This domain combines:
# (a) OWASP ASVS 5.0.0 (2025-05-30, current) general validation/authorization
# sections (V1.2 Injection Prevention, V8 Authorization, V11 Cryptography),
# adapted from their original web/API-request framing to the async
# message-consumption context — labeled adapted throughout; (b) official
# Apache Kafka documentation (kafka.apache.org, current stable branch,
# Security/Authorization-and-ACLs pages, verified current as of 2026-07-04);
# and (c) official AWS SQS documentation (docs.aws.amazon.com, Security best
# practices, Encryption at rest, Dead-letter queues, and the AWS Security
# Blog's least-privilege/confused-deputy guide), labeled as vendor guidance.
# Kafka and SQS were chosen as representative brokers per the task; RabbitMQ-
# specific citations were not independently verified in this pass and would
# need separate sourcing if Patchi later wants engine-gated RabbitMQ controls
# analogous to the data-layer domain's engine_gate pattern.
source_standard: "OWASP ASVS 5.0.0 (2025-05-30) sections V1.2, V8, V11, adapted to async messaging contexts; official Apache Kafka security documentation (current stable branch); official AWS SQS documentation and AWS Security Blog (vendor guidance) — see per-control source_clause"
component_type: "event-driven"
weight: 0.8

activation_signals:
  required_any:
    - signal: "codebase imports a message broker client library (kafkajs, confluent-kafka, kafka-python, pika/amqplib for RabbitMQ, boto3/aws-sdk SQS or SNS clients, google-cloud-pubsub) or defines an event-driven handler consuming from a queue/topic/stream"
    - signal: "repository contains infrastructure-as-code provisioning a message broker, topic, or queue (e.g. AWS::SQS::Queue, MSK/Kafka cluster definitions, RabbitMQ vhost/exchange configuration)"
  excluded_if:
    - signal: "component only uses an in-process event emitter or synchronous function calls with no cross-process/cross-service message broker involved"

controls:
  - control_id: "MQ-01"
    name: "Authenticated producers and consumers"
    description: "Every producer and consumer connecting to the message broker must authenticate with a distinct identity — no anonymous or shared-credential connections to production topics/queues. For Kafka, this means SASL (SCRAM or OAUTHBEARER preferred over PLAIN) or mutual TLS; for AWS SQS, this means IAM roles supplying temporary credentials rather than long-lived access keys distributed to application code."
    source_clause: "Apache Kafka official documentation, 'Authentication using SASL' (kafka.apache.org/documentation/#security) — describes SASL/SCRAM and mTLS as the supported authentication mechanisms, with SASL/PLAIN's cleartext-credential caveat explicitly noted; AWS SQS official documentation, 'Security best practices' — 'You should use an IAM role to manage temporary credentials for applications or services that need to access Amazon SQS... Instead of distributing long-term credentials.'"
    severity: "critical"
    check_method: "manual-review"
    detector: "manual-review only; for Kafka, kafka-acls.sh --list combined with broker listener configuration review; for AWS, IAM Access Analyzer can flag anonymous/public queue policies"
    remediation_ref: "fix-playbook://MQ-01"

  - control_id: "MQ-02"
    name: "Least-privilege, per-topic/queue authorization"
    description: "Each producer or consumer identity must be granted access to only the specific topics/queues and operations (produce/write vs. consume/read vs. administrative) it actually needs, rather than a broad grant covering all topics or queues in the broker/account. Wildcard grants (Kafka ACLs on '*', SQS policies with Resource: '*' or Action: 'sqs:*') must not be used where a specific, scoped grant would suffice."
    source_clause: "Apache Kafka official documentation, 'Authorization and ACLs' — describes per-principal, per-resource, per-operation ACL scoping as the intended model; AWS SQS official documentation, 'Access management for encrypted Amazon SQS queues with least privilege policies' — describes constructing narrowly-scoped queue and KMS key policies per producer/consumer role. Cross-references OWASP ASVS 5.0.0, V8 Authorization (general least-privilege principle)."
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only; kafka-acls.sh --list for Kafka; AWS IAM Access Analyzer and a manual review of SQS queue/KMS key policies for AWS"
    remediation_ref: "fix-playbook://MQ-02"

  - control_id: "MQ-03"
    name: "Enforced encryption in transit for broker connections"
    description: "All connections between producers/consumers and the broker must use TLS; plaintext broker listeners (Kafka PLAINTEXT/SASL_PLAINTEXT protocols, unencrypted AMQP, HTTP-only SQS API calls) must not be reachable in any environment beyond a fully isolated local development setup. For AWS SQS specifically, the queue policy should deny requests that don't use SSL."
    source_clause: "Apache Kafka official documentation — SASL_SSL / SSL listener protocols are the documented production-recommended configuration, with PLAINTEXT explicitly flagged as insecure-by-default; AWS SQS official documentation, 'Security best practices' — 'Allow only encrypted connections over HTTPS (TLS) using the aws:SecureTransport condition in the queue policy to force requests to use SSL.'"
    severity: "critical"
    check_method: "static"
    detector: "Checkov, tfsec (IaC scan for an aws:SecureTransport deny condition on SQS queue policies); for self-hosted Kafka listener configuration, which is typically not declared the same way in IaC, fall back to manual-review of listeners/advertised.listeners broker configuration"
    remediation_ref: "fix-playbook://MQ-03"

  - control_id: "MQ-04"
    name: "Encryption at rest for message bodies"
    description: "Message bodies persisted by the broker (queued-but-unconsumed messages, Kafka's committed log segments) must be encrypted at rest. For AWS SQS, this means enabling server-side encryption (SSE-SQS or, for finer-grained key control and auditability, SSE-KMS). For self-hosted brokers (Kafka, RabbitMQ), this means encrypting the underlying disk/volume the broker's data directory resides on."
    source_clause: "AWS SQS official documentation, 'Encryption at rest in Amazon SQS' — describes SSE-SQS and SSE-KMS options, noting SSE 'encrypts the body of a message... anonymous SendMessage and ReceiveMessage requests to the encrypted queue will be rejected.' For self-hosted brokers, adapted from OWASP ASVS 5.0.0, V11 Cryptography general encryption-at-rest principle, since Kafka/RabbitMQ do not provide message-body-level SSE equivalent to SQS and instead rely on underlying disk encryption."
    severity: "high"
    check_method: "manual-review"
    detector: "cloud config scanners (Checkov, tfsec, Prowler) can verify SQS SSE is enabled and, for self-hosted brokers, verify underlying volume encryption where broker infrastructure is defined as IaC"
    remediation_ref: "fix-playbook://MQ-04"

  - control_id: "MQ-05"
    name: "Message payload validation at consumption (treat message content as untrusted)"
    description: "Every consumer must validate an incoming message's schema, type, and value ranges before acting on it, exactly as it would validate an HTTP request body — regardless of which producer is believed to have sent it. A message must not be trusted merely because it arrived on an expected topic/queue, since a misconfigured or compromised producer, or a message injected by an entity with unintended write access, could otherwise reach the consumer unchecked."
    source_clause: "Adapted — OWASP ASVS 5.0.0, V1.2 Injection Prevention (originally framed around HTTP request/API input), applied to the asynchronous message-consumption trust boundary, which is architecturally equivalent (an external, potentially untrusted data source feeding application logic) but not explicitly addressed by ASVS's request/response framing."
    severity: "critical"
    check_method: "static"
    detector: "custom Semgrep/AST rule confirming a schema-validation call (JSON Schema/Avro/Protobuf) precedes business logic in each consumer handler; no off-the-shelf, broker-agnostic open-source detector for this specific pattern was identified as of 2026-07-04"
    remediation_ref: "fix-playbook://MQ-05"

  - control_id: "MQ-06"
    name: "Message-level integrity verification beyond transport encryption"
    description: "For messages whose integrity matters beyond the lifetime of a single TLS-encrypted hop (e.g. messages that pass through multiple brokers, are persisted for later replay, or are produced by a party the consumer doesn't fully trust), the consumer should verify a message-level integrity mechanism (e.g. a signature or HMAC over the message body) rather than relying solely on transport-layer TLS, which protects data in transit for one hop but not data at rest in the broker or across a multi-hop relay."
    source_clause: "Adapted — OWASP ASVS 5.0.0, V11 Cryptography (message/data integrity principles), applied to the specific case where transport encryption alone (MQ-03) is insufficient because the broker itself, or an intermediate relay, is not fully within the trust boundary the message's integrity needs to survive."
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://MQ-06"

  - control_id: "MQ-07"
    name: "Bounded retry with dead-letter queue for poison messages"
    description: "Every queue/topic consumer must have a bounded maximum delivery/retry count (e.g. SQS's maxReceiveCount, or an equivalent consumer-side retry limit for Kafka), after which a message that repeatedly fails processing is routed to a dead-letter queue rather than being retried indefinitely or silently dropped. This prevents a single malformed or adversarially-crafted 'poison message' from consuming unbounded processing resources or blocking the queue for other messages."
    source_clause: "AWS SQS official documentation, 'Using dead-letter queues in Amazon SQS' — 'Amazon SQS supports dead-letter queues (DLQs), which source queues can target for messages that are not processed successfully'; the maxReceiveCount attribute (default 10, configurable) defines the bounded-retry threshold."
    severity: "high"
    check_method: "static"
    detector: "Checkov, tfsec (IaC scan verifying RedrivePolicy/maxReceiveCount is configured on SQS queue definitions); manual-review for non-IaC-defined queues or for equivalent bounded-retry logic in custom Kafka consumer code, which these scanners do not inspect"
    remediation_ref: "fix-playbook://MQ-07"

  - control_id: "MQ-08"
    name: "Restricted dead-letter queue access (redrive allow policy)"
    description: "Access to a dead-letter queue must be restricted to only the specific source queues that should be able to redrive messages into it, rather than left at a permissive default that allows any queue in the account to target it. Messages in a DLQ are often exactly the messages most likely to contain malformed, adversarial, or sensitive-but-misrouted content, making the DLQ itself a meaningful target."
    source_clause: "AWS SQS official documentation, 'Using dead-letter queues in Amazon SQS' — 'The redrive allow policy specifies which source queues can access the dead-letter queue... The default allows all source queues to use the dead-letter queue' (redrivePermission: allowAll); the documentation explicitly offers byQueue and denyAll as more restrictive alternatives."
    severity: "medium"
    check_method: "static"
    detector: "IaC scan (Checkov, tfsec) for RedriveAllowPolicy configuration on SQS queue definitions; manual-review for non-AWS brokers lacking an equivalent native construct"
    remediation_ref: "fix-playbook://MQ-08"

  - control_id: "MQ-09"
    name: "Idempotent consumers to mitigate at-least-once redelivery and replay"
    description: "Because most message brokers provide at-least-once delivery semantics (a message can be redelivered after a visibility-timeout expiry, consumer crash, or explicit replay/redrive), consumers must be designed to process a given message idempotently — using a message ID or equivalent deduplication key to detect and skip a message already successfully processed — so that a duplicate delivery does not cause a duplicated side effect (e.g. double-charging a payment, double-sending a notification)."
    source_clause: "Adapted — informed by AWS SQS's documented redelivery/retry behavior (e.g. standard queue at-least-once delivery, and the retry-count behavior described in the dead-letter-queue documentation) and Kafka's documented at-least-once default delivery semantics; neither vendor frames idempotent consumption as an explicit security MUST, but the security consequence (duplicated privileged actions from a replayed or redelivered message) is the same class of risk as the github-app-bot domain's GHA-10 webhook-replay control, applied here to message consumption generally."
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only; static review of consumer handler code for a deduplication-key check (e.g. a database unique constraint or cache-based check on message ID) prior to executing side effects"
    remediation_ref: "fix-playbook://MQ-09"

  - control_id: "MQ-10"
    name: "Confused-deputy prevention for cross-service queue access"
    description: "Where another AWS service (or cross-account principal) is granted permission to send messages to a queue via a resource-based policy, that policy must be scoped using source-restriction condition keys (aws:SourceArn, aws:SourceAccount, or aws:PrincipalOrgID) to the specific expected source resource, rather than a broad principal grant that could be invoked by an unintended resource of the same service type in a different account."
    source_clause: "AWS Security Blog / AWS SQS official documentation, 'How to set up least privilege access to your encrypted Amazon SQS queue' and 'Access management for encrypted Amazon SQS queues with least privilege policies' — both describe using aws:SourceArn, aws:SourceAccount, and aws:PrincipalOrgID specifically to 'address the confused deputy problem' in SQS resource policies."
    severity: "high"
    check_method: "static"
    detector: "IaC scan (Checkov, tfsec) for SQS/SNS resource policies granting service principals without a source-restriction condition key; AWS IAM Access Analyzer for runtime detection of unintended external access"
    remediation_ref: "fix-playbook://MQ-10"

deprecated_by: null
