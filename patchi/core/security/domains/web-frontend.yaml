# ============================================================================
# Patchi Security Domain: web-frontend
# ============================================================================
# SOURCE VERIFICATION NOTE (read before using):
#   Source standard: OWASP Application Security Verification Standard (ASVS)
#   Version: 5.0.0 — released 2025-05-30 at Global AppSec EU Barcelona.
#   Confidence: HIGH. Verified directly against the official machine-readable
#   CSV published by the OWASP/ASVS project at the v5.0.0 git tag:
#     https://raw.githubusercontent.com/OWASP/ASVS/v5.0.0/5.0/docs_en/
#     OWASP_Application_Security_Verification_Standard_5.0.0_en.csv
#   This is NOT a paraphrase from memory — every req_id, section name, and
#   requirement description below was copied from that CSV and only lightly
#   reworded into "description" (never verbatim, to respect ASVS's CC-BY-SA
#   license and to keep this file usable as an independent artifact).
#
#   ASVS 5.0.0 restructured the standard into 17 chapters (V1-V17), a
#   significant change from the 14-chapter v4.0.3. This domain uses chapter
#   V3 "Web Frontend Security" in its entirety (31 requirements across 7
#   sections), because that chapter is exactly scoped to browser-side
#   concerns (CSP, cookies, headers, origin separation, clickjacking,
#   XSS-adjacent rendering issues) — i.e. it does not need to be assembled
#   from scattered sections of other chapters. Requirement text belongs to
#   OWASP under CC-BY-SA 4.0.
#
#   SEVERITY MAPPING CONVENTION (disclosed explicitly, not invented per-item):
#   ASVS assigns each requirement a Level (L1/L2/L3), where L1 is the
#   baseline every app should meet, L2 is the recommended default for apps
#   handling sensitive data, and L3 is for the highest-assurance systems.
#   This taxonomy maps: L1 -> severity "high" (baseline; absence indicates a
#   real, opportunistically-exploitable gap), L2 -> severity "medium"
#   (still important, assumes more sophisticated attacker or higher data
#   sensitivity), L3 -> severity "low" (defense-in-depth / high-assurance
#   only). This is a mechanical convention Patchi applies consistently
#   across every ASVS-sourced domain, not a per-control judgment call.
# ============================================================================

domain_id: "web-frontend"
version: "1.0.0"
display_name: "Web Frontend Security"
source_standard: "OWASP ASVS 5.0.0 (Chapter V3: Web Frontend Security)"
component_type: "frontend-web"
weight: 0.75

activation_signals:
  required_any:
    - signal: "package_manifest_declares_frontend_framework (package.json dependencies/devDependencies include one of: react, react-dom, vue, @angular/core, svelte, solid-js)"
    - signal: "repo_contains_browser_entrypoint_html (a *.html file outside node_modules/dist/build that contains a <script> or <link> tag, OR an index.html at repo root or in a public/ or src/ directory)"
    - signal: "bundler_config_present (webpack.config.js, vite.config.js, vite.config.ts, next.config.js, nuxt.config.js, angular.json, or rollup.config.js present at repo root)"
  excluded_if:
    - signal: "component_classified_as_cli (Patchi's component classifier has already tagged this component component_type=cli, e.g. a bin field in package.json with no browser entrypoint, or a Python/Go/Rust CLI project layout)"
    - signal: "no_html_no_bundler_no_frontend_framework (none of the required_any signals fired)"

controls:
  - control_id: "WEBFRONT-01"
    name: "Documented browser security feature requirements"
    description: "Application documentation must state which browser security features (HTTPS, HSTS, CSP, etc.) the app requires, and define expected behavior (warn or block) when a browser lacks them."
    source_clause: "ASVS 5.0.0 V3.1.1"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://WEBFRONT-01"

  - control_id: "WEBFRONT-02"
    name: "Prevent unintended content-type rendering"
    description: "Responses for APIs, user-uploaded files, or other non-page resources must not be rendered by the browser in an unintended context (e.g. an uploaded HTML file executing as a page). Use Content-Disposition: attachment, CSP sandbox, or Sec-Fetch-* header validation."
    source_clause: "ASVS 5.0.0 V3.2.1"
    severity: "high"
    check_method: "dynamic"
    detector: "OWASP ZAP (active scan, response header analysis)"
    remediation_ref: "fix-playbook://WEBFRONT-02"

  - control_id: "WEBFRONT-03"
    name: "Safe text rendering (no innerHTML for untrusted text)"
    description: "Content meant to be displayed as plain text must use safe DOM APIs (textContent, createTextNode) rather than innerHTML/outerHTML/document.write, to prevent unintended HTML/JS execution."
    source_clause: "ASVS 5.0.0 V3.2.2"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: assignment to innerHTML/outerHTML/insertAdjacentHTML with a non-literal, non-sanitized right-hand side)"
    remediation_ref: "fix-playbook://WEBFRONT-03"

  - control_id: "WEBFRONT-04"
    name: "DOM clobbering prevention"
    description: "Client-side JavaScript must avoid DOM clobbering by using explicit variable declarations, strict type checks, avoiding globals attached to `document`, and namespace isolation."
    source_clause: "ASVS 5.0.0 V3.2.3"
    severity: "low"
    check_method: "manual-review"
    detector: "Semgrep can flag some patterns (e.g. reliance on global lookups of DOM-named variables) but full DOM-clobbering analysis is manual-review only"
    remediation_ref: "fix-playbook://WEBFRONT-04"

  - control_id: "WEBFRONT-05"
    name: "Cookie Secure attribute / __Secure- prefix"
    description: "Cookies must set the Secure attribute; if the cookie name does not use the __Host- prefix, it must use the __Secure- prefix."
    source_clause: "ASVS 5.0.0 V3.3.1"
    severity: "high"
    check_method: "dynamic"
    detector: "Mozilla HTTP Observatory"
    remediation_ref: "fix-playbook://WEBFRONT-05"

  - control_id: "WEBFRONT-06"
    name: "Cookie SameSite attribute set per purpose"
    description: "Each cookie's SameSite attribute must be deliberately set (Strict/Lax/None) according to its purpose, to limit CSRF and UI-redress exposure."
    source_clause: "ASVS 5.0.0 V3.3.2"
    severity: "medium"
    check_method: "dynamic"
    detector: "Mozilla HTTP Observatory"
    remediation_ref: "fix-playbook://WEBFRONT-06"

  - control_id: "WEBFRONT-07"
    name: "Cookie __Host- prefix"
    description: "Cookies must use the __Host- prefix unless explicitly designed to be shared with other hosts."
    source_clause: "ASVS 5.0.0 V3.3.3"
    severity: "medium"
    check_method: "dynamic"
    detector: "Mozilla HTTP Observatory"
    remediation_ref: "fix-playbook://WEBFRONT-07"

  - control_id: "WEBFRONT-08"
    name: "Cookie HttpOnly attribute for non-JS-readable values"
    description: "Cookies whose value must not be accessible to client-side scripts (e.g. session tokens) must set HttpOnly and only be transmitted via Set-Cookie."
    source_clause: "ASVS 5.0.0 V3.3.4"
    severity: "medium"
    check_method: "dynamic"
    detector: "Mozilla HTTP Observatory"
    remediation_ref: "fix-playbook://WEBFRONT-08"

  - control_id: "WEBFRONT-09"
    name: "Cookie size under 4096 bytes"
    description: "Cookie name+value combined must stay under 4096 bytes, or browsers may silently drop the cookie, breaking functionality that depends on it."
    source_clause: "ASVS 5.0.0 V3.3.5"
    severity: "low"
    check_method: "dynamic"
    detector: "no established open-source detector known; a small custom script inspecting Set-Cookie header length can check this"
    remediation_ref: "fix-playbook://WEBFRONT-09"

  - control_id: "WEBFRONT-10"
    name: "HSTS header present, max-age >= 1 year"
    description: "All responses must include Strict-Transport-Security with a max-age of at least 1 year; for L2+, includeSubDomains must also be set."
    source_clause: "ASVS 5.0.0 V3.4.1"
    severity: "high"
    check_method: "dynamic"
    detector: "Mozilla HTTP Observatory"
    remediation_ref: "fix-playbook://WEBFRONT-10"

  - control_id: "WEBFRONT-11"
    name: "CORS Access-Control-Allow-Origin validated or fixed"
    description: "Access-Control-Allow-Origin must be a fixed value, or the Origin request header must be validated against an allowlist. If '*' is used, the response must not contain sensitive data."
    source_clause: "ASVS 5.0.0 V3.4.2"
    severity: "high"
    check_method: "dynamic"
    detector: "OWASP ZAP (CORS misconfiguration active scan rule)"
    remediation_ref: "fix-playbook://WEBFRONT-11"

  - control_id: "WEBFRONT-12"
    name: "Content-Security-Policy header present with minimum directives"
    description: "Responses must include a Content-Security-Policy header defining trusted content sources. At minimum, a global policy including object-src 'none' and base-uri 'none', plus an allowlist or nonces/hashes, is required; L3 requires per-response nonces/hashes."
    source_clause: "ASVS 5.0.0 V3.4.3"
    severity: "medium"
    check_method: "dynamic"
    detector: "Google CSP Evaluator; Mozilla HTTP Observatory"
    remediation_ref: "fix-playbook://WEBFRONT-12"

  - control_id: "WEBFRONT-13"
    name: "X-Content-Type-Options: nosniff on all responses"
    description: "All HTTP responses must include X-Content-Type-Options: nosniff to prevent MIME-sniffing based attacks."
    source_clause: "ASVS 5.0.0 V3.4.4"
    severity: "medium"
    check_method: "dynamic"
    detector: "Mozilla HTTP Observatory"
    remediation_ref: "fix-playbook://WEBFRONT-13"

  - control_id: "WEBFRONT-14"
    name: "Referrer-Policy set to prevent sensitive data leakage"
    description: "A Referrer-Policy must be set (via header or HTML attribute) to prevent leaking sensitive path/query data to third parties via the Referer header."
    source_clause: "ASVS 5.0.0 V3.4.5"
    severity: "medium"
    check_method: "dynamic"
    detector: "Mozilla HTTP Observatory"
    remediation_ref: "fix-playbook://WEBFRONT-14"

  - control_id: "WEBFRONT-15"
    name: "CSP frame-ancestors directive (clickjacking protection)"
    description: "Every response must set the frame-ancestors CSP directive to prevent unintended embedding (clickjacking). The obsolete X-Frame-Options header must not be relied upon alone."
    source_clause: "ASVS 5.0.0 V3.4.6"
    severity: "medium"
    check_method: "dynamic"
    detector: "Mozilla HTTP Observatory; Google CSP Evaluator"
    remediation_ref: "fix-playbook://WEBFRONT-15"

  - control_id: "WEBFRONT-16"
    name: "CSP violation reporting endpoint configured"
    description: "The Content-Security-Policy header must specify a report-to or report-uri location so violations are observable."
    source_clause: "ASVS 5.0.0 V3.4.7"
    severity: "low"
    check_method: "dynamic"
    detector: "Google CSP Evaluator"
    remediation_ref: "fix-playbook://WEBFRONT-16"

  - control_id: "WEBFRONT-17"
    name: "Cross-Origin-Opener-Policy set on document responses"
    description: "HTML-rendering responses must include Cross-Origin-Opener-Policy (same-origin or same-origin-allow-popups) to defend against tabnabbing and cross-window attacks."
    source_clause: "ASVS 5.0.0 V3.4.8"
    severity: "low"
    check_method: "dynamic"
    detector: "Mozilla HTTP Observatory"
    remediation_ref: "fix-playbook://WEBFRONT-17"

  - control_id: "WEBFRONT-18"
    name: "CSRF defense for non-preflighted requests"
    description: "If the app doesn't rely on CORS preflight to block disallowed cross-origin calls to sensitive functionality, it must validate requests via anti-forgery tokens or non-CORS-safelisted headers."
    source_clause: "ASVS 5.0.0 V3.5.1"
    severity: "high"
    check_method: "dynamic"
    detector: "OWASP ZAP (CSRF active scan rule)"
    remediation_ref: "fix-playbook://WEBFRONT-18"

  - control_id: "WEBFRONT-19"
    name: "CSRF defense for preflight-reliant requests"
    description: "If the app relies on CORS preflight to block sensitive cross-origin calls, it must be impossible to trigger that functionality with a request that does not itself trigger a preflight (e.g. simple requests using only CORS-safelisted headers)."
    source_clause: "ASVS 5.0.0 V3.5.2"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only (requires understanding which endpoints are sensitive and how preflight is or isn't triggered)"
    remediation_ref: "fix-playbook://WEBFRONT-19"

  - control_id: "WEBFRONT-20"
    name: "Sensitive functionality uses non-safe HTTP methods"
    description: "Sensitive operations must use POST/PUT/PATCH/DELETE rather than HTTP-safe methods (GET/HEAD/OPTIONS), or strictly validate Sec-Fetch-* headers."
    source_clause: "ASVS 5.0.0 V3.5.3"
    severity: "high"
    check_method: "dynamic"
    detector: "OWASP ZAP"
    remediation_ref: "fix-playbook://WEBFRONT-20"

  - control_id: "WEBFRONT-21"
    name: "Separate applications hosted on separate hostnames"
    description: "Distinct applications should be hosted on different hostnames to get the full benefit of same-origin policy and hostname-scoped cookies."
    source_clause: "ASVS 5.0.0 V3.5.4"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only (architectural decision)"
    remediation_ref: "fix-playbook://WEBFRONT-21"

  - control_id: "WEBFRONT-22"
    name: "postMessage origin and payload validation"
    description: "Message listeners for window.postMessage must discard messages whose origin is untrusted or whose payload doesn't match the expected schema."
    source_clause: "ASVS 5.0.0 V3.5.5"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: 'message' event listener that does not check event.origin before use)"
    remediation_ref: "fix-playbook://WEBFRONT-22"

  - control_id: "WEBFRONT-23"
    name: "JSONP disabled application-wide"
    description: "JSONP functionality must not be enabled anywhere in the application, to prevent Cross-Site Script Inclusion (XSSI)."
    source_clause: "ASVS 5.0.0 V3.5.6"
    severity: "low"
    check_method: "static"
    detector: "Semgrep (rule: response handlers accepting a callback= / jsonp= query parameter and wrapping JSON in it)"
    remediation_ref: "fix-playbook://WEBFRONT-23"

  - control_id: "WEBFRONT-24"
    name: "No authorization-gated data in script resource responses"
    description: "Data requiring authorization must not be embedded in script resources (e.g. .js files) to prevent XSSI via cross-origin script inclusion."
    source_clause: "ASVS 5.0.0 V3.5.7"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://WEBFRONT-24"

  - control_id: "WEBFRONT-25"
    name: "Authenticated resource embedding restricted"
    description: "Authenticated resources (images, video, scripts, documents) should only be loadable/embeddable on the user's behalf when intended, via Sec-Fetch-* validation or a restrictive Cross-Origin-Resource-Policy header."
    source_clause: "ASVS 5.0.0 V3.5.8"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://WEBFRONT-25"

  - control_id: "WEBFRONT-26"
    name: "Subresource Integrity (SRI) for externally-hosted static assets"
    description: "Externally-hosted static assets (CDN-hosted JS/CSS/fonts) must be static, versioned, and use Subresource Integrity, unless a documented security decision justifies an exception."
    source_clause: "ASVS 5.0.0 V3.6.1"
    severity: "low"
    check_method: "static"
    detector: "Semgrep (rule: <script src=\"https://...\"> or <link rel=\"stylesheet\" href=\"https://...\"> missing an integrity attribute)"
    remediation_ref: "fix-playbook://WEBFRONT-26"

  - control_id: "WEBFRONT-27"
    name: "No unsupported/insecure client-side technologies"
    description: "The application must not use unsupported or insecure client-side technologies (Flash, Shockwave, ActiveX, Silverlight, NPAPI plugins, NaCl, client-side Java applets)."
    source_clause: "ASVS 5.0.0 V3.7.1"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: <object>/<embed> tags referencing .swf, application/x-shockwave-flash, or ActiveX classid attributes)"
    remediation_ref: "fix-playbook://WEBFRONT-27"

  - control_id: "WEBFRONT-28"
    name: "Automatic cross-domain redirects restricted to an allowlist"
    description: "Automatic redirects to a different, application-uncontrolled hostname/domain must only target destinations on an allowlist, to prevent open-redirect abuse."
    source_clause: "ASVS 5.0.0 V3.7.2"
    severity: "medium"
    check_method: "manual-review"
    detector: "Semgrep can flag likely redirect sinks (e.g. location.href/window.location assignment from a request parameter) as candidates, but allowlist correctness needs manual-review"
    remediation_ref: "fix-playbook://WEBFRONT-28"

  - control_id: "WEBFRONT-29"
    name: "User-facing warning before leaving application-controlled domain"
    description: "The app should show a cancelable notification before redirecting a user to a URL outside its control."
    source_clause: "ASVS 5.0.0 V3.7.3"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://WEBFRONT-29"

  - control_id: "WEBFRONT-30"
    name: "Top-level domain submitted to HSTS preload list"
    description: "The application's top-level domain should be added to the browser HSTS preload list so TLS enforcement doesn't rely solely on the Strict-Transport-Security header."
    source_clause: "ASVS 5.0.0 V3.7.4"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only (external submission process at hstspreload.org)"
    remediation_ref: "fix-playbook://WEBFRONT-30"

  - control_id: "WEBFRONT-31"
    name: "Documented fallback behavior for unsupported browser security features"
    description: "The application must behave as documented (warn or block) when a browser lacks an expected security feature."
    source_clause: "ASVS 5.0.0 V3.7.5"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://WEBFRONT-31"

