domain_id: "data-protection-privacy"
version: "1.0.0"
display_name: "Data Protection and Privacy Engineering"
source_standard: "OWASP Application Security Verification Standard (ASVS) 5.0.0, Chapter V14: Data Protection (fetched and verified directly from the official ASVS 5.0.0 markdown source, github.com/OWASP/ASVS, July 2026)."
component_type: "backend-api"
cross_cutting: true
weight: 0.8

# NOTE ON SCOPE: this domain is explicitly NOT a substitute for legal privacy-regulation
# compliance (GDPR, CCPA, etc.) — the chapter's own text states it deliberately avoids
# duplicating privacy legislation and instead focuses on technical data-protection
# mechanisms. Detecting bulk-extraction/abnormal-usage abuse is explicitly deferred by
# ASVS itself to logging-error-handling (V16); enforcing rate/quantity limits on data
# access is deferred to input-validation-business-logic (V2). Do not duplicate those
# controls here — this domain covers data classification, general protection mechanics,
# and client-side data leakage specifically. Also note overlap with mobile's existing
# MASVS-PRIVACY controls if mobile clients are in scope — the mobile domain's controls
# should be treated as the mobile-specific instance, this domain as the general/web/
# backend instance; de-duplicate for apps spanning both.

activation_signals:
  required_any:
    - signal: "processes_user_personal_data"       # any PII, account data, user-generated content
    - signal: "has_client_side_storage_usage"        # localStorage, sessionStorage, IndexedDB, cookies
    - signal: "has_caching_layer_configured"          # CDN, reverse proxy cache, application-level cache
  excluded_if:
    - signal: "no_sensitive_data_processed"          # app handles no personal/sensitive data of any kind (rare, but possible for pure infrastructure tooling)

controls:
  - control_id: "DATAPROT-01"
    name: "Identify and classify all sensitive data into protection levels"
    description: "All sensitive data created and processed by the application must be identified and classified into protection levels, including data that is only encoded (not encrypted) and therefore easily decoded, such as Base64 strings or the plaintext payload inside a JWT. Protection levels must account for any applicable data protection/privacy regulations."
    source_clause: "ASVS 5.0.0, V14.1.1"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only, though a static scan for common PII-shaped fields (email, SSN-like patterns, credit card number patterns) across the data model can seed the classification exercise"
    remediation_ref: "fix-playbook://DATAPROT-01"

  - control_id: "DATAPROT-02"
    name: "Document protection requirements per sensitivity level"
    description: "Every sensitive data protection level must have a documented set of protection requirements, including (at minimum) encryption, integrity verification, retention, logging treatment, access controls around sensitive data in logs, database-level encryption, and privacy-enhancing technologies to be used."
    source_clause: "ASVS 5.0.0, V14.1.2"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — documentation requirement"
    remediation_ref: "fix-playbook://DATAPROT-02"

  - control_id: "DATAPROT-03"
    name: "Never place sensitive data in URLs or query strings"
    description: "Sensitive data must only be sent to the server in the HTTP message body or header fields; the URL and query string must not contain sensitive information such as an API key or session token, since URLs are commonly logged by proxies, browsers, and servers."
    source_clause: "ASVS 5.0.0, V14.2.1"
    severity: "high"
    check_method: "static"
    detector: "Semgrep/CodeQL rule flagging API keys, tokens, or other sensitive values passed as URL query parameters rather than in the request body or headers"
    remediation_ref: "fix-playbook://DATAPROT-03"

  - control_id: "DATAPROT-04"
    name: "Prevent sensitive data from being cached in server-side infrastructure"
    description: "The application must prevent sensitive data from being cached in server components such as load balancers and application caches, or ensure the data is securely purged after use."
    source_clause: "ASVS 5.0.0, V14.2.2"
    severity: "medium"
    check_method: "static"
    detector: "Static config review of caching layers (CDN, reverse proxy, application cache) confirming sensitive-response routes are excluded from caching or explicitly configured with short/no-cache directives"
    remediation_ref: "fix-playbook://DATAPROT-04"

  - control_id: "DATAPROT-05"
    name: "Do not send classified sensitive data to untrusted third parties"
    description: "Defined sensitive data must not be sent to untrusted parties, such as third-party user-tracking/analytics scripts, to prevent unwanted collection of data outside the application's control."
    source_clause: "ASVS 5.0.0, V14.2.3"
    severity: "high"
    check_method: "static"
    detector: "CodeQL/Semgrep dataflow rule flagging sensitive data (per DATAPROT-01's classification) reaching a third-party analytics/tracking SDK call"
    remediation_ref: "fix-playbook://DATAPROT-05"

  - control_id: "DATAPROT-06"
    name: "Implement documented protection controls per data sensitivity level"
    description: "Controls around sensitive data — encryption, integrity verification, retention, logging treatment, access controls in logs, privacy-enhancing technologies — must be implemented exactly as defined in the documentation for that data's specific protection level (per DATAPROT-02)."
    source_clause: "ASVS 5.0.0, V14.2.4"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only — cross-referencing actual implementation against DATAPROT-02's documented per-level requirements"
    remediation_ref: "fix-playbook://DATAPROT-06"

  - control_id: "DATAPROT-07"
    name: "Prevent Web Cache Deception via strict cache content-type/existence checks"
    description: "Caching mechanisms must only cache responses matching the expected content type for that resource and must not cache sensitive dynamic content; the web server must return 404/302 (not a different valid file) when a non-existent file is accessed, to prevent Web Cache Deception attacks."
    source_clause: "ASVS 5.0.0, V14.2.5"
    severity: "high"
    check_method: "static"
    detector: "Static cache-config review confirming cache rules are scoped by exact content-type/path matching rather than loose extension-suffix matching that could be exploited via a crafted URL (e.g. /account/profile.css matching a static-asset cache rule while still returning dynamic HTML)"
    remediation_ref: "fix-playbook://DATAPROT-07"

  - control_id: "DATAPROT-08"
    name: "Return only the minimum required sensitive data; mask by default"
    description: "The application must return only the minimum required sensitive data for its functionality — for example, returning only some digits of a credit card number rather than the full number; if complete data is genuinely required, it must be masked in the UI unless the user specifically chooses to reveal it."
    source_clause: "ASVS 5.0.0, V14.2.6"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep/CodeQL rule flagging API responses/serializers that return a full sensitive value (e.g. complete card number, full SSN) rather than a masked/truncated representation"
    remediation_ref: "fix-playbook://DATAPROT-08"

  - control_id: "DATAPROT-09"
    name: "Enforce data retention classification and automatic deletion"
    description: "Sensitive information must be subject to a data retention classification, ensuring outdated or unnecessary data is deleted automatically, on a defined schedule, or as the situation requires."
    source_clause: "ASVS 5.0.0, V14.2.7"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only, though a static check can flag data-model tables/collections storing sensitive data with no accompanying retention/cleanup job as a candidate for review"
    remediation_ref: "fix-playbook://DATAPROT-09"

  - control_id: "DATAPROT-10"
    name: "Strip sensitive metadata from user-submitted files"
    description: "Sensitive information must be removed from the metadata of user-submitted files (e.g. GPS location and device details embedded in photo EXIF data) unless the user has explicitly consented to its storage."
    source_clause: "ASVS 5.0.0, V14.2.8"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming file-upload handling includes an EXIF/metadata-stripping step (e.g. via a library like sharp with metadata removal, or exiftool) before storage, rather than storing user-submitted files with metadata intact"
    remediation_ref: "fix-playbook://DATAPROT-10"

  - control_id: "DATAPROT-11"
    name: "Clear authenticated data from client storage on session termination"
    description: "Authenticated data must be cleared from client storage (such as the browser DOM) after the client or session is terminated; the 'Clear-Site-Data' HTTP response header can help, but client-side logic should also clear data if the server connection is unavailable when the session ends."
    source_clause: "ASVS 5.0.0, V14.3.1"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming the logout/session-termination flow includes explicit client-side storage clearing (or sets the Clear-Site-Data header) rather than only invalidating the server-side session"
    remediation_ref: "fix-playbook://DATAPROT-11"

  - control_id: "DATAPROT-12"
    name: "Set sufficient anti-caching headers on sensitive responses"
    description: "The application must set sufficient anti-caching HTTP response header fields (e.g. Cache-Control: no-store) so that sensitive data is not cached in browsers."
    source_clause: "ASVS 5.0.0, V14.3.2"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming responses containing sensitive data include Cache-Control: no-store (or equivalent) rather than a default/permissive caching header"
    remediation_ref: "fix-playbook://DATAPROT-12"

  - control_id: "DATAPROT-13"
    name: "Do not store sensitive data in browser storage, except session tokens"
    description: "Data stored in browser storage (localStorage, sessionStorage, IndexedDB, or cookies) must not contain sensitive data, with the sole exception of session tokens."
    source_clause: "ASVS 5.0.0, V14.3.3"
    severity: "high"
    check_method: "static"
    detector: "Semgrep/CodeQL rule flagging localStorage/sessionStorage/IndexedDB/cookie writes containing values matching sensitive-data patterns (per DATAPROT-01's classification) other than the designated session token"
    remediation_ref: "fix-playbook://DATAPROT-13"

deprecated_by: null
last_reviewed: "2026-07-09"
