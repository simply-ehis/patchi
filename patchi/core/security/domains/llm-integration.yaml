# ============================================================================
# Patchi Security Domain: llm-integration
# ============================================================================
# SOURCE VERIFICATION NOTE:
#   Source standard: OWASP Top 10 for LLM Applications, 2025 edition
#   (designations LLM01:2025 through LLM10:2025). Published by the OWASP
#   GenAI Security Project on 2024-11-18 (v2.0), still the current edition
#   as of this writing (July 2026) — confirmed via genai.owasp.org, which
#   shows no newer numbered edition. A separate, distinct "OWASP Top 10 for
#   Agentic Applications 2026" project also exists for autonomous-agent-
#   specific risks; that is NOT this list and is out of scope here (agentic
#   tool/permission risk is partially covered by LLM06:2025 Excessive
#   Agency, included below).
#   Confidence: HIGH. Every control below is drawn from the "Prevention and
#   Mitigation Strategies" section of the official page for that risk
#   category at https://genai.owasp.org/llmrisk/llm0N... — fetched
#   directly, not recalled from memory. Descriptions are reworded, not
#   verbatim; original text is OWASP's, licensed CC-BY-SA 4.0.
#
#   SEVERITY NOTE — IMPORTANT DIFFERENCE FROM OTHER DOMAINS IN THIS
#   TAXONOMY: unlike ASVS or the OWASP API Security Top 10, the LLM Top 10
#   document does NOT publish a per-category "Technical Impact" severity
#   table. Severity values below are therefore Patchi's own judgment,
#   calibrated by typical exploit outcome (categories whose common attack
#   scenarios lead to remote code execution, unauthorized system actions,
#   or direct data exfiltration are rated critical/high; categories whose
#   primary downside is business/reputational/legal, absent a direct
#   technical compromise, are rated medium). This is disclosed explicitly
#   because it is NOT a standard-derived rating the way other domains'
#   severities are — treat it as a reasonable default, not an authority.
#
#   This domain deliberately does NOT enumerate every single mitigation
#   bullet OWASP lists per category (some categories like LLM10 list 15).
#   Where a category lists many overlapping/advanced mitigations, this
#   taxonomy selects the subset that is most concretely checkable in a
#   typical application codebase, consistent with the brief's instruction
#   to prioritize genuinely checkable controls over exhaustive transcription.
# ============================================================================

domain_id: "llm-integration"
version: "1.0.0"
display_name: "LLM & Generative AI Integration Security"
source_standard: "OWASP Top 10 for LLM Applications 2025 (v2.0, published 2024-11-18)"
component_type: "llm-integration"
weight: 0.85

activation_signals:
  required_any:
    - signal: "llm_sdk_dependency_present (package manifest includes openai, anthropic, @anthropic-ai/sdk, langchain, llamaindex, google-generativeai, cohere-ai, transformers, or a direct HTTP client call to a known LLM inference endpoint such as api.openai.com, api.anthropic.com, generativelanguage.googleapis.com)"
    - signal: "vector_db_dependency_present (package manifest includes pinecone-client, chromadb, weaviate-client, qdrant-client, pgvector, or faiss, indicating a RAG pipeline)"
    - signal: "system_prompt_or_prompt_template_file_present (a file or string constant containing role-instruction language such as 'You are an AI assistant', or a dedicated prompts/ directory)"
  excluded_if:
    - signal: "no_llm_sdk_no_vector_db_no_prompt_template (none of the required_any signals fired anywhere in the codebase)"

controls:
  # ---- LLM01:2025 Prompt Injection ----
  - control_id: "LLM-01"
    name: "System prompt constrains model role, scope, and override resistance"
    description: "The system prompt should specify the model's role, capabilities, and limitations, enforce strict adherence to the intended task/topic, and instruct the model to disregard attempts to override its core instructions."
    source_clause: "OWASP LLM Top 10 2025, LLM01:2025 Prompt Injection, Prevention and Mitigation Strategies #1"
    severity: "high"
    check_method: "manual-review"
    detector: "promptfoo (open-source LLM eval/red-team CLI) can automate testing whether a system prompt holds under injection attempts; initial authoring is manual-review"
    remediation_ref: "fix-playbook://LLM-01"

  - control_id: "LLM-02"
    name: "Expected output format defined and deterministically validated"
    description: "The application should specify a clear expected output format/schema for the model and validate the actual response against it using deterministic code, not just trust the model's formatting."
    source_clause: "OWASP LLM Top 10 2025, LLM01:2025 Prompt Injection, Prevention and Mitigation Strategies #2"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: LLM response consumed directly by downstream code with no schema/format validation step, e.g. no JSON schema check before parsing)"
    remediation_ref: "fix-playbook://LLM-02"

  - control_id: "LLM-03"
    name: "Input and output content filtering for sensitive/disallowed categories"
    description: "Sensitive content categories should be defined and rules implemented to detect and handle them, applying semantic filters and string-checks on both what is sent to and returned from the model."
    source_clause: "OWASP LLM Top 10 2025, LLM01:2025 Prompt Injection, Prevention and Mitigation Strategies #3"
    severity: "medium"
    check_method: "dynamic"
    detector: "LLM Guard (open-source input/output scanning library); NVIDIA NeMo Guardrails"
    remediation_ref: "fix-playbook://LLM-03"

  - control_id: "LLM-04"
    name: "Least-privilege tool access; application, not model, holds API tokens"
    description: "The application should hold its own API tokens/credentials for any extensible functionality and implement those functions in code, restricting the model's access privileges to the minimum necessary rather than letting the model hold or directly wield credentials."
    source_clause: "OWASP LLM Top 10 2025, LLM01:2025 Prompt Injection, Prevention and Mitigation Strategies #4"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: an API key or credential value passed into a prompt string or model context rather than held server-side and invoked via a controlled function/tool call)"
    remediation_ref: "fix-playbook://LLM-04"

  - control_id: "LLM-05"
    name: "Human approval required before high-risk model-initiated actions"
    description: "Human-in-the-loop controls should be required before the model or its tools execute privileged or high-impact operations."
    source_clause: "OWASP LLM Top 10 2025, LLM01:2025 Prompt Injection, Prevention and Mitigation Strategies #5"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only (requires identifying which tool calls are 'high-risk' for this specific application)"
    remediation_ref: "fix-playbook://LLM-05"

  - control_id: "LLM-06"
    name: "Untrusted external content segregated and clearly denoted"
    description: "Content originating from external, untrusted sources (web pages, files, third-party API responses) that is fed into the model's context should be clearly separated and marked as untrusted to limit its influence on the model's behavior."
    source_clause: "OWASP LLM Top 10 2025, LLM01:2025 Prompt Injection, Prevention and Mitigation Strategies #6"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: external/fetched content concatenated directly into the same prompt string as system/user instructions with no delimiter or role separation)"
    remediation_ref: "fix-playbook://LLM-06"

  # ---- LLM02:2025 Sensitive Information Disclosure ----
  - control_id: "LLM-07"
    name: "Data sanitization and input validation before data reaches the model"
    description: "User-supplied or ingested data should be sanitized/validated to detect and filter potentially sensitive content before it enters the model's context or any training/fine-tuning pipeline."
    source_clause: "OWASP LLM Top 10 2025, LLM02:2025 Sensitive Information Disclosure, Prevention and Mitigation Strategies (Sanitization)"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: user input passed directly into a prompt template with no sanitization/PII-scrubbing function call)"
    remediation_ref: "fix-playbook://LLM-07"

  - control_id: "LLM-08"
    name: "Least-privilege access controls on sensitive data sources reachable by the model"
    description: "Access to sensitive data should be limited to the minimum necessary for the specific user/process, and the model's access to external data sources should be restricted with securely managed runtime data orchestration."
    source_clause: "OWASP LLM Top 10 2025, LLM02:2025 Sensitive Information Disclosure, Prevention and Mitigation Strategies (Access Controls)"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only (requires tracing which data sources/tools the model can reach and the identity used to access them)"
    remediation_ref: "fix-playbook://LLM-08"

  - control_id: "LLM-09"
    name: "Transparent data-use policy with training opt-out"
    description: "Clear terms of use should be provided describing data retention, usage, and deletion, letting users opt out of having their data used for model training."
    source_clause: "OWASP LLM Top 10 2025, LLM02:2025 Sensitive Information Disclosure, Prevention and Mitigation Strategies (User Education and Transparency)"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://LLM-09"

  - control_id: "LLM-10"
    name: "System prompt/preamble not user-overridable or directly exposable"
    description: "Users should not be able to override or directly access the system's initial configuration/system prompt, limiting exposure of internal configuration details."
    source_clause: "OWASP LLM Top 10 2025, LLM02:2025 Sensitive Information Disclosure, Prevention and Mitigation Strategies (Secure System Configuration #1)"
    severity: "medium"
    check_method: "dynamic"
    detector: "promptfoo / garak (open-source LLM vulnerability scanner; includes system-prompt-extraction test probes)"
    remediation_ref: "fix-playbook://LLM-10"

  - control_id: "LLM-11"
    name: "Error messages and configuration details do not leak sensitive information"
    description: "Following security-misconfiguration best practice, error responses and configuration details from the LLM-integrated application must not leak sensitive information."
    source_clause: "OWASP LLM Top 10 2025, LLM02:2025 Sensitive Information Disclosure, Prevention and Mitigation Strategies (Secure System Configuration #2, referencing OWASP API8:2023)"
    severity: "medium"
    check_method: "dynamic"
    detector: "OWASP ZAP (error-triggering active scan combined with response inspection, same approach as backend-api API-36)"
    remediation_ref: "fix-playbook://LLM-11"

  # ---- LLM03:2025 Supply Chain ----
  - control_id: "LLM-12"
    name: "Third-party model/data suppliers vetted and periodically re-audited"
    description: "Data sources and suppliers, including their terms and privacy policies, should be carefully vetted before use, with regular review to catch any change in security posture or terms."
    source_clause: "OWASP LLM Top 10 2025, LLM03:2025 Supply Chain, Prevention and Mitigation Strategies #1"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only (vendor assessment process)"
    remediation_ref: "fix-playbook://LLM-12"

  - control_id: "LLM-13"
    name: "Vulnerability scanning and patch management applied to ML/AI dependencies"
    description: "Standard vulnerable-and-outdated-component mitigations (vulnerability scanning, management, patching) must be applied to ML/AI-specific dependencies, including in development environments with sensitive data access."
    source_clause: "OWASP LLM Top 10 2025, LLM03:2025 Supply Chain, Prevention and Mitigation Strategies #2 (referencing OWASP A06:2021)"
    severity: "high"
    check_method: "static"
    detector: "OSV-Scanner; Gitleaks (for accidentally-committed model/API credentials in the same repos)"
    remediation_ref: "fix-playbook://LLM-13"

  - control_id: "LLM-14"
    name: "Software/AI Bill of Materials (SBOM/AI-BOM) maintained for all components"
    description: "An up-to-date, accurate, and signed inventory of components — including models, datasets, and libraries — should be maintained via SBOM/AI-BOM tooling to detect tampering and enable rapid response to newly disclosed vulnerabilities."
    source_clause: "OWASP LLM Top 10 2025, LLM03:2025 Supply Chain, Prevention and Mitigation Strategies #4"
    severity: "medium"
    check_method: "static"
    detector: "OWASP CycloneDX (SBOM/AI-BOM generation tooling explicitly recommended by this OWASP guidance)"
    remediation_ref: "fix-playbook://LLM-14"

  - control_id: "LLM-15"
    name: "Model integrity verified via signing/hashes from verifiable sources"
    description: "Models should only be sourced from verifiable origins, with integrity checks (signing, file hashes) used to compensate for the lack of strong provenance guarantees in most published models; externally supplied code should be code-signed."
    source_clause: "OWASP LLM Top 10 2025, LLM03:2025 Supply Chain, Prevention and Mitigation Strategies #6"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only (requires checking model-loading code against a hash/signature verification step)"
    remediation_ref: "fix-playbook://LLM-15"

  - control_id: "LLM-16"
    name: "Collaborative model-development environments monitored for abuse"
    description: "Shared/collaborative model-merge, fine-tuning, or format-conversion environments should have strict monitoring and auditing to detect abuse quickly."
    source_clause: "OWASP LLM Top 10 2025, LLM03:2025 Supply Chain, Prevention and Mitigation Strategies #7"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://LLM-16"

  - control_id: "LLM-17"
    name: "Patching policy ensures maintained versions of models and dependent APIs"
    description: "A patching policy should ensure the application relies on maintained versions of both the underlying model/API and its supporting components, retiring vulnerable or deprecated ones."
    source_clause: "OWASP LLM Top 10 2025, LLM03:2025 Supply Chain, Prevention and Mitigation Strategies #9"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://LLM-17"

  # ---- LLM04:2025 Data and Model Poisoning ----
  - control_id: "LLM-18"
    name: "Data provenance tracked through the model lifecycle"
    description: "Data origins and transformations should be tracked with tools like OWASP CycloneDX or ML-BOM, verifying data legitimacy at every stage of model development."
    source_clause: "OWASP LLM Top 10 2025, LLM04:2025 Data and Model Poisoning, Prevention and Mitigation Strategies #1"
    severity: "medium"
    check_method: "manual-review"
    detector: "OWASP CycloneDX / ML-BOM tooling for provenance tracking; verification itself is manual-review"
    remediation_ref: "fix-playbook://LLM-18"

  - control_id: "LLM-19"
    name: "Sandboxing and anomaly detection limit exposure to unverified data"
    description: "Model exposure to unverified data sources should be sandboxed, with anomaly-detection techniques used to filter out adversarial or poisoned data."
    source_clause: "OWASP LLM Top 10 2025, LLM04:2025 Data and Model Poisoning, Prevention and Mitigation Strategies #3"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only (requires assessing the data-ingestion pipeline's isolation)"
    remediation_ref: "fix-playbook://LLM-19"

  - control_id: "LLM-20"
    name: "Dataset version control tracks changes and detects manipulation"
    description: "Data version control (DVC) or equivalent should be used to track dataset changes over time, helping detect unauthorized manipulation and maintain model integrity."
    source_clause: "OWASP LLM Top 10 2025, LLM04:2025 Data and Model Poisoning, Prevention and Mitigation Strategies #6"
    severity: "medium"
    check_method: "static"
    detector: "manual-review to confirm DVC (or equivalent) is actually in use for the training/fine-tuning dataset repository"
    remediation_ref: "fix-playbook://LLM-20"

  - control_id: "LLM-21"
    name: "User-supplied information isolated in a vector store rather than used to retrain"
    description: "Information supplied by users during interactions should be stored in a vector database (adjustable independently) rather than fed back into full model retraining, limiting poisoning blast radius."
    source_clause: "OWASP LLM Top 10 2025, LLM04:2025 Data and Model Poisoning, Prevention and Mitigation Strategies #7"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only (architectural review of the fine-tuning/retraining pipeline)"
    remediation_ref: "fix-playbook://LLM-21"

  - control_id: "LLM-22"
    name: "Retrieval-Augmented Generation used at inference to reduce hallucination/poisoning impact"
    description: "RAG and grounding techniques should be integrated at inference time to reduce the risk that poisoned training data (or hallucination) produces unreliable outputs."
    source_clause: "OWASP LLM Top 10 2025, LLM04:2025 Data and Model Poisoning, Prevention and Mitigation Strategies #10"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only (architectural check for RAG presence and grounding quality)"
    remediation_ref: "fix-playbook://LLM-22"

  # ---- LLM05:2025 Improper Output Handling ----
  - control_id: "LLM-23"
    name: "Model output treated as untrusted input to backend functions (zero-trust)"
    description: "LLM output must be treated like any other untrusted user input, with the same input-validation controls applied before it reaches backend functions, following ASVS input-validation guidance."
    source_clause: "OWASP LLM Top 10 2025, LLM05:2025 Improper Output Handling, Prevention and Mitigation Strategies #1-2"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep (rule: LLM response text passed directly into exec(), eval(), a shell command, or a system call with no validation)"
    remediation_ref: "fix-playbook://LLM-23"

  - control_id: "LLM-24"
    name: "Context-aware output encoding applied to LLM-generated content"
    description: "Model output must be encoded appropriately for the context it will be used in (HTML encoding for web content, SQL escaping for database queries, etc.) to prevent injection when rendered or executed downstream."
    source_clause: "OWASP LLM Top 10 2025, LLM05:2025 Improper Output Handling, Prevention and Mitigation Strategies #3-4"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep (rule: LLM-generated text inserted into an HTML template without an escaping function, or concatenated into a SQL string)"
    remediation_ref: "fix-playbook://LLM-24"

  - control_id: "LLM-25"
    name: "Parameterized queries used for any database operation involving LLM output"
    description: "All database operations that incorporate LLM-generated content (e.g. LLM-assisted query building) must use parameterized queries or prepared statements rather than string concatenation."
    source_clause: "OWASP LLM Top 10 2025, LLM05:2025 Improper Output Handling, Prevention and Mitigation Strategies #5"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep (rule: LLM output string-concatenated into a raw SQL query instead of passed as a bound parameter)"
    remediation_ref: "fix-playbook://LLM-25"

  - control_id: "LLM-26"
    name: "Content Security Policy mitigates XSS from LLM-generated content"
    description: "A strict Content Security Policy should be applied wherever LLM-generated content is rendered in a browser, mitigating the impact of any unsanitized script/markup the model produces."
    source_clause: "OWASP LLM Top 10 2025, LLM05:2025 Improper Output Handling, Prevention and Mitigation Strategies #6"
    severity: "high"
    check_method: "dynamic"
    detector: "Mozilla HTTP Observatory / Google CSP Evaluator (same detectors as web-frontend WEBFRONT-12)"
    remediation_ref: "fix-playbook://LLM-26"

  - control_id: "LLM-27"
    name: "Logging and monitoring detect unusual LLM output patterns"
    description: "Robust logging and monitoring should be implemented to detect unusual patterns in LLM outputs that might indicate an exploitation attempt in progress."
    source_clause: "OWASP LLM Top 10 2025, LLM05:2025 Improper Output Handling, Prevention and Mitigation Strategies #7"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only (requires confirming logging/alerting infrastructure exists for LLM output)"
    remediation_ref: "fix-playbook://LLM-27"

  # ---- LLM06:2025 Excessive Agency ----
  - control_id: "LLM-28"
    name: "Model/agent extensions limited to the minimum necessary set"
    description: "The set of extensions/tools an LLM agent can call should be limited strictly to what the application actually needs, removing unused or trial extensions."
    source_clause: "OWASP LLM Top 10 2025, LLM06:2025 Excessive Agency, Prevention and Mitigation Strategies #1"
    severity: "critical"
    check_method: "manual-review"
    detector: "manual-review only (requires reviewing the registered tool/function list against actual product requirements)"
    remediation_ref: "fix-playbook://LLM-28"

  - control_id: "LLM-29"
    name: "Extension functionality scoped to single, minimal purpose"
    description: "Functions implemented in an LLM extension should be limited to the minimum necessary (e.g. a mail-reading extension should not also be able to send or delete mail)."
    source_clause: "OWASP LLM Top 10 2025, LLM06:2025 Excessive Agency, Prevention and Mitigation Strategies #2"
    severity: "critical"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://LLM-29"

  - control_id: "LLM-30"
    name: "Open-ended tools (arbitrary shell/exec/fetch) avoided in favor of granular ones"
    description: "Open-ended extensions such as 'run a shell command' or 'fetch any URL' should be avoided in favor of narrowly-scoped, purpose-built extensions with limited functionality."
    source_clause: "OWASP LLM Top 10 2025, LLM06:2025 Excessive Agency, Prevention and Mitigation Strategies #3"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep (rule: a tool/function definition exposed to the model that wraps a generic shell exec, eval, or unrestricted HTTP fetch)"
    remediation_ref: "fix-playbook://LLM-30"

  - control_id: "LLM-31"
    name: "Extension permissions on downstream systems minimized"
    description: "Extensions should connect to downstream systems (databases, APIs) using identities scoped to the minimum permissions needed — e.g. read-only access when only reads are required."
    source_clause: "OWASP LLM Top 10 2025, LLM06:2025 Excessive Agency, Prevention and Mitigation Strategies #4"
    severity: "critical"
    check_method: "manual-review"
    detector: "manual-review only (requires checking the actual database/API credentials/roles the extension's connection uses)"
    remediation_ref: "fix-playbook://LLM-31"

  - control_id: "LLM-32"
    name: "Extensions execute in the authenticated user's own security context"
    description: "Actions taken on a user's behalf should be executed downstream in that specific user's authorization context and scope (e.g. OAuth with minimum scope), not a shared privileged identity."
    source_clause: "OWASP LLM Top 10 2025, LLM06:2025 Excessive Agency, Prevention and Mitigation Strategies #5"
    severity: "critical"
    check_method: "manual-review"
    detector: "manual-review only (requires tracing the auth flow used by the extension against downstream systems)"
    remediation_ref: "fix-playbook://LLM-32"

  - control_id: "LLM-33"
    name: "High-impact actions require human approval before execution"
    description: "Human-in-the-loop approval should gate high-impact actions before they are taken, whether enforced in the extension itself or a downstream system."
    source_clause: "OWASP LLM Top 10 2025, LLM06:2025 Excessive Agency, Prevention and Mitigation Strategies #6"
    severity: "critical"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://LLM-33"

  - control_id: "LLM-34"
    name: "Authorization enforced by downstream systems, not delegated to the LLM"
    description: "Downstream systems must independently validate every request against security policy (complete mediation) rather than trusting the LLM's own judgment about whether an action is allowed."
    source_clause: "OWASP LLM Top 10 2025, LLM06:2025 Excessive Agency, Prevention and Mitigation Strategies #7"
    severity: "critical"
    check_method: "manual-review"
    detector: "manual-review only (requires confirming downstream systems don't simply trust an 'allowed' flag from the model)"
    remediation_ref: "fix-playbook://LLM-34"

  # ---- LLM07:2025 System Prompt Leakage ----
  - control_id: "LLM-35"
    name: "No secrets or credentials embedded directly in the system prompt"
    description: "API keys, connection strings, and other sensitive values must never be embedded in system prompt text; such information should be externalized to systems the model does not directly access."
    source_clause: "OWASP LLM Top 10 2025, LLM07:2025 System Prompt Leakage, Prevention and Mitigation Strategies #1"
    severity: "high"
    check_method: "static"
    detector: "Gitleaks / Semgrep (secret-pattern scanning applied to prompt template files and string constants, not just general source code)"
    remediation_ref: "fix-playbook://LLM-35"

  - control_id: "LLM-36"
    name: "System prompt not relied upon as the sole behavior-control or security mechanism"
    description: "Since prompt injection can alter system prompt effectiveness, behavior and content restrictions that matter for security should be enforced by external systems, not solely by system prompt instructions."
    source_clause: "OWASP LLM Top 10 2025, LLM07:2025 System Prompt Leakage, Prevention and Mitigation Strategies #2-3"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only (requires assessing whether any security-relevant behavior is enforced only via prompt language)"
    remediation_ref: "fix-playbook://LLM-36"

  - control_id: "LLM-37"
    name: "Privilege separation and authorization checks enforced outside the LLM"
    description: "Critical controls such as privilege separation and authorization bounds checks must occur in deterministic, auditable code — never delegated to the LLM via the system prompt or otherwise. Tasks needing different access levels should use separate, appropriately-scoped agents."
    source_clause: "OWASP LLM Top 10 2025, LLM07:2025 System Prompt Leakage, Prevention and Mitigation Strategies #4"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only (overlaps with LLM-34's complete-mediation check)"
    remediation_ref: "fix-playbook://LLM-37"

  # ---- LLM08:2025 Vector and Embedding Weaknesses ----
  - control_id: "LLM-38"
    name: "Permission-aware access control and partitioning in the vector database"
    description: "Fine-grained access controls and logical/access partitioning must be implemented in the vector store to prevent one user/tenant's queries from retrieving another's embeddings."
    source_clause: "OWASP LLM Top 10 2025, LLM08:2025 Vector and Embedding Weaknesses, Prevention and Mitigation Strategies #1"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only (requires reviewing the vector DB's namespace/tenant isolation configuration)"
    remediation_ref: "fix-playbook://LLM-38"

  - control_id: "LLM-39"
    name: "Knowledge-base data validated and sourced only from trusted, authenticated origins"
    description: "Robust data-validation pipelines should regularly audit and validate knowledge-base integrity for hidden codes/poisoning, accepting data only from trusted, verified sources."
    source_clause: "OWASP LLM Top 10 2025, LLM08:2025 Vector and Embedding Weaknesses, Prevention and Mitigation Strategies #2"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only"
