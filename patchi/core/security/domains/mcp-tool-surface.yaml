domain_id: "mcp-tool-surface"
version: "1.0.0"
display_name: "MCP-Callable Tool Surface Security"
# SOURCE CURRENCY NOTE (verified 2026-07-04):
# Primary source is the official MCP specification's "Security Best Practices"
# document (modelcontextprotocol.io/docs/tutorials/security/security_best_practices),
# which is the security-considerations companion to the MCP Authorization spec.
# It reflects protocol revision 2025-11-25. A 2026-07-28 release-candidate revision
# (largest revision since launch: stateless core, removal of Mcp-Session-Id,
# MCP Apps, Tasks extension) is currently in its public review window and not
# yet final as of this writing — controls below cite the 2025-11-25 text and
# will need review once 2026-07-28 ships as final. Where the official MCP
# security document does not speak to a control (tool-argument input validation,
# untrusted downstream-output consumption, tool description/permission
# over-grant to a calling agent), controls are adapted from OWASP API Security
# Top 10 2023 (still the current edition as of 2026-07-04 — no successor
# published) and clearly marked as adapted, not MCP-native.
source_standard: "MCP Specification — Security Best Practices (protocol revision 2025-11-25); supplemented by OWASP API Security Top 10 2023 for controls with no direct MCP-specific guidance — see per-control source_clause"
component_type: "mcp-tool"
weight: 0.85

activation_signals:
  required_any:
    - signal: "codebase implements an MCP server (imports an MCP SDK, e.g. @modelcontextprotocol/sdk, mcp Python package, or implements the MCP JSON-RPC methods tools/list, tools/call)"
    - signal: "codebase exposes tools, resources, or prompts intended to be called by an external AI agent/host over the Model Context Protocol"
  excluded_if:
    - signal: "component only acts as an MCP client (consumes MCP servers) with no server-side tool exposed — see agent-orchestration domain instead for client/orchestrator-side controls"

controls:
  - control_id: "MCP-01"
    name: "No token passthrough — validate token audience before use"
    description: "The MCP server must never accept a token from an MCP client and forward it unmodified to a downstream API without first validating that the token was explicitly issued to (i.e. has an audience claim matching) this MCP server. Tokens not issued for this server must be rejected outright, not proxied."
    source_clause: "MCP Specification, Security Best Practices — 'Token Passthrough' section: 'MCP servers MUST NOT accept any tokens that were not explicitly issued for the MCP server.' (protocol revision 2025-11-25)"
    severity: "critical"
    check_method: "dynamic"
    detector: "manual-review only; can be scripted as a dynamic test that presents a token with a mismatched audience claim and asserts rejection"
    remediation_ref: "fix-playbook://MCP-01"

  - control_id: "MCP-02"
    name: "Non-deterministic, user-bound session identifiers; sessions never used as sole authentication"
    description: "If the MCP server maintains session state, session IDs must be generated with a secure random number generator (not sequential/predictable), must not be used as the authentication mechanism on their own, and should be bound to user-specific identity (e.g. keyed as <user_id>:<session_id>) so that guessing or obtaining a session ID does not let an attacker impersonate another user."
    source_clause: "MCP Specification, Security Best Practices — 'Session Hijacking' section: 'MCP servers MUST NOT use sessions for authentication... MUST use secure, non-deterministic session IDs... SHOULD bind session IDs to user-specific information.' (protocol revision 2025-11-25)"
    severity: "high"
    check_method: "static"
    detector: "manual-review only; static grep for session-ID generation calls (e.g. confirming use of a CSPRNG/UUIDv4 rather than incrementing counters or timestamps)"
    remediation_ref: "fix-playbook://MCP-02"

  - control_id: "MCP-03"
    name: "SSRF protection on server-influenced or discovery-time URLs"
    description: "Where the MCP server or its client-side counterpart fetches URLs supplied by another party during OAuth metadata discovery or similar flows (resource_metadata, authorization_servers, token_endpoint, etc.), it must enforce HTTPS, block requests to private/reserved/link-local IP ranges (including cloud metadata endpoints), and apply the same validation to any redirect targets, to prevent SSRF against internal infrastructure."
    source_clause: "MCP Specification, Security Best Practices — 'Server-Side Request Forgery (SSRF)' section, citing RFC 9728 §7.7 and OAuth 2.1 §1.5 (protocol revision 2025-11-25)"
    severity: "high"
    check_method: "dynamic"
    detector: "manual-review only; can be tested dynamically with an egress-proxy allowlist test or an SSRF payload targeting 169.254.169.254 and RFC1918 ranges"
    remediation_ref: "fix-playbook://MCP-03"

  - control_id: "MCP-04"
    name: "Per-client consent to prevent confused-deputy attacks (proxy servers only)"
    description: "If this MCP server acts as an OAuth proxy to a third-party API using a static client_id, it must maintain a per-user, per-client_id consent registry and check it before forwarding to the third-party authorization server, rather than relying on the third party's own consent cookie (which is not scoped per dynamically-registered MCP client)."
    source_clause: "MCP Specification, Security Best Practices — 'Confused Deputy Problem' section, Required Protections (protocol revision 2025-11-25)"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://MCP-04"

  - control_id: "MCP-05"
    name: "Incremental, least-privilege OAuth scope model"
    description: "The MCP server must not publish or grant an omnibus/wildcard scope up front. It should expose a minimal initial scope for discovery/read operations and issue targeted, incremental scope-elevation challenges only when a privileged operation is first attempted, accepting down-scoped tokens rather than requiring all-or-nothing consent."
    source_clause: "MCP Specification, Security Best Practices — 'Scope Minimization' section (protocol revision 2025-11-25)"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only; config review of scopes_supported metadata can flag wildcard/omnibus scopes (*, all, full-access) via simple static check"
    remediation_ref: "fix-playbook://MCP-05"

  - control_id: "MCP-06"
    name: "Sandboxing and transport restriction for locally-run MCP servers"
    description: "If the MCP server is intended to run locally (stdio transport or local HTTP), it must restrict access to itself so only the intended local MCP client can reach it (e.g. via stdio rather than an unauthenticated local HTTP port), and if an HTTP transport is used locally, it must require an authorization token or use an IPC mechanism with restricted access rather than a bare open localhost port vulnerable to DNS rebinding or other local processes."
    source_clause: "MCP Specification, Security Best Practices — 'Local MCP Server Compromise' section: server-side guidance to 'use the stdio transport to limit access... restrict access if using an HTTP transport... require an authorization token or use unix domain sockets' (protocol revision 2025-11-25)"
    severity: "high"
    check_method: "static"
    detector: "manual-review only; static config review for presence of auth-token enforcement on any local HTTP listener"
    remediation_ref: "fix-playbook://MCP-06"

  - control_id: "MCP-07"
    name: "Reject dangerous URL schemes in any server-supplied authorization URL"
    description: "If the MCP server supplies authorization or redirect URLs to a client (e.g. as part of an OAuth flow it initiates), it must only ever emit http:// (loopback-only) or https:// URLs, never javascript:, data:, file:, vbscript:, or other schemes that a client might pass to a browser or shell, since this is the vector clients are told to guard against and a compliant server should not emit content that would fail client-side validation."
    source_clause: "MCP Specification, Security Best Practices — 'OAuth Authorization URL Validation' section (protocol revision 2025-11-25). Note: the cited mitigations in the source document are framed as client-side MUSTs; this control restates the server-side corollary (never emit what a compliant client must reject) and is a reasonable but not verbatim-quoted extension of the same clause — flagged here for transparency."
    severity: "high"
    check_method: "static"
    detector: "manual-review only; static check on any code path that constructs a redirect/authorization URL, confirming scheme is restricted to an allowlist of http/https"
    remediation_ref: "fix-playbook://MCP-07"

  - control_id: "MCP-08"
    name: "Strict schema validation of inbound tool-call arguments"
    description: "Every tool exposed over MCP must validate its call arguments against a strict, explicit schema (type, range, allowed enum values, required vs. optional fields) before acting on them, rejecting calls with unexpected extra fields, out-of-range values, or type mismatches rather than coercing or best-effort processing them. Arguments must not be trusted merely because the calling agent is authenticated — authentication proves identity, not that the argument content is safe or well-formed."
    source_clause: "Adapted — no MCP-specific clause covers tool-argument validation directly. Adapted from OWASP API Security Top 10 2023, API8:2023 Security Misconfiguration (insecure/absent input validation as a misconfiguration root cause) and API3:2023 Broken Object Property Level Authorization (validating which properties/fields a caller may legitimately set)."
    severity: "critical"
    check_method: "static"
    detector: "Semgrep (custom ruleset) or a JSON-Schema/Pydantic/Zod presence-check linter can verify a validation layer exists at each tool's entry point"
    remediation_ref: "fix-playbook://MCP-08"

  - control_id: "MCP-09"
    name: "Do not let downstream/tool output be consumed as trusted without validation"
    description: "Where this tool itself calls out to another API, service, or data source and relays that response back to the calling agent, the tool must validate and sanitize that downstream response (schema-check, size limits, content-type checks) before returning it, rather than passing arbitrary downstream content straight through to the calling agent as if it were the tool's own trusted output."
    source_clause: "Adapted — no MCP-specific clause covers this directly. Adapted from OWASP API Security Top 10 2023, API10:2023 Unsafe Consumption of APIs ('accepting data from integrated APIs/services without adequate validation')."
    severity: "high"
    check_method: "static"
    detector: "manual-review only; can be partially covered by static taint-analysis rules flagging unvalidated downstream-response data flowing directly into a tool's return value"
    remediation_ref: "fix-playbook://MCP-09"

  - control_id: "MCP-10"
    name: "Least-privilege downstream credentials held by the tool itself"
    description: "The credentials the MCP tool uses to reach its own downstream systems (databases, internal APIs, cloud resources) must be scoped to only the specific operations that tool's declared function set requires, independent of and not inherited wholesale from a broader service account shared across unrelated tools."
    source_clause: "Adapted — no MCP-specific clause covers this directly. Adapted from OWASP API Security Top 10 2023, API5:2023 Broken Function Level Authorization (least-privilege function-level access as the general mitigating principle)."
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only; IaC scanners (e.g. Checkov, tfsec) can check IAM policy scope if downstream credentials are cloud-native"
    remediation_ref: "fix-playbook://MCP-10"

deprecated_by: null
last_reviewed: "2026-07-04"
