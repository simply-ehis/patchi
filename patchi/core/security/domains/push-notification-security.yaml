# ============================================================================
# Patchi Security Domain: push-notification-security
# ============================================================================
# SOURCE VERIFICATION NOTE — READ BEFORE USING THIS FILE:
#   Source standards: Firebase Cloud Messaging (FCM) vendor documentation
#   and Apple Push Notification service (APNs) vendor documentation,
#   retrieved directly from the official Firebase and Apple developer
#   sites.
#
#   SOURCING CONSTRAINT, DISCLOSED HONESTLY: the FCM and APNs
#   documentation are vendor-published product documentation freely
#   available on developer.firebase.com and developer.apple.com. The
#   control descriptions below are paraphrased from the security
#   guidance, migration notices, and API reference material in these
#   documents, not reproduced verbatim.
#
#   COVERAGE NOTE: the source documentation covers the full push
#   notification lifecycle including credential management, token
#   formats, transport encryption, payload design, and platform-specific
#   quirks. This domain selects the subset that is realistically
#   checkable by examining a repository's backend push-sending code,
#   credential configuration, and client-side token handling — which is
#   what Patchi actually has access to. Checks requiring live APNs/FCM
#   endpoint probing or device-level inspection are excluded as out of
#   scope.
#
#   SEVERITY NOTE: severity ratings are inferred from the vendor
#   documentation's own security notices and the real-world impact of
#   push notification misconfigurations. Credential exposure is rated
#   critical; push token mishandling and payload over-exposure are rated
#   high; deprecated API migration gaps and transport boundary issues
#   are rated medium; platform-specific token auth nuances are rated low.
# ============================================================================

domain_id: "push-notification-security"
version: "1.0.0"
display_name: "Push Notification Security (FCM / APNs)"
source_standard: "Firebase/Apple vendor documentation"
component_type: "backend-api"
cross_cutting: false
weight: 0.6

activation_signals:
  required_any:
    - signal: "fcm_sdk_dependency (FirebaseMessaging, firebase-admin, or fcm-related packages in the dependency manifest)"
    - signal: "apns_dependency (APNs client libraries, HTTP/2 certificate-based push code, or apple-push-notification references)"
    - signal: "push_token_handling (application code storing, transmitting, or processing device push tokens / registration IDs)"
    - signal: "push_sending_endpoint (server-side code that sends push notifications to FCM or APNs endpoints)"
  excluded_if:
    - signal: "no_push_infrastructure (none of the required_any signals fired)"

controls:
  - control_id: "PUSH-01"
    name: "Server push credentials stored securely"
    description: "FCM server keys, service account JSON files, APNs .p8/.p12 certificates, and equivalent push credentials must be stored in a secrets manager or encrypted at rest, never hardcoded in application source code or committed to version control. Compromised push credentials allow an attacker to send arbitrary notifications to all registered devices."
    source_clause: "Firebase Cloud Messaging documentation (server credentials security); Apple Developer documentation (APNs key management)"
    severity: "critical"
    check_method: "static"
    detector: "Gitleaks / Trivy secret scanning (rule: FCM server key, service account JSON, or APNs certificate embedded in source code or config files)"
    remediation_ref: "fix-playbook://PUSH-01"

  - control_id: "PUSH-02"
    name: "FCM HTTP v1 API migrated from legacy protocols"
    description: "Applications must use the FCM HTTP v1 API (https://fcm.googleapis.com/v1/projects/{project_id}/messages:send) instead of the deprecated legacy HTTP and XMLP protocols. The legacy protocols use a simple API key that is harder to scope and audit, while the v1 API uses OAuth 2.0 access tokens with fine-grained IAM permissions."
    source_clause: "Firebase Cloud Messaging documentation (HTTP v1 migration guide); Firebase deprecation notices"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: code using the legacy FCM send endpoint https://fcm.googleapis.com/fcm/send or the XMPP legacy protocol)"
    remediation_ref: "fix-playbook://PUSH-02"

  - control_id: "PUSH-03"
    name: "APNs token-based authentication preferred over certificate-based"
    description: "APNs should use token-based authentication (.p8 key) rather than certificate-based authentication (.p12 certificate), as token-based auth is easier to rotate, does not expire on a fixed schedule, and supports multiple apps with a single key."
    source_clause: "Apple Developer Documentation (APNs token-based authentication); Apple Platform Security Guide"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only (APNs credential type in the push configuration: .p12 certificates should be migrated to .p8 tokens where possible)"
    remediation_ref: "fix-playbook://PUSH-03"

  - control_id: "PUSH-04"
    name: "Push tokens not treated as bearer tokens in non-push contexts"
    description: "Device push tokens (FCM registration tokens, APNs device tokens) must not be used as authentication tokens, session identifiers, or bearer tokens in other API calls. Push tokens are not secret — they are transmitted over TLS to the push service and stored in the push provider's infrastructure — and treating them as authentication credentials creates a false sense of security."
    source_clause: "Firebase documentation (FCM token security); Apple documentation (APNs token lifecycle)"
    severity: "high"
    check_method: "static"
    detector: "Semgrep / CodeQL (rule: push token used in an Authorization header, session store, or as a query parameter for API authentication)"
    remediation_ref: "fix-playbook://PUSH-04"

  - control_id: "PUSH-05"
    name: "Push notification payload minimization enforced"
    description: "Push notification payloads must not contain sensitive data (PII, authentication tokens, financial data, personal messages) in the notification body, since push notifications may be displayed on lock screens, logged by the OS, or intercepted during transport. Sensitive data should be fetched via a secure API call after the notification triggers the app to refresh."
    source_clause: "Firebase documentation (FCM message payload limits and security); Apple Human Interface Guidelines (notification content security)"
    severity: "high"
    check_method: "static"
    detector: "manual-review / Semgrep (rule: push payload construction including fields derived from sensitive data sources without masking)"
    remediation_ref: "fix-playbook://PUSH-05"

  - control_id: "PUSH-06"
    name: "Transport encryption boundary documented"
    description: "The boundary of transport encryption for push notifications must be documented and understood: FCM encrypts payload between your server and the FCM service, and between FCM and the device; APNs encrypt between your server and APNs. However, the payload is decrypted at the OS level before delivery to the app, and notification content may be visible on the device lock screen. Sensitive data beyond this boundary must be fetched via a separate TLS-protected API call."
    source_clause: "Firebase documentation (FCM transport security); Apple documentation (APNs transport and device-level encryption)"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only (push notification architecture documentation must describe the encryption boundary; payloads containing data that should be beyond the boundary are flagged)"
    remediation_ref: "fix-playbook://PUSH-06"

deprecated_by: null
last_reviewed: "2026-07-12"
