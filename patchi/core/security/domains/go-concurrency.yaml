domain_id: "go-concurrency"
version: "1.0.0"
display_name: "Go Concurrency Safety"
source_standard: "Go Memory Model + Effective Go Concurrency Patterns"
component_type: "backend-api"
cross_cutting: true
weight: 0.85

activation_signals:
  required_any:
    - signal: "files_matching:*.go"
    - signal: "import_pattern:go func()"
    - signal: "import_pattern:sync"
    - signal: "import_pattern:context"
  excluded_if:
    - signal: "go_files_only_in_examples_or_testdata"

controls:
  - control_id: "GCO-001"
    name: "Goroutine leak without context cancellation"
    description: "Detect goroutines spawned with 'go func()' that do not have a matching context.Context cancellation path, WaitGroup.Done() call, or channel-based shutdown signal. The check should flag any goroutine that performs blocking I/O (HTTP, gRPC, file, channel receive) without a select case on ctx.Done(). Long-running goroutines in HTTP handlers are a particularly common source of leaks because the handler goroutine exits but the spawned goroutine continues."
    source_clause: "Go Memory Model - Goroutine Lifecycle"
    severity: "high"
    check_method: "static"
    detector: "semgrep:go.goroutine-without-context-cancellation"
    remediation_ref: "fix-playbook://GCO-001"

  - control_id: "GCO-002"
    name: "Send to nil channel blocks forever"
    description: "Detect send or receive operations on channels that may be nil. A send to a nil channel blocks the goroutine forever with no panic, making it extremely hard to diagnose. The check should flag: (1) channel variables declared but not initialized before first use, (2) channel-typed struct fields accessed without nil check, (3) channel returns from functions that may return nil on error path. In particular, flag maps-of-channels where the map lookup may return the zero value (nil)."
    source_clause: "Go Specification - Channel Types"
    severity: "high"
    check_method: "static"
    detector: "semgrep:go.send-on-nil-channel + semgrep:go.receive-on-nil-channel"
    remediation_ref: "fix-playbook://GCO-002"

  - control_id: "GCO-003"
    name: "Race condition on shared mutable state"
    description: "Detect access to shared variables from multiple goroutines without synchronization. Flag patterns such as: (1) package-level or struct fields modified inside go func() without sync.Mutex/RWMutex, (2) iteration variable capture in go func() loops (pre-Go-1.22 bug), (3) map reads and writes from multiple goroutines without sync.Map or mutex, (4) sync/atomic operations used inconsistently with non-atomic accesses on the same variable."
    source_clause: "Go Memory Model - Happens-Before"
    severity: "critical"
    check_method: "dynamic"
    detector: "go test -race + semgrep:go.shared-state-without-sync"
    remediation_ref: "fix-playbook://GCO-003"

  - control_id: "GCO-004"
    name: "Empty select blocks forever"
    description: "Detect select statements with zero cases (select{}), which block the goroutine forever with no escape path. These are sometimes used intentionally as a 'park forever' idiom but more commonly indicate incomplete code or a refactoring artifact. The check should flag any select{} in non-test code and additionally flag select statements where all cases have been commented out or wrapped in if-false conditions."
    source_clause: "Go Specification - Select Statements"
    severity: "high"
    check_method: "static"
    detector: "semgrep:go.empty-select-statement"
    remediation_ref: "fix-playbook://GCO-004"

  - control_id: "GCO-005"
    name: "sync.Mutex misuse (copy or unlock-without-lock)"
    description: "Detect two misuse patterns of sync.Mutex and sync.RWMutex: (1) Copy by value - a Mutex passed by value to a function or stored in a value-typed struct creates two independent mutexes with confusing semantics. Go's go vet tool catches this but only in simple cases. (2) Unlock without matching Lock - typically caused by early-return error paths where defer mu.Unlock() was forgotten. Flag any function that calls mu.Unlock() on a path where mu.Lock() was not called."
    source_clause: "sync package documentation - Mutex usage"
    severity: "high"
    check_method: "static"
    detector: "go vet -copylocks + semgrep:go.mutex-unlock-without-lock"
    remediation_ref: "fix-playbook://GCO-005"

  - control_id: "GCO-006"
    name: "Unbounded goroutine spawn"
    description: "Detect patterns where goroutines are spawned in a loop or per-request without a worker pool, semaphore, or other bound. Flag any 'go func()' inside a for loop, any 'go handler()' inside an HTTP handler without a concurrency limit, and any pattern that spawns one goroutine per database row. Unbounded goroutine creation can exhaust memory or file descriptors under load. The fix is to use a buffered channel as a semaphore or an errgroup.Group with SetLimit."
    source_clause: "Go Concurrency Patterns - Worker Pool"
    severity: "medium"
    check_method: "static"
    detector: "semgrep:go.goroutine-in-loop-without-semaphore"
    remediation_ref: "fix-playbook://GCO-006"

  - control_id: "GCO-007"
    name: "Defer inside loop never runs until function exits"
    description: "Detect defer statements inside for or range loops. Each iteration adds a deferred call to the defer stack but none execute until the function returns, causing resource leaks (file handles, mutexes, DB connections) proportional to iteration count. The fix is to extract the loop body into a separate function so defers run per-iteration. This is one of the most common Go resource leak patterns in production code."
    source_clause: "Effective Go - Defer"
    severity: "medium"
    check_method: "static"
    detector: "semgrep:go.defer-in-loop"
    remediation_ref: "fix-playbook://GCO-007"
