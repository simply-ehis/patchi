# ============================================================================
# Patchi Security Domain: secrets-runtime-management
# ============================================================================
# SOURCE VERIFICATION NOTE — READ BEFORE USING THIS FILE:
#   Source standards: HashiCorp Vault documentation (Secrets Engine,
#   Dynamic Secrets, Transit Engine, Vault Agent) and AWS Secrets
#   Manager documentation (Secret Rotation, Resource Policies,
#   SDK/CLI usage), retrieved directly from the official vendor sites.
#
#   SOURCING CONSTRAINT, DISCLOSED HONESTLY: the Vault and AWS Secrets
#   Manager documentation are vendor-published product documentation
#   freely available on developer.hashicorp.com and docs.aws.amazon.com.
#   The control descriptions below are paraphrased from the security
#   guidance, best practices, and API reference material in these
#   documents, not reproduced verbatim.
#
#   COVERAGE NOTE: the source documentation covers the full lifecycle of
#   secrets management including creation, storage, rotation, access
#   control, and runtime injection. This domain selects the subset that
#   is realistically checkable by examining a repository's secrets
#   management configuration, Vault Agent/AWS SDK usage patterns, and
#   runtime secrets handling — which is what Patchi actually has access
#   to. Checks requiring live Vault cluster inspection or runtime
#   secrets access auditing are excluded as out of scope.
#
#   SEVERITY NOTE: severity ratings are inferred from the vendor
#   documentation's own security advisories and the real-world impact
#   of secrets management misconfigurations. Lease renewal failures and
#   secret exposure via core dumps are rated high; delivery method and
#   caching TTL issues are rated medium.
# ============================================================================

domain_id: "secrets-runtime-management"
version: "1.0.0"
display_name: "Secrets Runtime Management"
source_standard: "Vendor documentation -- HashiCorp Vault + AWS Secrets Manager"
component_type: "backend-api"
cross_cutting: true
weight: 0.65

activation_signals:
  required_any:
    - signal: "vault_client_dependency (hvac, vault-sdk, vault-agent, or hashicorp-vault references in the dependency manifest or config)"
    - signal: "aws_secretsmanager_dependency (boto3 secretsmanager client, aws-sdk secrets-manager, or SecretsManager references in the dependency manifest or IaC)"
    - signal: "secrets_injection_config (Vault Agent template, AWS Secrets Manager rotation Lambda, or secrets-as-volume configuration)"
    - signal: "runtime_secrets_handling (application code reading secrets from files at /vault/secrets, /run/secrets, or AWS Secrets Manager GetSecretValue calls)"
  excluded_if:
    - signal: "no_secrets_management_infrastructure (none of the required_any signals fired)"

controls:
  - control_id: "SECRETS-01"
    name: "Dynamic secret lease renewal configured"
    description: "Vault dynamic secrets must have lease renewal configured (via Vault Agent or an explicit lease renew call) so that short-lived credentials are refreshed before expiry. Unrenewed dynamic secrets cause application outages when leases expire, and silent credential expiration can lead to cascading failures."
    source_clause: "HashiCorp Vault documentation: Dynamic Secrets, Lease Management, Vault Agent auto-renew"
    severity: "high"
    check_method: "static"
    detector: "Semgrep / manual-review (rule: Vault dynamic secret usage without corresponding lease renewal configuration in Vault Agent or application code)"
    remediation_ref: "fix-playbook://SECRETS-01"

  - control_id: "SECRETS-02"
    name: "File-mount delivery preferred over environment variables for secrets"
    description: "Secrets should be delivered to applications via file mounts (Vault Agent template, Kubernetes secret volumes) rather than environment variables. Environment variables are more commonly leaked via process listing, crash dumps, child-process inheritance, and logging frameworks that capture the environment."
    source_clause: "HashiCorp Vault documentation: Vault Agent templates; AWS Secrets Manager best practices"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: application reading secrets from os.environ / os.getenv / process.env for Vault-managed or Secrets-Manager-managed secret names, rather than from a file mount)"
    remediation_ref: "fix-playbook://SECRETS-02"

  - control_id: "SECRETS-03"
    name: "Dynamic secrets preferred over static long-lived credentials"
    description: "Applications should prefer Vault dynamic secrets (database credentials, cloud IAM credentials) over static long-lived credentials stored in AWS Secrets Manager. Dynamic secrets are unique per session, time-limited, and auditable, reducing the blast radius of credential compromise."
    source_clause: "HashiCorp Vault documentation: Dynamic Secrets Engine; AWS Secrets Manager documentation: Rotating secrets"
    severity: "high"
    check_method: "static"
    detector: "manual-review (infrastructure review: static long-lived credentials in Secrets Manager for databases, cloud APIs, or third-party services should be migrated to Vault dynamic secrets where possible)"
    remediation_ref: "fix-playbook://SECRETS-03"

  - control_id: "SECRETS-04"
    name: "Client-side secret caching TTL configured"
    description: "Where Vault Agent or the application caches secrets locally (e.g. for read performance), the cache TTL must be shorter than the secret's lease duration. Caching beyond the lease duration serves stale, potentially revoked credentials."
    source_clause: "HashiCorp Vault documentation: Vault Agent caching; AWS SDK caching behavior"
    severity: "medium"
    check_method: "static"
    detector: "manual-review (Vault Agent cache configuration must set cache_duration < secret lease; AWS SDK cache TTL must be shorter than the rotation interval)"
    remediation_ref: "fix-playbook://SECRETS-04"

  - control_id: "SECRETS-05"
    name: "Core dump and swap exposure prevented for secrets"
    description: "Applications must ensure that secrets (especially cryptographic keys and database passwords) are not written to core dump files or swap space. Vault Agent and secrets-loading code should use memory-only storage (mlock where available) and disable core dumps for processes handling secrets."
    source_clause: "HashiCorp Vault documentation: Secure memory; general secrets-in-runtime security best practices"
    severity: "high"
    check_method: "static"
    detector: "manual-review (Vault Agent or application process configuration must disable core dumps via ulimit -c 0 or equivalent; mlock should be enabled for secrets in memory)"
    remediation_ref: "fix-playbook://SECRETS-05"

  - control_id: "SECRETS-06"
    name: "Sidecar auto-auth and least-privilege token policies"
    description: "Vault Agent sidecar containers must use the auto-auth method (approle, kubernetes, aws) with a scoped token policy that grants least-privilege access to only the specific secret paths the application needs, rather than a broad or root-level policy."
    source_clause: "HashiCorp Vault documentation: Vault Agent Auto-Auth; Vault Policies"
    severity: "high"
    check_method: "static"
    detector: "manual-review / Semgrep (rule: Vault Agent sidecar configuration with a policy granting path \"*\" or broad secrets access; auto-auth method configured without explicit policy scoping)"
    remediation_ref: "fix-playbook://SECRETS-06"

deprecated_by: null
last_reviewed: "2026-07-12"
