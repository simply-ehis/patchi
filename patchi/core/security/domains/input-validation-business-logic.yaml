domain_id: "input-validation-business-logic"
version: "1.0.0"
display_name: "Input Validation and Business Logic Security"
source_standard: "OWASP Application Security Verification Standard (ASVS) 5.0.0, Chapter V2: Validation and Business Logic (fetched and verified directly from the official ASVS 5.0.0 CSV release, github.com/OWASP/ASVS, July 2026)"
component_type: "backend-api"
cross_cutting: true
weight: 0.85

# NOTE ON SCOPE: V2 is distinct from V1 (Encoding and Sanitization, likely already
# covered by an existing domain) — V1 is about safely processing untrusted content to
# prevent injection; V2 is about validating that input makes semantic/business sense and
# that business process flows can't be abused or skipped. Also distinct from access-
# control-authz (V8) — V2.3.1 (sequential step enforcement) and V2.4 (anti-automation)
# are business-logic-flow controls, not permission controls; a user can be fully
# authorized to use a feature and still exploit it via logic-flow abuse (e.g. skipping
# a payment step), which is what this domain catches.

activation_signals:
  required_any:
    - signal: "has_multi_step_business_process"     # checkout flows, wizards, approval chains, booking systems
    - signal: "has_input_validation_logic"          # any request-body/query validation code
    - signal: "has_limited_quantity_resources"       # inventory, seats, slots, quotas
  excluded_if:
    - signal: "no_business_logic_beyond_crud"        # a purely single-step CRUD app with no sequential flow or scarce-resource concept

controls:
  - control_id: "BIZLOGIC-01"
    name: "Document input validation rules for structured data formats"
    description: "Documentation must define input validation rules for checking the validity of data items against an expected structure, whether a common format (credit card, email, phone number) or an internal data format."
    source_clause: "ASVS 5.0.0, V2.1.1"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — documentation requirement"
    remediation_ref: "fix-playbook://BIZLOGIC-01"

  - control_id: "BIZLOGIC-02"
    name: "Document cross-field logical consistency validation rules"
    description: "Documentation must define how to validate the logical and contextual consistency of combined data items (e.g. confirming a suburb and postal code actually match)."
    source_clause: "ASVS 5.0.0, V2.1.2"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — documentation requirement"
    remediation_ref: "fix-playbook://BIZLOGIC-02"

  - control_id: "BIZLOGIC-03"
    name: "Document business logic limits, per-user and global"
    description: "Documentation must define expectations for business logic limits and validations, including both per-user and application-wide limits."
    source_clause: "ASVS 5.0.0, V2.1.3"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — documentation requirement"
    remediation_ref: "fix-playbook://BIZLOGIC-03"

  - control_id: "BIZLOGIC-04"
    name: "Enforce positive input validation against business/functional expectations"
    description: "Input must be validated to enforce business or functional expectations, using positive validation (allowlist of values/patterns/ranges) or comparison against expected structure and logical limits, rather than only rejecting known-bad patterns."
    source_clause: "ASVS 5.0.0, V2.2.1"
    severity: "high"
    check_method: "static"
    detector: "Semgrep/CodeQL rule flagging request-handling code paths with no accompanying validation-library call (Joi, Zod, class-validator, Pydantic, etc.) or explicit allowlist check before the input is used in business logic"
    remediation_ref: "fix-playbook://BIZLOGIC-04"

  - control_id: "BIZLOGIC-05"
    name: "Enforce input validation at a trusted service layer, not client-side only"
    description: "The application must enforce input validation at a trusted service layer; client-side validation improves usability but must never be relied upon as the actual security control."
    source_clause: "ASVS 5.0.0, V2.2.2"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep/CodeQL rule flagging server-side endpoints with no accompanying server-side validation logic where equivalent client-side validation exists, suggesting validation may only happen in frontend code"
    remediation_ref: "fix-playbook://BIZLOGIC-05"

  - control_id: "BIZLOGIC-06"
    name: "Validate combinations of related data items for reasonableness"
    description: "The application must ensure combinations of related data items are reasonable according to pre-defined rules (e.g. a shipping date isn't before an order date)."
    source_clause: "ASVS 5.0.0, V2.2.3"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only — cross-field reasonableness rules are highly business-specific and not generically pattern-matchable"
    remediation_ref: "fix-playbook://BIZLOGIC-06"

  - control_id: "BIZLOGIC-07"
    name: "Enforce sequential step order in multi-step business flows"
    description: "The application must only process business logic flows for a given user in the expected sequential step order, without allowing steps to be skipped."
    source_clause: "ASVS 5.0.0, V2.3.1"
    severity: "high"
    check_method: "static"
    detector: "Semgrep/CodeQL rule flagging multi-step flow endpoints (e.g. checkout step 3) that don't verify a server-side state flag confirming prior steps (1, 2) were actually completed for the requesting user/session before proceeding"
    remediation_ref: "fix-playbook://BIZLOGIC-07"

  - control_id: "BIZLOGIC-08"
    name: "Implement documented business logic limits"
    description: "Business logic limits must be implemented per the application's documentation to avoid business logic flaws being exploited (e.g. quantity limits, transaction size limits)."
    source_clause: "ASVS 5.0.0, V2.3.2"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only, cross-referenced against BIZLOGIC-03's documented limits — confirming actual code enforces the documented limits requires comparing both artifacts"
    remediation_ref: "fix-playbook://BIZLOGIC-08"

  - control_id: "BIZLOGIC-09"
    name: "Use atomic transactions for business logic operations"
    description: "Transactions must be used at the business logic level such that an operation either succeeds in its entirety or is rolled back to the previous correct state, preventing partial-completion states that could be exploited or cause data corruption."
    source_clause: "ASVS 5.0.0, V2.3.3"
    severity: "high"
    check_method: "static"
    detector: "Semgrep/CodeQL rule flagging multi-step data-mutation business logic (e.g. debit-then-credit, inventory-decrement-then-order-create) with no surrounding database transaction/rollback mechanism"
    remediation_ref: "fix-playbook://BIZLOGIC-09"

  - control_id: "BIZLOGIC-10"
    name: "Use locking mechanisms to prevent double-booking of limited resources"
    description: "Business logic level locking must be used to ensure limited-quantity resources (theater seats, delivery slots, inventory) cannot be double-booked through concurrent requests manipulating application logic."
    source_clause: "ASVS 5.0.0, V2.3.4"
    severity: "high"
    check_method: "static"
    detector: "Semgrep/CodeQL rule flagging resource-reservation code (check-availability-then-book patterns) with no accompanying row-level lock, optimistic concurrency check, or equivalent atomic reservation mechanism"
    remediation_ref: "fix-playbook://BIZLOGIC-10"

  - control_id: "BIZLOGIC-11"
    name: "Require multi-user approval for high-value business logic flows"
    description: "High-value business logic flows (large monetary transfers, contract approvals, access to classified information, safety overrides) must require multi-user approval to prevent unauthorized or accidental actions."
    source_clause: "ASVS 5.0.0, V2.3.5"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only — identifying which flows genuinely qualify as 'high-value' for this app and confirming an approval-chain mechanism exists requires business context"
    remediation_ref: "fix-playbook://BIZLOGIC-11"

  - control_id: "BIZLOGIC-12"
    name: "Implement anti-automation controls against excessive function calls"
    description: "Anti-automation controls must be in place to protect against excessive calls to application functions that could lead to data exfiltration, garbage-data creation, quota exhaustion, rate-limit breaches, denial-of-service, or overuse of costly resources."
    source_clause: "ASVS 5.0.0, V2.4.1"
    severity: "high"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming rate-limiting middleware or equivalent anti-automation control is present on business-logic-sensitive endpoints (not just login endpoints, which is a narrower/more commonly-checked case)"
    remediation_ref: "fix-playbook://BIZLOGIC-12"

  - control_id: "BIZLOGIC-13"
    name: "Require realistic human timing for business logic flows"
    description: "Business logic flows must require realistic human timing, preventing excessively rapid transaction submissions that indicate automated abuse."
    source_clause: "ASVS 5.0.0, V2.4.2"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only, though a static check can flag multi-step flows with no minimum-time-between-steps enforcement as a candidate for review"
    remediation_ref: "fix-playbook://BIZLOGIC-13"

deprecated_by: null
last_reviewed: "2026-07-09"
