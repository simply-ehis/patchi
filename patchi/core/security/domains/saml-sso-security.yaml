# Patchi Security Domain: saml-sso-security
# ============================================================================
# SOURCE VERIFICATION NOTE — READ BEFORE THIS FILE:
#   Source standards: OWASP SAML Security Cheat Sheet (retrieved and
#   verified from the official OWASP wiki, last reviewed 2025), and
#   W3C XML Signature Syntax and Processing Version 1.1 (Recommendation,
#   2013-04-11, current).
#
#   SOURCING CONSTRAINT, DISCLOSED HONESTLY: the OWASP Cheat Sheet is
#   published under a Creative Commons Attribution-ShareAlike 4.0 license;
#   the W3C XML Signature spec is a W3C Recommendation freely available
#   on the W3C site. The control descriptions below are paraphrased from
#   the vulnerability classes, attack patterns, and mitigation guidance
#   described in these documents, not reproduced verbatim. Where the
#   cheat sheet references specific XML signature wrapping (XSW) attack
#   variants or XXE vectors, the descriptions are original summaries of
#   the referenced techniques, not copied text.
#
#   COVERAGE NOTE: the source standards cover the full SAML assertion
#   lifecycle including authentication request, assertion processing,
#   signature verification, and session management. This domain selects
#   the subset that is realistically checkable by examining a repository's
#   SAML library usage, XML processing configuration, and IdP/SP metadata
#   definitions — which is what Patchi actually has access to. Checks
#   requiring live SAML flow interception or manual IdP configuration
#   review are excluded as out of scope for a source-repository scanner.
#
#   SEVERITY NOTE: like the other non-ASVS domains, SAML-specific
#   vulnerabilities don't map cleanly to CVSS. XSW and XXE attacks that
#   allow authentication bypass are rated critical; cryptographic
#   weaknesses and assertion lifetime issues are rated high; metadata
#   and redirect handling issues are rated medium.
# ============================================================================

domain_id: "saml-sso-security"
version: "1.0.0"
display_name: "SAML / SSO Security"
source_standard: "OWASP SAML Security Cheat Sheet + W3C XML Signature 1.1"
component_type: "backend-api"
cross_cutting: false
weight: 0.8

activation_signals:
  required_any:
    - signal: "saml_library_dependency (onelogin/ruby-saml, saml2, spring-security-saml, python3-saml, or similar SAML libraries in the dependency manifest)"
    - signal: "saml_metadata_file (an IdP or SP SAML metadata XML file, or saml_config/saml_settings in the repo)"
    - signal: "saml_assertion_handling (application code processing SAMLResponse POST parameters, parsing XML assertions, or verifying SAML signatures)"
    - signal: "sso_callback_route (application routes matching /saml/acs, /saml/sso, /auth/saml/callback, or similar SSO callback patterns)"
  excluded_if:
    - signal: "no_saml_dependency (none of the required_any signals fired)"

controls:
  - control_id: "SAML-01"
    name: "XML Signature Wrapping (XSW) attacks prevented"
    description: "SAML assertion processing must prevent XML Signature Wrapping (XSW) attacks, where an attacker injects a forged assertion element alongside or within the signed assertion, causing the signature verifier to validate the legitimate signature while the application processes the forged assertion. Libraries must be configured to assert that exactly one assertion exists and that the signed element is the one processed."
    source_clause: "OWASP SAML Security Cheat Sheet, Section: XML Signature Wrapping Attacks"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep / manual-review (rule: SAML assertion processing using a library known to be vulnerable to XSW when not configured with assertion-element strict mode; or custom XML parsing that does not validate the relationship between the signed element and the processed element)"
    remediation_ref: "fix-playbook://SAML-01"

  - control_id: "SAML-02"
    name: "XML External Entity (XXE) injection prevented"
    description: "SAML XML parsing must disable Document Type Definition (DTD) processing and external entity resolution to prevent XXE attacks, where an attacker injects an external entity reference in the SAML assertion to exfiltrate data or achieve SSRF via the server's XML parser."
    source_clause: "OWASP SAML Security Cheat Sheet, Section: XML External Entity Attacks; CWE-611"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep / CodeQL (rule: XML parsing of SAML responses without disabling DTD processing; use of xml.etree.ElementTree or lxml without resolving_entities=False)"
    remediation_ref: "fix-playbook://SAML-02"

  - control_id: "SAML-03"
    name: "Modern XML signature algorithms enforced"
    description: "SAML signature verification must enforce the use of modern algorithms (RSA-SHA256 or stronger). Deprecated algorithms (RSA-SHA1, DSA, ECDSA with weak curves) must be rejected, as they are vulnerable to collision and preimage attacks that could allow signature forgery."
    source_clause: "W3C XML Signature 1.1, Section 5: Algorithms; OWASP SAML Security Cheat Sheet, Cryptographic Recommendations"
    severity: "high"
    check_method: "static"
    detector: "manual-review / Semgrep (rule: SAML library configuration accepting RSA-SHA1 or unspecified algorithm for signature verification; library defaults that do not enforce algorithm restrictions)"
    remediation_ref: "fix-playbook://SAML-03"

  - control_id: "SAML-04"
    name: "Assertion replay and lifetime limits enforced"
    description: "SAML assertions must have a short lifetime (NotBefore/NotOnOrAfter conditions) and must be checked for replay. The SP must reject assertions that are expired, not yet valid, or have been seen before (using a cache of assertion IDs). A recommended maximum assertion lifetime is 5 minutes."
    source_clause: "OWASP SAML Security Cheat Sheet, Section: Assertion Conditions; SAML 2.0 Core Specification, Section 2.5.1"
    severity: "high"
    check_method: "static"
    detector: "Semgrep / manual-review (rule: SAML assertion processing without checking NotOnOrAfter / NotBefore conditions, or without an assertion-id cache to prevent replay)"
    remediation_ref: "fix-playbook://SAML-04"

  - control_id: "SAML-05"
    name: "Certificate trust and metadata freshness validated"
    description: "SAML signature verification must validate the signing certificate against a known trust store (IdP metadata certificate or pinned certificate). Certificate rotation must be handled via metadata refresh. Self-signed certificates without a trust anchor or expired certificates must be rejected."
    source_clause: "OWASP SAML Security Cheat Sheet, Section: Certificate Validation; SAML 2.0 Metadata Specification"
    severity: "high"
    check_method: "static"
    detector: "manual-review / Semgrep (rule: SAML library configuration with certificate validation disabled, or pinned certificates without a rotation mechanism, or metadata fetched without freshness verification)"
    remediation_ref: "fix-playbook://SAML-05"

  - control_id: "SAML-06"
    name: "IdP-initiated SSO restricted"
    description: "Service Providers should restrict or carefully handle IdP-initiated SSO flows (where the user starts at the IdP without a prior authentication request from the SP). IdP-initiated flows are harder to validate because the SP cannot verify the InResponseTo condition, making them more susceptible to assertion injection."
    source_clause: "OWASP SAML Security Cheat Sheet, Section: IdP-Initiated SSO"
    severity: "medium"
    check_method: "static"
    detector: "manual-review (SAML callback handler must either reject IdP-initiated assertions or validate them with additional checks such as audience restriction and assertion age)"
    remediation_ref: "fix-playbook://SAML-06"

  - control_id: "SAML-07"
    name: "RelayState redirect open redirection prevented"
    description: "The SAML RelayState parameter must be validated against an allow-list of trusted redirect URLs before redirecting the user after SSO authentication. An unvalidated RelayState allows an attacker to craft a SAML response that redirects the authenticated user to a malicious site."
    source_clause: "OWASP SAML Security Cheat Sheet, Section: RelayState Security; SAML 2.0 Bindings Specification"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep / CodeQL (rule: RelayState parameter used in a redirect without validation against a trusted URL list)"
    remediation_ref: "fix-playbook://SAML-07"

  - control_id: "SAML-08"
    name: "Local XML schema validation performed"
    description: "SAML responses must be validated against the official SAML 2.0 XML schema before processing, ensuring structural integrity and preventing injection of unexpected elements or attributes that could exploit parser weaknesses."
    source_clause: "OWASP SAML Security Cheat Sheet, Section: Schema Validation; SAML 2.0 Core Specification, Appendix A"
    severity: "high"
    check_method: "static"
    detector: "manual-review / Semgrep (rule: SAML response processing without schema validation; libraries configured to skip schema checks)"
    remediation_ref: "fix-playbook://SAML-08"

  - control_id: "SAML-09"
    name: "Signing key and private key protection"
    description: "SAML signing keys and SP/IdP private keys must be stored in a secrets manager or HSM, never hardcoded in source code or configuration files. Private key exposure allows an attacker to forge arbitrary SAML assertions for any user."
    source_clause: "OWASP SAML Security Cheat Sheet, Section: Key Management; general key management best practices"
    severity: "critical"
    check_method: "static"
    detector: "Gitleaks / Trivy secret scanning (rule: PEM-encoded private keys or base64-encoded key material in SAML configuration files or source code)"
    remediation_ref: "fix-playbook://SAML-09"

