# ============================================================================
# Patchi Security Domain: email-authentication
# ============================================================================
# SOURCE VERIFICATION NOTE — READ BEFORE USING THIS FILE:
#   Source standards: RFC 7208 (Sender Policy Framework — SPF), RFC 6376
#   (DomainKeys Identified Mail — DKIM), and the DMARCbis working drafts
#   (RFC 9989, RFC 9990, RFC 9991, published May 2026) consolidating
#   Domain-based Message Authentication, Reporting & Conformance.
#
#   SOURCING CONSTRAINT, DISCLOSED HONESTLY: the RFC documents are freely
#   published by the IETF and are publicly accessible. The control
#   descriptions below are paraphrased from the protocol requirements,
#   security considerations, and deployment guidance in these RFCs, not
#   reproduced verbatim. DMARCbis is the final consolidated standard
#   published in May 2026 and is the authoritative reference for DMARC
#   deployment.
#
#   COVERAGE NOTE: the source standards cover the full email
#   authentication stack including SPF record syntax, DKIM signing
#   and verification, DMARC policy enforcement, and reporting
#   mechanisms. This domain selects the subset that is realistically
#   checkable by examining a repository's DNS TXT records (SPF, DKIM,
#   DMARC), email sending configuration, and header-handling code —
#   which is what Patchi actually has access to. Checks requiring
#   live mail-server access or inbound email analysis are excluded as
#   out of scope for a source-repository scanner.
#
#   SEVERITY NOTE: severity ratings are inferred from the RFC security
#   considerations sections and the real-world impact of email
#   authentication misconfigurations. Hard-fail SPF misconfigurations
#   and DKIM key/algorithm weaknesses are rated high due to demonstrated
#   spoofing impact; DMARC enforcement gaps and reporting omissions are
#   rated medium as they represent incomplete defense-in-depth; DNS tree
#   walk attacks are rated low as they require specific network conditions.
# ============================================================================

domain_id: "email-authentication"
version: "1.0.0"
display_name: "Email Authentication (SPF / DKIM / DMARC)"
source_standard: "RFC 7208 (SPF) + RFC 6376 (DKIM) + RFC 9989/9990/9991 (DMARCbis, May 2026)"
component_type: "backend-api"
cross_cutting: true
weight: 0.6

activation_signals:
  required_any:
    - signal: "email_sending_domain (TXT records with v=spf1, or email provider configuration for sending domains in the repo)"
    - signal: "dkim_configuration (DKIM selector TXT records, or email provider DKIM key setup)"
    - signal: "dmarc_policy (TXT records with v=DMARC1, or email provider DMARC configuration)"
    - signal: "email_headers_in_code (application code setting or processing From:, Reply-To:, or other email headers with user input)"
  excluded_if:
    - signal: "no_email_config (none of the required_any signals fired)"

controls:
  - control_id: "EMAILAUTH-01"
    name: "SPF hard-fail policy configured for sending domains"
    description: "SPF records for domains that send email must end with -all (hard fail) rather than ~all (soft fail) or ?all (neutral), ensuring unauthorized senders are definitively rejected rather than marked as suspicious and potentially delivered anyway."
    source_clause: "RFC 7208, Section 8.4 (SPF Failures); RFC 7208, Section 10.1 (Sender Requirements)"
    severity: "high"
    check_method: "static"
    detector: "Semgrep / manual-review (rule: SPF TXT record in DNS config ending with ~all or ?all instead of -all for a domain that also has MX or email-sending infrastructure configured)"
    remediation_ref: "fix-playbook://EMAILAUTH-01"

  - control_id: "EMAILAUTH-02"
    name: "SPF DNS lookup limit respected"
    description: "SPF records must not cause more than 10 DNS lookups (MX, A, AAAA, PTR, include mechanisms) when evaluated, per RFC 7208 Section 4.6.4. Exceeding the limit causes a PermError, which DMARC treats as a fail, potentially blocking legitimate email."
    source_clause: "RFC 7208, Section 4.6.4 (DNS Lookup Limits)"
    severity: "medium"
    check_method: "static"
    detector: "manual-review (SPF record must be checked for the total number of include, mx, a, aaaa, and ptr mechanisms; flattening or dynamic SPF macros should be used when approaching the limit)"
    remediation_ref: "fix-playbook://EMAILAUTH-02"

  - control_id: "EMAILAUTH-03"
    name: "DKIM signing key and algorithm selection"
    description: "DKIM keys must use a minimum key length of 2048 bits for RSA or the Ed25519 algorithm. Keys shorter than 2048 bits (e.g. 1024-bit RSA) are vulnerable to factorization attacks. The signing algorithm must be rsa-sha256 or ed25519-sha256; rsa-sha1 is deprecated."
    source_clause: "RFC 6376, Section 3.3 (DKIM RSA Key Size); RFC 8554 (SHA-2 Hash Algorithms for DKIM)"
    severity: "high"
    check_method: "static"
    detector: "manual-review (DKIM DNS TXT record must specify a 2048+ bit RSA key or Ed25519 key; the 'k=' tag must be rsa or ed25519)"
    remediation_ref: "fix-playbook://EMAILAUTH-03"

  - control_id: "EMAILAUTH-04"
    name: "DKIM key rotation enforced"
    description: "DKIM signing keys must be rotated on a regular schedule (recommended every 6-12 months) to limit the impact of key compromise. Both old and new selectors must be published simultaneously during the transition window."
    source_clause: "RFC 6376, Section 8.1 (Key Management and Rotation); DKIM deployment best practices"
    severity: "medium"
    check_method: "static"
    detector: "manual-review (DNS DKIM TXT records must not reference selectors with keys older than the rotation policy; key rotation should be documented in the deployment runbook)"
    remediation_ref: "fix-playbook://EMAILAUTH-04"

  - control_id: "EMAILAUTH-05"
    name: "DMARC enforcement policy set to reject or quarantine"
    description: "DMARC policies for sending domains must be set to p=reject or p=quarantine (not p=none), ensuring that messages failing SPF/DKIM alignment are either rejected or placed in spam rather than delivered normally."
    source_clause: "RFC 9989, Section 6.6 (DMARC Policy Options); DMARCbis deployment guidance"
    severity: "high"
    check_method: "static"
    detector: "Semgrep / manual-review (rule: DMARC TXT record with p=none; any domain sending email must have p=reject or p=quarantine)"
    remediation_ref: "fix-playbook://EMAILAUTH-05"

  - control_id: "EMAILAUTH-06"
    name: "DMARC alignment mode verified"
    description: "DMARC alignment must be configured to verify that the domain in the From: header aligns with either the SPF envelope sender (spf=s or spf=d) or the DKIM d= domain (dkim=s or dkim=d). Relaxed alignment (subdomain matching) is acceptable; no alignment guarantees no DMARC protection."
    source_clause: "RFC 9990, Section 4.2 (DMARC Identifier Alignment); RFC 9989, Section 6.6"
    severity: "medium"
    check_method: "static"
    detector: "manual-review (DMARC TXT record must not disable alignment via aspf= or adkim= set to 's' without justification; alignment mode must be verified against actual sending infrastructure)"
    remediation_ref: "fix-playbook://EMAILAUTH-06"

  - control_id: "EMAILAUTH-07"
    name: "DMARC aggregate and forensic reporting configured"
    description: "DMARC records must include aggregate reporting (rua=mailto:...) to receive visibility into authentication results. Forensic reporting (ruf=mailto:...) is recommended for domains sending high-volume or sensitive email."
    source_clause: "RFC 9991, Section 6.1 (DMARC Reporting); RFC 9989, Section 7.1"
    severity: "medium"
    check_method: "static"
    detector: "manual-review (DMARC TXT record must include a rua= tag pointing to a valid mailto: URI; absence of reporting leaves the domain owner blind to authentication failures)"
    remediation_ref: "fix-playbook://EMAILAUTH-07"

  - control_id: "EMAILAUTH-08"
    name: "Email header injection via CRLF prevented"
    description: "Application code that constructs email headers (From:, Subject:, Reply-To:, etc.) from user input must sanitize or reject CRLF characters (\r\n) to prevent header injection attacks that can add arbitrary headers or body content, bypassing authentication or sending spoofed messages."
    source_clause: "CWE-93 (CRLF Injection); RFC 5322, Section 2.3 (Line Terminators); email security best practices"
    severity: "high"
    check_method: "static"
    detector: "semgrep / CodeQL (rule: user input flowing into email header construction without CRLF sanitization)"
    remediation_ref: "fix-playbook://EMAILAUTH-08"

  - control_id: "EMAILAUTH-09"
    name: "DNS tree walk attack mitigated for DKIM selectors"
    description: "DKIM selectors should not use predictable naming conventions (e.g. s1._domainkey, selector1._domainkey) that allow an attacker to enumerate valid selectors via DNS walking. Where possible, use randomized or opaque selector names."
    source_clause: "RFC 6376, Section 3.1 (DKIM Selector Specification); DKIM deployment security considerations"
    severity: "low"
    check_method: "static"
    detector: "manual-review (DKIM selector names in DNS configuration should be non-predictable; predictable selectors like s1, s2, selector1 are flagged)"
    remediation_ref: "fix-playbook://EMAILAUTH-09"

deprecated_by: null
last_reviewed: "2026-07-12"
