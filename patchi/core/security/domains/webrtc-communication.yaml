domain_id: "webrtc-communication"
version: "1.0.0"
display_name: "WebRTC Communication Security"
source_standard: "OWASP Application Security Verification Standard (ASVS) 5.0.0, Chapter V17: WebRTC (fetched and verified directly from the official ASVS 5.0.0 CSV release, github.com/OWASP/ASVS, July 2026)."
component_type: "backend-api"
cross_cutting: false
weight: 0.75

# NOTE ON SCOPE: this is one of the more specialized/niche domains — it only applies to
# applications running their own TURN and/or media/signaling servers for real-time
# audio/video/data communication (e.g. video-call features, WebRTC-based screen sharing).
# It does NOT apply to apps merely consuming a third-party WebRTC-as-a-service platform
# (Twilio, Agora, Daily.co, etc.) where that provider operates the TURN/media/signaling
# infrastructure — in that case, this domain's controls are the provider's responsibility,
# not the scanned application's, and activation signals should reflect that distinction.

activation_signals:
  required_any:
    - signal: "runs_own_turn_server"                # coturn or similar self-hosted TURN deployment
    - signal: "runs_own_media_server"                 # Janus, mediasoup, Jitsi, or similar SFU/media server
    - signal: "runs_own_signaling_server"              # custom WebSocket-based WebRTC signaling implementation
  excluded_if:
    - signal: "uses_third_party_webrtc_paas_only"      # relies entirely on a managed WebRTC platform (Twilio, Agora, etc.) with no self-operated TURN/media/signaling component

controls:
  - control_id: "WEBRTC-01"
    name: "Restrict TURN server relay to non-reserved IP addresses"
    description: "The TURN (Traversal Using Relays around NAT) service must only allow access to IP addresses that are not reserved for special purposes (internal networks, broadcast, loopback), for both IPv4 and IPv6 addresses, to prevent the TURN server being abused as an SSRF relay into internal infrastructure."
    source_clause: "ASVS 5.0.0, V17.1.1"
    severity: "critical"
    check_method: "static"
    detector: "Static TURN server configuration review confirming relay destination filtering excludes RFC 1918/loopback/link-local ranges for both IPv4 and IPv6"
    remediation_ref: "fix-playbook://WEBRTC-01"

  - control_id: "WEBRTC-02"
    name: "Protect the TURN server against port-exhaustion resource abuse"
    description: "The TURN service must not be susceptible to resource exhaustion when legitimate users attempt to open a large number of ports on the TURN server."
    source_clause: "ASVS 5.0.0, V17.1.2"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only, though a static config check can flag TURN server deployments with no configured per-user/per-session port allocation limits"
    remediation_ref: "fix-playbook://WEBRTC-02"

  - control_id: "WEBRTC-03"
    name: "Manage DTLS certificate keys per documented key management policy"
    description: "The key for the Datagram Transport Layer Security (DTLS) certificate must be managed and protected based on the application's documented policy for cryptographic key management (aligning with general-cryptography's CRYPTO-01)."
    source_clause: "ASVS 5.0.0, V17.2.1"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only — cross-referencing DTLS key handling against the documented key management policy"
    remediation_ref: "fix-playbook://WEBRTC-03"

  - control_id: "WEBRTC-04"
    name: "Use approved DTLS cipher suites and protection profile for DTLS-SRTP"
    description: "The media server must be configured to use and support approved DTLS cipher suites and a secure protection profile for the DTLS Extension used to establish keys for Secure Real-time Transport Protocol (DTLS-SRTP)."
    source_clause: "ASVS 5.0.0, V17.2.2"
    severity: "high"
    check_method: "static"
    detector: "Static media-server config scan confirming only approved DTLS cipher suites are enabled (aligning with secure-communication-tls's cipher-suite controls)"
    remediation_ref: "fix-playbook://WEBRTC-04"

  - control_id: "WEBRTC-05"
    name: "Verify SRTP authentication to prevent RTP injection"
    description: "Secure Real-time Transport Protocol (SRTP) authentication must be checked at the media server to prevent RTP injection attacks from causing a denial-of-service condition or unauthorized audio/video insertion into media streams."
    source_clause: "ASVS 5.0.0, V17.2.3"
    severity: "high"
    check_method: "static"
    detector: "Static media-server config scan confirming SRTP authentication tag verification is enabled and not bypassed"
    remediation_ref: "fix-playbook://WEBRTC-05"

  - control_id: "WEBRTC-06"
    name: "Continue processing valid media traffic despite malformed SRTP packets"
    description: "The media server must be able to continue processing incoming media traffic when encountering malformed SRTP packets, rather than the malformed packet disrupting the entire stream/session."
    source_clause: "ASVS 5.0.0, V17.2.4"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only — resilience testing against malformed-packet input requires fuzzing/chaos-style testing of the media server, not a static code pattern"
    remediation_ref: "fix-playbook://WEBRTC-06"

  - control_id: "WEBRTC-07"
    name: "Continue processing legitimate media traffic during an SRTP packet flood"
    description: "The media server must be able to continue processing incoming media traffic from legitimate users during a flood of SRTP packets, i.e. resist a volumetric DoS attempt against the media stream itself."
    source_clause: "ASVS 5.0.0, V17.2.5"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — requires load/flood testing of the media server, an L3 requirement"
    remediation_ref: "fix-playbook://WEBRTC-07"

  - control_id: "WEBRTC-08"
    name: "Verify the media server is not vulnerable to the DTLS ClientHello race condition"
    description: "The media server must not be susceptible to the well-known 'ClientHello' race condition vulnerability in DTLS, verified either by checking whether the media server is publicly known to be vulnerable or by performing the race-condition test directly."
    source_clause: "ASVS 5.0.0, V17.2.6"
    severity: "low"
    check_method: "manual-review"
    detector: "Version/CVE lookup against the specific media server software in use for known ClientHello race condition advisories; direct race-condition testing is a manual/specialized task"
    remediation_ref: "fix-playbook://WEBRTC-08"

  - control_id: "WEBRTC-09"
    name: "Ensure recording mechanisms remain resilient during an SRTP packet flood"
    description: "Any audio/video recording mechanisms associated with the media server must be able to continue processing incoming media traffic during a flood of SRTP packets from legitimate users."
    source_clause: "ASVS 5.0.0, V17.2.7"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — requires load/flood testing specifically of the recording pipeline, an L3 requirement"
    remediation_ref: "fix-playbook://WEBRTC-09"

  - control_id: "WEBRTC-10"
    name: "Validate DTLS certificate against SDP fingerprint before trusting the media stream"
    description: "The DTLS certificate must be checked against the Session Description Protocol (SDP) fingerprint attribute, terminating the media stream if the check fails, to ensure the authenticity of the media stream and prevent a man-in-the-middle substitution of the media endpoint."
    source_clause: "ASVS 5.0.0, V17.2.8"
    severity: "high"
    check_method: "static"
    detector: "Static media-server config/code scan confirming SDP fingerprint verification against the DTLS certificate is enforced and stream termination occurs on mismatch"
    remediation_ref: "fix-playbook://WEBRTC-10"

  - control_id: "WEBRTC-11"
    name: "Rate-limit the signaling server against message flood attacks"
    description: "The signaling server must continue processing legitimate incoming signaling messages during a flood attack, achieved by implementing rate limiting at the signaling level."
    source_clause: "ASVS 5.0.0, V17.3.1"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep/CodeQL rule confirming rate-limiting middleware is present on the signaling server's message-handling endpoints/WebSocket connections"
    remediation_ref: "fix-playbook://WEBRTC-11"

  - control_id: "WEBRTC-12"
    name: "Harden signaling message parsing against malformed input"
    description: "The signaling server must be able to continue processing legitimate signaling messages when encountering malformed messages that could cause a denial-of-service condition — via input validation, safe integer-overflow handling, buffer-overflow prevention, and robust error handling."
    source_clause: "ASVS 5.0.0, V17.3.2"
    severity: "high"
    check_method: "static"
    detector: "Fuzz-testing (via the fuzzing worker ant from the testing strategy) targeted at the signaling message parser, supplemented by static review of input-validation coverage on message-parsing code paths"
    remediation_ref: "fix-playbook://WEBRTC-12"

