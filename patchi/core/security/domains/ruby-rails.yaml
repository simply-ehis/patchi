domain_id: "ruby-rails"
version: "1.0.0"
display_name: "Ruby on Rails Security"
source_standard: "OWASP Ruby on Rails Cheatsheet + Rails Security Guide v7.0"
component_type: "backend-api"
cross_cutting: false
weight: 0.88

activation_signals:
  required_any:
    - signal: "build_file:Gemfile,Gemfile.lock"
    - signal: "import_pattern:ActiveRecord"
    - signal: "import_pattern:ActionController"
    - signal: "infra_files:config/routes.rb"
    - signal: "files_matching:*.rb in app/controllers,app/models"
  excluded_if:
    - signal: "rb_files_only_in_scripts_or_migrations"

controls:
  - control_id: "RRS-001"
    name: "Mass assignment via params.permit! or attr_accessible"
    description: "Detect controllers that call params.permit! (which permits all parameters) or models that use attr_accessible without an explicit allow-list (deprecated in Rails 4+ but still present in legacy code). Also flag models using accepts_nested_attributes_for on associations that are not in the attr_accessible list, since nested params can be used to set has_many :through associations the developer did not intend. The canonical exploit is setting admin=true or role='superadmin' on a User model via a signup form."
    source_clause: "OWASP Mass Assignment + Rails Strong Parameters Guide"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:ruby.rails-params-permit-bang + semgrep:ruby.rails-attr-accessible-without-allowlist + semgrep:ruby.rails-nested-attributes-without-permit"
    remediation_ref: "fix-playbook://RRS-001"

  - control_id: "RRS-002"
    name: "SQL injection via string interpolation in ActiveRecord"
    description: "Detect ActiveRecord calls where SQL fragments are constructed via string interpolation or concatenation with user input. Flag Model.where(\"field = '#{user_input}'\"), Model.where(\"field = #{params[:id]}\"), Model.order(params[:sort]), Model.joins(params[:join]), Model.find_by_sql(\"...#{params[:q]}...\"), and Model.connection.execute with interpolated strings. The fix is to use parameterized queries: where(field: user_input), where('field = ?', user_input), or the Arel DSL for complex conditions. Pay special attention to .order(), .group(), .joins(), and .select() which cannot be parameterized via the hash form and require explicit allow-listing of permitted column names."
    source_clause: "OWASP A03:2021 - SQL Injection + Rails SQL Injection Guide"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:ruby.rails-sql-injection-interpolation + semgrep:ruby.rails-order-with-params"
    remediation_ref: "fix-playbook://RRS-002"

  - control_id: "RRS-003"
    name: "Unsafe reflection via send / public_send / eval"
    description: "Detect use of Object#send, Object#public_send, Kernel#eval, Kernel#class_eval, Module#module_eval, or Object#instance_eval with arguments that may include user input. These methods execute arbitrary methods or code on the target object. Flag any send/eval where the first argument is derived from params, request headers, JSON body, or database column containing user-supplied content. Also flag send with a string literal that is constructed via interpolation. The fix is to use a case/when allow-list or, if dynamic dispatch is genuinely needed, to validate the method name against Object.instance_methods(false) filtered to a permitted subset."
    source_clause: "CWE-913 + OWASP Ruby Cheatsheet"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:ruby.rails-send-with-user-input + semgrep:ruby.rails-eval-with-user-input"
    remediation_ref: "fix-playbook://RRS-003"

  - control_id: "RRS-004"
    name: "CSRF protection disabled in API mode"
    description: "Detect Rails controllers that call protect_from_forgery :null_session or skip_forgery_protection without an alternative CSRF mitigation. The :null_session strategy is intended for API-only controllers that use token-based auth (Bearer tokens), but it is frequently applied to cookie-authenticated endpoints that remain vulnerable to CSRF. Flag any controller inheriting ActionController::Base that uses :null_session, any skip_before_action :verify_authenticity_token, and any controller that sets protect_from_forgery with: :exception in ApplicationController but then skips it in a cookie-authenticated controller."
    source_clause: "CWE-352 + Rails CSRF Guide"
    severity: "high"
    check_method: "static"
    detector: "semgrep:ruby.rails-csrf-disabled-in-cookie-controller + semgrep:ruby.rails-null-session-in-action-controller-base"
    remediation_ref: "fix-playbook://RRS-004"

  - control_id: "RRS-005"
    name: "Insecure YAML / Marshal deserialization"
    description: "Detect YAML.load (deprecated in Ruby 3.1+ but still present in legacy code) and Marshal.load on untrusted data. YAML.load can instantiate arbitrary Ruby classes via the !ruby/object tag, leading to RCE (CVE-2013-0156 Rails YAML parser, CVE-2017-9096 Psych, etc.). The fix is to use YAML.safe_load with an explicit allow-list of permitted classes. Also flag Oj.load (whose default mode is :object, which is dangerous - it allows arbitrary class instantiation) and any custom deserialize method that calls instance_variable_set on user-controlled keys. The safe Oj modes are :strict (primitives only), :compat (JSON-compatible), and :rails (ActiveSupport-compatible); use Oj.strict_load or Oj.compat_load explicitly."
    source_clause: "CWE-502 + Ruby Psych Security Guide"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:ruby.yaml-load-unsafe + semgrep:ruby.marshal-load-on-user-data + semgrep:ruby.oj-object-mode"
    remediation_ref: "fix-playbook://RRS-005"

  - control_id: "RRS-006"
    name: "Insecure file upload handling"
    description: "Detect Rails controllers that accept file uploads without validating content type, file extension, and file size. Flag File.write or File.binwrite where the path includes params[:file].original_filename (path traversal), any send_file call where the path is derived from user input without File.expand_path + base directory check, and any use of params[:file].read into an eval/exec context. Also flag attachments stored with user-supplied filenames that may include ../ sequences or null bytes."
    source_clause: "CWE-434 + Rails File Upload Guide"
    severity: "high"
    check_method: "static"
    detector: "semgrep:ruby.rails-file-upload-path-traversal + semgrep:ruby.rails-send-file-with-user-path"
    remediation_ref: "fix-playbook://RRS-006"

  - control_id: "RRS-007"
    name: "Secret key base hardcoded or weak"
    description: "Detect Rails applications where Rails.application.secret_key_base or Rails.application.config.secret_key_base is set to a hardcoded value in source, where config/secrets.yml contains production keys in plain text (should be env var), where config/master.key or config/credentials.yml.enc is committed to source control (master.key must be in .gitignore), and where the secret_key_base is shorter than 32 bytes. Also flag any test or development secret reused in production via fallback."
    source_clause: "CWE-798 + Rails Credentials Guide"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:ruby.rails-hardcoded-secret-key-base + custom check for master.key in git"
    remediation_ref: "fix-playbook://RRS-007"
