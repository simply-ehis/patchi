domain_id: "general-cryptography"
version: "1.0.0"
display_name: "General Cryptography Security"
source_standard: "OWASP Application Security Verification Standard (ASVS) 5.0.0, Chapter V11: Cryptography (fetched and verified directly from the official ASVS 5.0.0 CSV release, github.com/OWASP/ASVS, July 2026)"
component_type: "backend-api"
cross_cutting: true
weight: 0.85

# NOTE ON SCOPE: this domain deliberately excludes crypto requirements specific to
# authentication (password hashing algorithm choice, auth-token entropy) which live in
# the auth-session domain (sourced from ASVS V6/V7). One control here — CRYPTO-16/V11.4.2,
# on approved password-hashing KDFs — covers the same underlying requirement ASVS assigns
# to the Cryptography chapter rather than the Authentication chapter. If auth-session
# already has an equivalent control for password hashing, treat these as the same
# requirement viewed from two chapters and de-duplicate at taxonomy-assembly time rather
# than scoring both independently.

activation_signals:
  required_any:
    - signal: "has_encryption_library_usage"       # crypto/cryptography/openssl/libsodium/Web Crypto API imports
    - signal: "has_data_at_rest_encryption_config"  # database/disk encryption config, KMS/vault integration
    - signal: "has_custom_crypto_implementation"    # hand-rolled cipher/hash/RNG code (itself a finding, see CRYPTO-05)
  excluded_if:
    - signal: "no_cryptographic_operations_beyond_transport_tls"  # app only relies on TLS termination handled entirely by infra, no application-level crypto code

controls:
  - control_id: "CRYPTO-01"
    name: "Document key management policy and lifecycle"
    description: "A documented policy for cryptographic key management and lifecycle must exist, following a recognized key management standard (e.g. NIST SP 800-57), including limits on how widely keys/shared secrets are distributed."
    source_clause: "ASVS 5.0.0, V11.1.1"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only — this is a documentation/policy requirement"
    remediation_ref: "fix-playbook://CRYPTO-01"

  - control_id: "CRYPTO-02"
    name: "Maintain a cryptographic inventory"
    description: "A regularly updated inventory of all cryptographic keys, algorithms, and certificates used by the application must be maintained, documenting where each key can/cannot be used and what data types each key is permitted to protect."
    source_clause: "ASVS 5.0.0, V11.1.2"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only, though static dependency/import scanning can help populate the inventory as a starting point (see CRYPTO-03)"
    remediation_ref: "fix-playbook://CRYPTO-02"

  - control_id: "CRYPTO-03"
    name: "Employ cryptographic discovery mechanisms"
    description: "Discovery tooling should be used to identify all instances of cryptography in the system (encryption, hashing, signing operations), rather than relying solely on manual documentation."
    source_clause: "ASVS 5.0.0, V11.1.3"
    severity: "low"
    check_method: "static"
    detector: "Semgrep/CodeQL rule set scanning for known crypto library API calls (cipher init, hash functions, signature functions) across the codebase to produce a discovered-usage list"
    remediation_ref: "fix-playbook://CRYPTO-03"

  - control_id: "CRYPTO-04"
    name: "Maintain a post-quantum migration plan"
    description: "The cryptographic inventory must include a documented migration path toward post-quantum cryptography to prepare for future cryptographic breaks."
    source_clause: "ASVS 5.0.0, V11.1.4"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — forward-looking policy documentation"
    remediation_ref: "fix-playbook://CRYPTO-04"

  - control_id: "CRYPTO-05"
    name: "Use industry-validated cryptographic implementations"
    description: "Cryptographic operations must use industry-validated libraries or hardware-accelerated implementations rather than custom/hand-rolled cryptographic code."
    source_clause: "ASVS 5.0.0, V11.2.1"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep rule flagging custom implementations of cipher/hash/signature primitives (manual bit-shifting/byte-manipulation logic resembling a hand-written cipher) rather than calls to an established library (OpenSSL, libsodium, Web Crypto API, language-standard crypto modules)"
    remediation_ref: "fix-playbook://CRYPTO-05"

  - control_id: "CRYPTO-06"
    name: "Design for crypto agility"
    description: "The application must be designed so that random-number, encryption, MAC, and hashing algorithms, key lengths, rounds, ciphers, and modes can be reconfigured, upgraded, or swapped, along with the ability to replace keys/passwords and re-encrypt data, to allow response to cryptographic breaks and eventual post-quantum migration."
    source_clause: "ASVS 5.0.0, V11.2.2"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only — an architectural property, not a single greppable pattern; a static check can flag hardcoded algorithm names/constants scattered across many call sites as a proxy signal for low agility"
    remediation_ref: "fix-playbook://CRYPTO-06"

  - control_id: "CRYPTO-07"
    name: "Enforce minimum 128-bit security level for all cryptographic primitives"
    description: "All cryptographic primitives must provide at least 128 bits of security based on algorithm, key size, and configuration (e.g. RSA keys must be at least 3072 bits to match 128-bit security level, matching a 256-bit ECC key)."
    source_clause: "ASVS 5.0.0, V11.2.3"
    severity: "high"
    check_method: "static"
    detector: "Semgrep/CodeQL rule checking key-generation call sites for key-size parameters below the algorithm-specific minimum (e.g. RSA key generation with modulus below 3072 bits, ECC curves below 256 bits, symmetric keys below 128 bits)"
    remediation_ref: "fix-playbook://CRYPTO-07"

  - control_id: "CRYPTO-08"
    name: "Use constant-time cryptographic operations"
    description: "Cryptographic comparisons, calculations, and returns must be constant-time, with no short-circuit logic, to avoid leaking information through timing side channels."
    source_clause: "ASVS 5.0.0, V11.2.4"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep rule flagging naive equality comparisons (==, .equals()) on secret/hash/HMAC/token values instead of a constant-time comparison function (e.g. hmac.compare_digest in Python, crypto.timingSafeEqual in Node)"
    remediation_ref: "fix-playbook://CRYPTO-08"

  - control_id: "CRYPTO-09"
    name: "Fail cryptographic operations securely"
    description: "Cryptographic modules must fail securely, with error handling that doesn't enable vulnerabilities such as padding oracle attacks (e.g. returning the same generic error regardless of the specific decryption/padding failure reason)."
    source_clause: "ASVS 5.0.0, V11.2.5"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only, though a static check can flag decrypt/verify call sites whose error handling branches return distinguishable error messages/response codes for different failure types (a proxy signal for oracle risk)"
    remediation_ref: "fix-playbook://CRYPTO-09"

  - control_id: "CRYPTO-10"
    name: "Do not use insecure block modes or weak padding schemes"
    description: "Insecure block cipher modes (e.g. ECB) and weak padding schemes (e.g. PKCS#1 v1.5 for RSA encryption) must not be used."
    source_clause: "ASVS 5.0.0, V11.3.1"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep rule flagging AES.MODE_ECB, Cipher.getInstance with ECB mode strings, RSA/ECB/PKCS1Padding, and similar known-insecure mode/padding string literals across common crypto libraries"
    remediation_ref: "fix-playbook://CRYPTO-10"

  - control_id: "CRYPTO-11"
    name: "Use only approved ciphers and modes"
    description: "Only approved ciphers and modes (e.g. AES with GCM) must be used for encryption."
    source_clause: "ASVS 5.0.0, V11.3.2"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep rule flagging cipher initialization using non-approved algorithms (DES, 3DES, RC4, Blowfish) or non-authenticated modes (CBC without a separate MAC) where an authenticated mode like GCM should be used instead"
    remediation_ref: "fix-playbook://CRYPTO-11"

  - control_id: "CRYPTO-12"
    name: "Protect encrypted data against unauthorized modification"
    description: "Encrypted data must be protected against tampering, preferably via an authenticated encryption method, or by combining an approved encryption method with an approved MAC algorithm."
    source_clause: "ASVS 5.0.0, V11.3.3"
    severity: "high"
    check_method: "static"
    detector: "Semgrep rule flagging encryption call sites using a non-authenticated mode (e.g. AES-CBC) with no accompanying MAC/HMAC computation and verification in the surrounding code"
    remediation_ref: "fix-playbook://CRYPTO-12"

  - control_id: "CRYPTO-13"
    name: "Never reuse nonces/IVs for the same key and data-element pair"
    description: "Nonces, initialization vectors, and other single-use values must not be reused for more than one encryption key and data-element pair; the generation method must be appropriate for the specific algorithm in use."
    source_clause: "ASVS 5.0.0, V11.3.4"
    severity: "high"
    check_method: "static"
    detector: "Semgrep rule flagging hardcoded or statically-initialized IV/nonce values, or IV generation logic that doesn't use a fresh random/counter-based value per encryption call"
    remediation_ref: "fix-playbook://CRYPTO-13"

  - control_id: "CRYPTO-14"
    name: "Use encrypt-then-MAC when combining encryption and MAC algorithms"
    description: "Any combination of an encryption algorithm and a separate MAC algorithm must operate in encrypt-then-MAC order, not MAC-then-encrypt or encrypt-and-MAC."
    source_clause: "ASVS 5.0.0, V11.3.5"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only — the correct ordering of encrypt/MAC operations across a code path is difficult to verify with a simple static pattern and generally needs a human to trace the actual data flow"
    remediation_ref: "fix-playbook://CRYPTO-14"

  - control_id: "CRYPTO-15"
    name: "Use only approved hash functions for cryptographic purposes"
    description: "Only approved hash functions may be used for cryptographic purposes (digital signatures, HMAC, KDF, random bit generation); disallowed hash functions such as MD5 must never be used for any cryptographic purpose. This control is chapter-general; the password-storage-specific hashing requirement is CRYPTO-16, which may overlap with an equivalent control in auth-session — see the domain-level scope note above."
    source_clause: "ASVS 5.0.0, V11.4.1"
    severity: "high"
    check_method: "static"
    detector: "Semgrep rule flagging MD5/SHA1 usage in any cryptographic context (signing, HMAC key derivation, random bit generation) — non-cryptographic uses like a checksum for non-security file-integrity purposes may be legitimate exceptions requiring manual judgment"
    remediation_ref: "fix-playbook://CRYPTO-15"

  - control_id: "CRYPTO-16"
    name: "Use an approved password-hashing key derivation function"
    description: "Passwords must be stored using an approved, computationally intensive key derivation function (a password hashing function such as bcrypt, scrypt, or Argon2), with parameters tuned to balance security and performance against brute-force attacks. Possible overlap with auth-session — see domain-level scope note."
    source_clause: "ASVS 5.0.0, V11.4.2"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep rule flagging direct use of a general-purpose hash function (SHA-256, SHA-512, MD5) on a password value with no accompanying bcrypt/scrypt/argon2 library call"
    remediation_ref: "fix-playbook://CRYPTO-16"

  - control_id: "CRYPTO-17"
    name: "Use collision-resistant hash functions with appropriate bit-length for signatures/integrity"
    description: "Hash functions used in digital signatures or data integrity/authentication must be collision resistant with an output length of at least 256 bits (or at least 128 bits if only second-pre-image resistance is required)."
    source_clause: "ASVS 5.0.0, V11.4.3"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep rule checking hash function selection at signature/integrity-check call sites against a minimum digest-length allowlist (SHA-256 or stronger)"
    remediation_ref: "fix-playbook://CRYPTO-17"

  - control_id: "CRYPTO-18"
    name: "Use approved key derivation functions with key stretching for password-derived keys"
    description: "When deriving secret cryptographic keys from passwords, an approved key derivation function with key-stretching parameters must be used, tuned to balance security and performance against brute-force attacks on the derived key."
    source_clause: "ASVS 5.0.0, V11.4.4"
    severity: "high"
    check_method: "static"
    detector: "Semgrep rule flagging direct password-to-key derivation without a KDF library call (PBKDF2, scrypt, Argon2) with an explicit iteration/cost parameter"
    remediation_ref: "fix-playbook://CRYPTO-18"

  - control_id: "CRYPTO-19"
    name: "Use a CSPRNG with sufficient entropy for non-guessable values"
    description: "All random numbers/strings intended to be non-guessable must be generated using a cryptographically secure pseudo-random number generator with at least 128 bits of entropy; UUIDs alone do not satisfy this (most UUID versions are not generated with a CSPRNG and/or don't carry 128 bits of unpredictable entropy)."
    source_clause: "ASVS 5.0.0, V11.5.1"
    severity: "high"
    check_method: "static"
    detector: "Semgrep rule flagging Math.random(), random.random(), or other non-cryptographic RNG usage at call sites generating tokens, keys, or other security-sensitive random values; also flags reliance on a bare UUID (e.g. uuid4()) as a security token without additional entropy justification"
    remediation_ref: "fix-playbook://CRYPTO-19"

  - control_id: "CRYPTO-20"
    name: "Ensure the RNG mechanism remains secure under heavy load"
    description: "The random number generation mechanism must be designed to continue operating securely even under heavy demand (i.e. not degrade to a weaker/predictable fallback source under load)."
    source_clause: "ASVS 5.0.0, V11.5.2"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — this is a behavior-under-load property of the underlying RNG implementation/OS entropy source, not something a static code scan can confirm"
    remediation_ref: "fix-playbook://CRYPTO-20"

  - control_id: "CRYPTO-21"
    name: "Use approved algorithms and secure key generation for public-key cryptography"
    description: "Only approved algorithms/modes may be used for key generation, seeding, and digital signature generation/verification; key generation must not produce keys vulnerable to known attacks (e.g. RSA keys vulnerable to Fermat factorization due to close prime factors)."
    source_clause: "ASVS 5.0.0, V11.6.1"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only for the Fermat-factorization-specific check (needs specialized tooling); a general static check can still flag use of a non-standard/deprecated key-generation library or explicitly weak curve/algorithm selection"
    remediation_ref: "fix-playbook://CRYPTO-21"

  - control_id: "CRYPTO-22"
    name: "Use approved algorithms and secure parameters for key exchange"
    description: "Approved cryptographic algorithms (e.g. Diffie-Hellman) must be used for key exchange, with secure parameters, to prevent adversary-in-the-middle attacks or cryptographic breaks against the key establishment process."
    source_clause: "ASVS 5.0.0, V11.6.2"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only — verifying key-exchange parameter strength (e.g. DH group size) typically requires reviewing the actual configuration/library defaults rather than a simple code pattern"
    remediation_ref: "fix-playbook://CRYPTO-22"

  - control_id: "CRYPTO-23"
    name: "Use full memory encryption for sensitive data in use"
    description: "Full memory encryption should be used to protect sensitive data while it is being processed in memory, preventing access by unauthorized users or processes."
    source_clause: "ASVS 5.0.0, V11.7.1"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — this is an infrastructure/hardware capability (e.g. confidential computing/TEE), not verifiable from application source code"
    remediation_ref: "fix-playbook://CRYPTO-23"

  - control_id: "CRYPTO-24"
    name: "Minimize exposed sensitive data during processing and encrypt promptly after use"
    description: "Data minimization principles should ensure the minimal amount of sensitive data is exposed during processing, with data encrypted immediately after use or as soon as feasible."
    source_clause: "ASVS 5.0.0, V11.7.2"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — a design/data-flow property requiring judgment about what data is genuinely needed at each processing stage"
    remediation_ref: "fix-playbook://CRYPTO-24"

