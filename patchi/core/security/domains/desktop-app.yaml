domain_id: "desktop-app"
version: "1.0.0"
display_name: "Desktop Application Security (Electron)"
source_standard: "Electron official documentation — Security tutorial, docs.electronjs.org/docs/latest/tutorial/security (fetched and verified current as of July 2026, referencing Electron v43.0.0 branch). This is official vendor/framework documentation, not a neutral third-party standard body like OWASP or NIST — treat citations accordingly."
component_type: "desktop"
cross_cutting: false
weight: 0.85

activation_signals:
  required_any:
    - signal: "has_electron_dependency"        # "electron" present in package.json dependencies or devDependencies
    - signal: "has_electron_builder_config"     # electron-builder.yml, electron-forge config, or similar packaging config present
  excluded_if:
    - signal: "no_electron_runtime_detected"    # no electron import/require anywhere in source, no BrowserWindow usage

controls:
  - control_id: "DESKTOP-01"
    name: "Only load secure content"
    description: "All remote resources (scripts, stylesheets, iframes, navigations) must be loaded over HTTPS/WSS/FTPS, never plain HTTP/WS/FTP, to preserve data integrity and prevent eavesdropping/tampering in transit."
    source_clause: "Electron Security Checklist, item 1: Only load secure content"
    severity: "high"
    check_method: "static"
    detector: "Electronegativity (Doyensec) — flags http:// / ws:// URLs passed to loadURL and resource tags; also greppable via a simple regex scan for insecure protocol strings in loadURL/src/href calls"
    remediation_ref: "fix-playbook://DESKTOP-01"

  - control_id: "DESKTOP-02"
    name: "Disable Node.js integration for remote content"
    description: "Any BrowserWindow, WebContentsView, or <webview> that loads remote (non-local) content must not have nodeIntegration enabled, since this is what allows an XSS in that remote content to escalate into full native code execution."
    source_clause: "Electron Security Checklist, item 2: Do not enable Node.js integration for remote content"
    severity: "critical"
    check_method: "static"
    detector: "Electronegativity — flags nodeIntegration: true in webPreferences objects; note this is Electron's default-safe setting since v5, so a finding here means it was explicitly overridden"
    remediation_ref: "fix-playbook://DESKTOP-02"

  - control_id: "DESKTOP-03"
    name: "Enable context isolation in all renderers"
    description: "contextIsolation must be enabled so that preload scripts and Electron internals run in a separate JS context from loaded web content, preventing that content from tampering with or accessing privileged APIs. Disabling it also silently disables process sandboxing (see DESKTOP-04)."
    source_clause: "Electron Security Checklist, item 3: Enable Context Isolation"
    severity: "critical"
    check_method: "static"
    detector: "Electronegativity — flags contextIsolation: false in webPreferences; default-safe since v12, so an explicit false is the flag"
    remediation_ref: "fix-playbook://DESKTOP-03"

  - control_id: "DESKTOP-04"
    name: "Enable process sandboxing"
    description: "Renderer processes should run with the OS-level sandbox enabled, significantly limiting what a compromised renderer can access. Untrusted content should never be loaded, read, or processed in an unsandboxed process, including the main process."
    source_clause: "Electron Security Checklist, item 4: Enable process sandboxing"
    severity: "critical"
    check_method: "static"
    detector: "Electronegativity — flags sandbox: false; also flags the case where contextIsolation: true is set but nodeIntegration: true silently disables sandboxing anyway (interaction bug, not just a flag check)"
    remediation_ref: "fix-playbook://DESKTOP-04"

  - control_id: "DESKTOP-05"
    name: "Handle session permission requests from remote content explicitly"
    description: "Rather than relying on Electron's default of auto-approving all permission requests (camera, notifications, geolocation, etc.), a custom ses.setPermissionRequestHandler should explicitly validate the requesting origin and permission type before approving."
    source_clause: "Electron Security Checklist, item 5: Handle session permission requests from remote content"
    severity: "medium"
    check_method: "static"
    detector: "manual-review only — presence/absence of setPermissionRequestHandler is greppable, but whether its logic is genuinely restrictive requires manual review"
    remediation_ref: "fix-playbook://DESKTOP-05"

  - control_id: "DESKTOP-06"
    name: "Do not disable webSecurity"
    description: "The webSecurity property must not be set to false, since doing so disables the same-origin policy and implicitly enables allowRunningInsecureContent, permitting cross-domain code execution."
    source_clause: "Electron Security Checklist, item 6: Do not disable webSecurity"
    severity: "critical"
    check_method: "static"
    detector: "Electronegativity — flags webSecurity: false in webPreferences or disablewebsecurity attribute on <webview>"
    remediation_ref: "fix-playbook://DESKTOP-06"

  - control_id: "DESKTOP-07"
    name: "Define a Content Security Policy"
    description: "A restrictive Content-Security-Policy should be set (via HTTP header or meta tag) for any loaded web content, limiting which origins scripts/styles/resources may be loaded from, as an additional layer of XSS/injection protection beyond nodeIntegration/contextIsolation settings."
    source_clause: "Electron Security Checklist, item 7: Define a Content Security Policy"
    severity: "high"
    check_method: "static"
    detector: "manual-review only — CSP presence is greppable (search for Content-Security-Policy header/meta tag), but whether the policy is meaningfully restrictive (not '*') needs manual review"
    remediation_ref: "fix-playbook://DESKTOP-07"

  - control_id: "DESKTOP-08"
    name: "Do not enable allowRunningInsecureContent"
    description: "This property must remain disabled (Electron's default) — enabling it permits an HTTPS-loaded page to load subsequent scripts/CSS/plugins over insecure HTTP ('mixed content'), undermining HTTPS's integrity guarantees."
    source_clause: "Electron Security Checklist, item 8: Do not enable allowRunningInsecureContent"
    severity: "high"
    check_method: "static"
    detector: "Electronegativity — flags allowRunningInsecureContent: true"
    remediation_ref: "fix-playbook://DESKTOP-08"

  - control_id: "DESKTOP-09"
    name: "Do not enable experimental Chromium features"
    description: "The experimentalFeatures webPreferences property should remain disabled unless there is a specific, well-understood reason to enable it — experimental features are untested at Electron's scale and their security impact is not well characterized."
    source_clause: "Electron Security Checklist, item 9: Do not enable experimental features"
    severity: "low"
    check_method: "static"
    detector: "Electronegativity — flags experimentalFeatures: true"
    remediation_ref: "fix-playbook://DESKTOP-09"

  - control_id: "DESKTOP-10"
    name: "Do not use enableBlinkFeatures"
    description: "Blink rendering-engine features disabled by default should not be force-enabled via enableBlinkFeatures without a specific, understood justification, since disabled-by-default generally means a deliberate security or stability decision upstream."
    source_clause: "Electron Security Checklist, item 10: Do not use enableBlinkFeatures"
    severity: "low"
    check_method: "static"
    detector: "Electronegativity — flags enableBlinkFeatures usage with any value"
    remediation_ref: "fix-playbook://DESKTOP-10"

  - control_id: "DESKTOP-11"
    name: "Do not use allowpopups for WebViews"
    description: "The allowpopups attribute on <webview> tags should not be set unless popup creation is genuinely required, following least-privilege — a webview that can spawn arbitrary new BrowserWindows is a larger attack surface than one that cannot."
    source_clause: "Electron Security Checklist, item 11: Do not use allowpopups for WebViews"
    severity: "medium"
    check_method: "static"
    detector: "Electronegativity — flags allowpopups attribute on <webview> tags"
    remediation_ref: "fix-playbook://DESKTOP-11"

  - control_id: "DESKTOP-12"
    name: "Verify WebView options before creation"
    description: "New <webview> tag creation should be intercepted via the will-attach-webview event on the hosting webContents, stripping unexpected preload scripts and verifying the requested URL against an allowlist before permitting attachment, since a script running in the page can otherwise create webviews with attacker-chosen webPreferences."
    source_clause: "Electron Security Checklist, item 12: Verify WebView options before creation"
    severity: "high"
    check_method: "static"
    detector: "manual-review only — presence of a will-attach-webview handler is greppable, but the correctness of its validation logic requires manual review"
    remediation_ref: "fix-playbook://DESKTOP-12"

  - control_id: "DESKTOP-13"
    name: "Disable or limit navigation"
    description: "Apps with no legitimate need to navigate away from their initial page(s) should intercept the will-navigate event and reject navigation to any URL outside an explicit allowlist, using a proper URL parser rather than naive string prefix matching (which can be bypassed, e.g. a startsWith check on a legitimate domain can be defeated by a lookalike subdomain)."
    source_clause: "Electron Security Checklist, item 13: Disable or limit navigation"
    severity: "high"
    check_method: "static"
    detector: "manual-review only — presence of a will-navigate handler is greppable; correctness of URL validation logic (proper parser vs. naive string match) requires manual review"
    remediation_ref: "fix-playbook://DESKTOP-13"

  - control_id: "DESKTOP-14"
    name: "Disable or limit creation of new windows"
    description: "Apps with a known, fixed set of windows should register a setWindowOpenHandler that denies unexpected new-window creation requests by default, since uncontrolled new-window creation is a common vector for escalating a compromised renderer's privileges."
    source_clause: "Electron Security Checklist, item 14: Disable or limit creation of new windows"
    severity: "medium"
    check_method: "static"
    detector: "manual-review only — presence of a setWindowOpenHandler is greppable; whether it denies-by-default requires manual review"
    remediation_ref: "fix-playbook://DESKTOP-14"

  - control_id: "DESKTOP-15"
    name: "Do not use shell.openExternal with untrusted content"
    description: "shell.openExternal must never be called with a URL/argument derived from untrusted or user-controlled input without validation, since it hands the string to OS-level native utilities and can be abused to execute arbitrary commands depending on protocol handler behavior."
    source_clause: "Electron Security Checklist, item 15: Do not use shell.openExternal with untrusted content"
    severity: "critical"
    check_method: "static"
    detector: "CodeQL/Semgrep dataflow rule — taint-track any value reaching shell.openExternal back to a remote/user-controlled source; flag if unvalidated"
    remediation_ref: "fix-playbook://DESKTOP-15"

  - control_id: "DESKTOP-16"
    name: "Use a current version of Electron"
    description: "The bundled Electron version (and by extension its Chromium and Node.js versions) should be kept current, since older versions accumulate publicly known, exploitable vulnerabilities that are patched in later releases."
    source_clause: "Electron Security Checklist, item 16: Use a current version of Electron"
    severity: "high"
    check_method: "static"
    detector: "OSV-Scanner / npm outdated — check installed electron version against latest stable release and known-CVE database"
    remediation_ref: "fix-playbook://DESKTOP-16"

  - control_id: "DESKTOP-17"
    name: "Validate the sender of all IPC messages"
    description: "Every ipcMain handler that returns sensitive data or performs a privileged action must validate the sender frame's origin/URL against an allowlist before proceeding, since any web frame (including iframes and, in some cases, child windows) can in principle dispatch IPC messages to the main process."
    source_clause: "Electron Security Checklist, item 17: Validate the sender of all IPC messages"
    severity: "critical"
    check_method: "static"
    detector: "manual-review only, supplemented by a static grep for ipcMain.handle/ipcMain.on call sites lacking any e.senderFrame / event.sender validation — flags candidates for manual review rather than confirming correctness outright"
    remediation_ref: "fix-playbook://DESKTOP-17"

  - control_id: "DESKTOP-18"
    name: "Avoid the file:// protocol; prefer custom protocols"
    description: "Local content should be served via a registered custom protocol rather than file://, since pages loaded over file:// receive elevated, unilateral filesystem access in Electron — meaning an XSS on a file:// page can read arbitrary files from the user's machine, a risk a custom protocol can scope down."
    source_clause: "Electron Security Checklist, item 18: Avoid usage of the file:// protocol and prefer usage of custom protocols"
    severity: "medium"
    check_method: "static"
    detector: "Electronegativity — flags loadFile/loadURL('file://...') usage as a candidate for migration to protocol.handle"
    remediation_ref: "fix-playbook://DESKTOP-18"

  - control_id: "DESKTOP-19"
    name: "Review and configure Electron fuses appropriately"
    description: "Electron 'fuses' (e.g. runAsNode, nodeCliInspect) that allow the packaged app to behave differently under specific environment variables or CLI flags should be explicitly reviewed and disabled if not needed, since an enabled fuse can let an external script invoke functionality/commands the app would not otherwise expose."
    source_clause: "Electron Security Checklist, item 19: Check which fuses you can change"
    severity: "medium"
    check_method: "static"
    detector: "@electron/fuses' own inspection tooling, or manual review of the app's fuses configuration in the packaging build config"
    remediation_ref: "fix-playbook://DESKTOP-19"

  - control_id: "DESKTOP-20"
    name: "Do not expose raw Electron APIs to untrusted web content"
    description: "Preload scripts must not directly expose raw IPC primitives (e.g. ipcRenderer.on) via contextBridge, since this grants the renderer unrestricted access to the entire IPC event system rather than only the specific messages intended for it. Preload scripts should wrap each exposed capability in a narrow, purpose-specific function instead."
    source_clause: "Electron Security Checklist, item 20: Do not expose Electron APIs to untrusted web content"
    severity: "critical"
    check_method: "static"
    detector: "Electronegativity, supplemented by manual review — flags contextBridge.exposeInMainWorld calls that pass ipcRenderer methods directly rather than wrapped callbacks"
    remediation_ref: "fix-playbook://DESKTOP-20"

deprecated_by: null
last_reviewed: "2026-07-07"
