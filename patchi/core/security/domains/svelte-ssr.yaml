domain_id: "svelte-ssr"
version: "1.0.0"
display_name: "SvelteKit SSR Security"
source_standard: "SvelteKit Security Best Practices + OWASP SSRF/Data Exposure"
component_type: "web-frontend"
cross_cutting: false
weight: 0.82

activation_signals:
  required_any:
    - signal: "files_matching:*.svelte"
    - signal: "import_pattern:@sveltejs/kit"
    - signal: "infra_files:src/routes/**/+page.server.js,+layout.server.js"
    - signal: "build_file:svelte.config.js"
  excluded_if:
    - signal: "svelte_files_only_in_static_showcase"

controls:
  - control_id: "SSR-001"
    name: "Server-side data leaked to client via load return"
    description: "Detect SvelteKit +page.server.js and +layout.server.js load() functions that return objects containing sensitive fields (password_hash, passwordHash, apiKey, accessToken, refreshToken, secret, private_key, internal fields prefixed with _). SvelteKit serializes the entire return value of load() and ships it to the client as $page.data, even fields the component does not reference. The fix is to strip sensitive fields before return: return { id: user.id, email: user.email } rather than return { user }. Pay special attention to /api/auth callbacks that include session tokens in the response."
    source_clause: "OWASP A01:2021 + SvelteKit load() documentation"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:svelte.load-return-with-sensitive-field + custom AST check for spread-return of full model"
    remediation_ref: "fix-playbook://SSR-001"

  - control_id: "SSR-002"
    name: "CSRF token missing in form actions"
    description: "Detect SvelteKit form actions (export const actions = {} in +page.server.js) that perform state-changing operations on cookie-authenticated sessions without CSRF protection. SvelteKit's built-in CSRF protection (csrf.checkOrigin = true by default in svelte.config.js) rejects cross-origin POST/PUT/PATCH/DELETE form submissions by comparing the Origin header to the server origin; disabling this or writing custom actions that bypass the SvelteKit form-action flow leaves the endpoint vulnerable. The check should flag: (1) csrf.checkOrigin = false in svelte.config.js, (2) actions that read session cookies but are invoked via fetch() from a +server.js endpoint (which does not get the automatic Origin check), (3) actions that return a 200 for state-changing operations without verifying Origin. Cookie-authenticated endpoints are vulnerable to cross-site form POST CSRF without this check."
    source_clause: "CWE-352 + SvelteKit CSRF documentation"
    severity: "high"
    check_method: "static"
    detector: "semgrep:svelte.form-action-without-csrf-check + semgrep:svelte.form-action-without-origin-check"
    remediation_ref: "fix-playbook://SSR-002"

  - control_id: "SSR-003"
    name: "Internal API secrets exposed in SSR HTML"
    description: "Detect SvelteKit components that interpolate internal API URLs, database connection strings, or service credentials into HTML rendered server-side. Flag {process.env.DATABASE_URL}, {process.env.INTERNAL_API_KEY}, {env.SECRET} interpolated in <script> context tags (as opposed to module-level imports). SvelteKit does not tree-shake values interpolated in the template at runtime; they are serialized into the SSR HTML response. The fix is to fetch data in load() and return only the result, never the secret itself. Also flag use of $env/static/private values interpolated into HTML."
    source_clause: "CWE-200 + SvelteKit $env module documentation"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:svelte.process-env-in-template + semgrep:svelte.private-env-in-html"
    remediation_ref: "fix-playbook://SSR-003"

  - control_id: "SSR-004"
    name: "Unvalidated redirect in load or action"
    description: "Detect throw redirect() calls in +page.server.js load() or actions where the redirect target URL is derived from user input (query param, form field, header) without an allow-list of permitted destinations. Open redirect via SSR is exploitable for phishing and, when combined with a session cookie, for token leakage to attacker domain. The check should flag redirect(params.x), redirect(url.searchParams.get('next')), and redirect(request.headers.get('referer')) without validation against an allow-list or against URL.origin === expected."
    source_clause: "CWE-601"
    severity: "high"
    check_method: "static"
    detector: "semgrep:svelte.redirect-with-user-input + semgrep:svelte.redirect-without-allowlist"
    remediation_ref: "fix-playbook://SSR-004"

  - control_id: "SSR-005"
    name: "XSS via unescaped HTML insertion"
    description: "Detect Svelte components that use {@html user_input} to insert untrusted content into the DOM. Svelte's {@html} does not escape HTML, unlike the default {variable} interpolation. Flag any {@html} where the argument is derived from params, $page.data, or form action return values without first sanitizing with DOMPurify or similar. Also flag {@html} with template literals that concatenate user input, and {@html JSON.stringify(...)} which is sometimes used to embed JSON for hydration but is XSS-exploitable if the JSON contains </script> sequences."
    source_clause: "CWE-79 + Svelte documentation on @html"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:svelte.at-html-with-user-input + semgrep:svelte.at-html-with-template-literal"
    remediation_ref: "fix-playbook://SSR-005"

  - control_id: "SSR-006"
    name: "Server-only module imported in client component"
    description: "Detect Svelte components or +page.js (client-load) files that import server-only modules such as direct database drivers (pg, mysql2, mongodb), Node.js fs, child_process, or files that import $env/static/private. SvelteKit's compiler will try to bundle these imports into the client bundle and fail, or worse, succeed but leak credentials. The fix is to put server-only logic in +page.server.js / +layout.server.js, never in +page.js or in $lib files that are imported from both. Use the $env/static/private module which throws on client import."
    source_clause: "CWE-200 + SvelteKit server-only modules"
    severity: "high"
    check_method: "static"
    detector: "semgrep:svelte.server-module-imported-in-client + semgrep:svelte.private-env-in-page-js"
    remediation_ref: "fix-playbook://SSR-006"

  - control_id: "SSR-007"
    name: "Insecure cookies without Secure / HttpOnly / SameSite"
    description: "Detect cookies set via SvelteKit's cookies.set() in +page.server.js or +layout.server.js without the secure: true, httpOnly: true, and sameSite: 'lax' or 'strict' options. SvelteKit sets sensible defaults for some options but not all. Flag any cookies.set call missing any of the three options, any cookie set with sameSite: 'none' without secure: true (browser rejects it), and any session cookie set with path: '/' and a long maxAge without httpOnly."
    source_clause: "CWE-614 + OWASP Session Management"
    severity: "high"
    check_method: "static"
    detector: "semgrep:svelte.cookies-set-without-secure + semgrep:svelte.cookies-set-without-httponly + semgrep:svelte.cookies-set-samesite-none-without-secure"
    remediation_ref: "fix-playbook://SSR-007"
