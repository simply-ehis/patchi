domain_id: "django-hardening"
version: "1.0.0"
display_name: "Django Hardening"
source_standard: "Django Security Documentation + OWASP Django Cheat Sheet"
component_type: "backend-api"
cross_cutting: false
weight: 0.85

activation_signals:
  required_any:
    - signal: "build_file:manage.py,settings.py,settings/__init__.py,requirements.txt with django"
    - signal: "import_pattern:django"
    - signal: "import_pattern:from django"
    - signal: "deps:django,Django"
    - signal: "infra_files:manage.py,wsgi.py,asgi.py"
  excluded_if:
    - signal: "django_import_only_in_migrations_or_test_fixtures"

controls:
  - control_id: "DJG-001"
    name: "DEBUG=True in production settings"
    description: "Detect Django settings.py (or settings/base.py, settings/production.py) where DEBUG = True is hardcoded or where DEBUG defaults to True (DEBUG = os.environ.get('DEBUG', 'True') == 'True'). When DEBUG=True, Django exposes detailed error pages with stack traces, source code snippets, settings values (including SECRET_KEY if logged), and the Django admin toolbar. It also disables ALLOWED_HOSTS validation, allowing HTTP Host header attacks. The fix is to set DEBUG = os.environ.get('DEBUG', 'False') == 'True' (default False) and require an explicit env var to enable. Also audit any settings file that is imported in production (settings/production.py, settings/heroku.py) for DEBUG=True."
    source_clause: "CWE-489 + Django Documentation - Debug Flag"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:python.django-debug-true-in-settings + custom check on settings.py for DEBUG = True"
    remediation_ref: "fix-playbook://DJG-001"

  - control_id: "DJG-002"
    name: "ALLOWED_HOSTS wildcard in production"
    description: "Detect Django settings where ALLOWED_HOSTS = ['*'] or ALLOWED_HOSTS = ['*'] combined with DEBUG=False. ALLOWED_HOSTS validates the HTTP Host header to prevent cache poisoning, password-reset email poisoning (via host in reset link), and DNS rebinding attacks. With ['*'], Django accepts any Host header, so an attacker can make password-reset emails point to attacker.com (the reset link uses request.build_absolute_uri which includes the Host header). With DEBUG=True, ALLOWED_HOSTS is ignored (Django allows any host) - this is the default in development. The fix is to enumerate the production domains: ALLOWED_HOSTS = ['app.example.com', 'www.example.com'] or read from env: ALLOWED_HOSTS = os.environ.get('ALLOWED_HOSTS', '').split(',')."
    source_clause: "CWE-444 + Django Documentation - Allowed Hosts"
    severity: "high"
    check_method: "static"
    detector: "semgrep:python.django-allowed-hosts-wildcard + custom check on settings.py"
    remediation_ref: "fix-playbook://DJG-002"

  - control_id: "DJG-003"
    name: "SECRET_KEY hardcoded or weak"
    description: "Detect Django settings where SECRET_KEY is hardcoded (SECRET_KEY = 'django-insecure-...'), where the key is shorter than 50 characters, where the key is the default from django-admin startproject (which has 'django-insecure-' prefix), or where the key is read from a hardcoded fallback (SECRET_KEY = os.environ.get('SECRET_KEY', 'fallback-hardcoded-value')). The SECRET_KEY is used to sign sessions, CSRF tokens, password reset tokens, and signed cookies - if leaked, an attacker can forge sessions, CSRF tokens, and password reset links. The fix is to read it exclusively from an environment variable or a secret manager with no fallback: SECRET_KEY = os.environ['SECRET_KEY'] (raises KeyError if missing, which is desired in production). Rotate the key if it was ever committed to git."
    source_clause: "CWE-798 + Django Documentation - Secret Key"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:python.django-hardcoded-secret-key + semgrep:python.django-default-secret-key + custom check for < 50 chars"
    remediation_ref: "fix-playbook://DJG-003"

  - control_id: "DJG-004"
    name: "SQL injection via raw queries or cursor.execute with f-strings"
    description: "Detect Django Model.objects.raw(), cursor.execute(), or cursor.executemany() calls where the SQL string is constructed via f-string, .format(), or % string formatting with user input. Flag: Model.objects.raw(f\"SELECT * FROM users WHERE name = '{request.POST['name']}'\"), cursor.execute(f\"SELECT * FROM users WHERE id = {user_id}\"), cursor.execute(\"SELECT * FROM users WHERE name = '%s'\" % name). Also flag QuerySet.extra(where=[...]) with user input (deprecated but still present). The fix is to use parameterized queries: Model.objects.raw(\"SELECT * FROM users WHERE name = %s\", [name]), cursor.execute(\"SELECT * FROM users WHERE id = %s\", (user_id,)), or prefer the ORM: User.objects.filter(name=name)."
    source_clause: "CWE-89 + Django Documentation - SQL Injection"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:python.django-sql-injection-raw + semgrep:python.django-sql-injection-cursor + bandit: B608"
    remediation_ref: "fix-playbook://DJG-004"

  - control_id: "DJG-005"
    name: "Template autoescape disabled"
    description: "Detect Django templates that use {% autoescape off %} blocks, the |safe filter on user input, or Template() / render() calls with user-controlled template strings. Django's default is autoescape=True which escapes <, >, &, ', \" in template variables - this prevents XSS. Disabling autoescape via {% autoescape off %} or |safe on user input allows XSS. Flag: {{ user_input|safe }}, {% autoescape off %}{{ user_input }}{% endautoescape %}, render(request, 'tpl.html', {'content': user_html}) where the template then uses {{ content|safe }}. The fix is to keep autoescape on (default) and remove |safe filters on user input. For trusted HTML (e.g. from a CMS), use a sanitizer like bleach.clean() before storing."
    source_clause: "CWE-79 + Django Documentation - Autoescape"
    severity: "high"
    check_method: "static"
    detector: "semgrep:python.django-autoescape-off + semgrep:python.django-safe-filter-on-user-input + semgrep:html.django-safe-filter"
    remediation_ref: "fix-playbook://DJG-005"

  - control_id: "DJG-006"
    name: "CSRF middleware disabled or exempted"
    description: "Detect Django settings where 'django.middleware.csrf.CsrfViewMiddleware' is removed from MIDDLEWARE, and view decorators @csrf_exempt / @method_decorator(csrf_exempt) applied to views that accept state-changing requests from cookie-authenticated users. The CsrfViewMiddleware requires a CSRF token cookie + X-CSRFToken header (or csrfmiddlewaretoken form field) on all POST/PUT/PATCH/DELETE. Removing the middleware or exempting a view disables this protection. Flag: @csrf_exempt on a view that uses request.user (cookie-authenticated). Bearer-token-authenticated APIs (DRF TokenAuthentication, JWT) are NOT vulnerable to CSRF and can be exempted - but audit that they truly do not read session cookies."
    source_clause: "CWE-352 + Django Documentation - CSRF"
    severity: "high"
    check_method: "static"
    detector: "semgrep:python.django-csrf-middleware-removed + semgrep:python.django-csrf-exempt-on-cookie-view + bandit: B108"
    remediation_ref: "fix-playbook://DJG-006"

  - control_id: "DJG-007"
    name: "Clickjacking (XFrameOptionsMiddleware missing or disabled)"
    description: "Detect Django settings where 'django.middleware.clickjacking.XFrameOptionsMiddleware' is removed from MIDDLEWARE, or where X_FRAME_OPTIONS = 'DENY' is overridden to 'SAMEORIGIN' or removed (defaults to 'SAMEORIGIN' in Django 3.0+; the safer value is 'DENY'). Also flag the @xframe_options_exempt decorator on views that render sensitive forms. Clickjacking allows an attacker to embed the app in an iframe, overlay transparent UI, and trick the user into clicking. The fix is to ensure the middleware is in MIDDLEWARE and X_FRAME_OPTIONS = 'DENY' (or use CSP frame-ancestors for modern browsers). For specific views that need to be embedded (e.g. an embeddable widget), use @xframe_options_sameorigin (not exempt) on those views only."
    source_clause: "CWE-1021 + Django Documentation - Clickjacking"
    severity: "medium"
    check_method: "static"
    detector: "semgrep:python.django-xframe-middleware-removed + semgrep:python.django-xframe-options-disabled + semgrep:python.django-xframe-exempt"
    remediation_ref: "fix-playbook://DJG-007"
