# ============================================================================
# SOURCE VERIFICATION NOTE — READ BEFORE USING THIS FILE:
#   Source standards: Istio project documentation (istio.io, released
#   under Apache 2.0) and Linkerd project documentation (linkerd.io,
#   released under Apache 2.0), retrieved directly from the official
#   project sites.
#
#   SOURCING CONSTRAINT, DISCLOSED HONESTLY: both Istio and Linkerd
#   documentation are published under Apache 2.0 licenses by their
#   respective open-source foundations/projects. The control descriptions
#   below are paraphrased from the security guidance, configuration
#   reference, and best practices in these documents, not reproduced
#   verbatim. Where the documentation references specific Istio CRD
#   fields or Linkerd configuration options, the descriptions are
#   original summaries of the referenced settings, not copied text.
#
#   COVERAGE NOTE: the source documentation covers the full service mesh
#   lifecycle including mTLS configuration, sidecar injection, RBAC,
#   authorization policies, trust domain management, and multi-cluster
#   federation. This domain selects the subset that is realistically
#   checkable by examining a repository's Istio/Linkerd YAML manifests,
#   Helm values, and service mesh configuration — which is what Patchi
#   actually has access to. Checks requiring live mesh inspection or
#   mTLS certificate verification on the wire are excluded as out of
#   scope for a source-repository scanner.
#
#   SEVERITY NOTE: severity ratings are inferred from the documentation's
#   own security impact assessments. Mesh-wide mTLS enforcement and trust
#   domain protection are rated critical as they are foundational to the
#   mesh's security model; sidecar integrity and RBAC are rated high;
#   sidecar scoping and cross-cluster trust boundaries are rated medium.
# ============================================================================

domain_id: "service-mesh-security"
version: "1.0.0"
display_name: "Service Mesh Security (Istio / Linkerd)"
source_standard: "Istio and Linkerd vendor/project documentation"
component_type: "infra"
cross_cutting: false
weight: 0.65

activation_signals:
  required_any:
    - signal: "istio_manifests_present (VirtualService, DestinationRule, PeerAuthentication, AuthorizationPolicy, or Gateway CRDs in the repo)"
    - signal: "linkerd_config_present (linkerd2 Helm values, Linkerd proxy configuration, or Linkerd-specific annotations in Kubernetes manifests)"
    - signal: "mesh_injection_labels (namespace or pod labels with istio-injection: enabled or linkerd.io/inject: enabled)"
    - signal: "mesh_mtls_config (PeerAuthentication with STRICT or PERMISSIVE mode, or Linkerd mTLS configuration)"
  excluded_if:
    - signal: "no_service_mesh_config (none of the required_any signals fired)"

controls:
  - control_id: "MESH-01"
    name: "Mesh-wide mTLS set to STRICT"
    description: "The service mesh must enforce mutual TLS (mTLS) in STRICT mode globally (via PeerAuthentication at the mesh/root namespace level for Istio, or via Linkerd's default mTLS), ensuring all service-to-service communication is encrypted and authenticated. PERMISSIVE mode allows plaintext traffic and should only be used during migration."
    source_clause: "Istio documentation: PeerAuthentication (STRICT mode); Linkerd documentation: mTLS by default"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep / manual-review (rule: no mesh-wide PeerAuthentication with mode: STRICT defined, or Linkerd configuration with mTLS disabled; namespace-level PERMISSIVE mode without explicit migration justification)"
    remediation_ref: "fix-playbook://MESH-01"

  - control_id: "MESH-02"
    name: "Sidecar injection scoped to specific namespaces"
    description: "Automatic sidecar injection should be enabled only for namespaces running application workloads that need mesh features, not globally across all namespaces. System namespaces (kube-system, kube-public, istio-system) should not have sidecar injection enabled."
    source_clause: "Istio documentation: Sidecar Injection; Linkerd documentation: Proxy Injection"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: istio-injection: enabled label on system namespaces like kube-system, kube-public, or istio-system)"
    remediation_ref: "fix-playbook://MESH-02"

  - control_id: "MESH-03"
    name: "Sidecar traffic interception integrity enforced"
    description: "Sidecar proxy configuration must ensure all inbound and outbound traffic is intercepted (via iptables or eBPF) without bypass paths. Workloads must not be able to circumvent the sidecar proxy via hostNetwork, privileged containers, or CAP_NET_ADMIN capabilities that could modify iptables rules."
    source_clause: "Istio documentation: Traffic Interception; Linkerd documentation: Proxy Init"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: Pod spec with hostNetwork: true or securityContext.privileged: true or NET_RAW capability in a mesh-injected namespace, which allows sidecar bypass)"
    remediation_ref: "fix-playbook://MESH-03"

  - control_id: "MESH-04"
    name: "Mesh control-plane RBAC uses least privilege"
    description: "The service mesh control plane (istiod, linkerd-controller) must run with RBAC roles granting only the permissions it needs to function. The control plane should not have cluster-admin or broad read/write access to all resources."
    source_clause: "Istio documentation: Istiod Security; Linkerd documentation: RBAC Requirements"
    severity: "high"
    check_method: "static"
    detector: "manual-review / Semgrep (rule: ClusterRole/ClusterRoleBinding for istiod or linkerd-controller with wildcard apiGroups, resources, or verbs)"
    remediation_ref: "fix-playbook://MESH-04"

  - control_id: "MESH-05"
    name: "AuthorizationPolicy default-deny configured"
    description: "Namespaces with mesh-injected workloads must have a default-deny AuthorizationPolicy (deny all traffic by default) that explicitly allows only intended communication paths. Without default-deny, any mesh-injected pod can communicate with any other pod in the mesh."
    source_clause: "Istio documentation: AuthorizationPolicy (default-deny); Linkerd documentation: Server and ServerAuthorization"
    severity: "high"
    check_method: "static"
    detector: "Semgrep / manual-review (rule: a mesh-injected namespace without any AuthorizationPolicy or Server/ServerAuthorization resource that restricts traffic)"
    remediation_ref: "fix-playbook://MESH-05"

  - control_id: "MESH-06"
    name: "Trust domain and root CA protection"
    description: "The mesh's trust domain must be configured explicitly and the root CA key/certificate must be protected in a secrets manager or HSM. A compromised root CA allows an attacker to mint arbitrary identities within the mesh, completely undermining mTLS."
    source_clause: "Istio documentation: Trust Domain; Linkerd documentation: Identity and Trust"
    severity: "critical"
    check_method: "static"
    detector: "manual-review (mesh configuration must specify an explicit trust domain; root CA certificate/key must not be in plaintext in the repository)"
    remediation_ref: "fix-playbook://MESH-06"

  - control_id: "MESH-07"
    name: "Cross-cluster trust boundary documented and enforced"
    description: "In multi-cluster mesh deployments, trust relationships between clusters must be explicitly documented and enforced. Each cluster's trust domain should be distinct, and cross-cluster authentication must use explicit trust configurations rather than implicit shared trust."
    source_clause: "Istio documentation: Multi-Cluster Deployment; Linkerd documentation: Multi-Cluster"
    severity: "medium"
    check_method: "static"
    detector: "manual-review (multi-cluster mesh configuration must define explicit trust domain boundaries; shared trust domains across independently-administered clusters are flagged)"
    remediation_ref: "fix-playbook://MESH-07"

