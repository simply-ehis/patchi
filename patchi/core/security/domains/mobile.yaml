# ============================================================================
# Patchi Security Domain: mobile
# ============================================================================
# SOURCE VERIFICATION NOTE:
#   Source standard: OWASP MASVS (Mobile Application Security Verification
#   Standard) v2.1.0, released 2024-01-18 — confirmed current (no v3.0.0
#   exists as of this writing). v2.1.0 added the MASVS-PRIVACY control group
#   (4 controls) on top of the v2.0.0 (April 2023) restructuring, which
#   deliberately reduced MASVS itself to 24 high-level, abstract controls
#   across 8 groups (STORAGE, CRYPTO, AUTH, NETWORK, PLATFORM, CODE,
#   RESILIENCE, PRIVACY) — MASVS explicitly delegates testable detail to its
#   companion projects, OWASP MASTG (Mobile Application Security Testing
#   Guide) and OWASP MASWE (Mobile Application Security Weakness
#   Enumeration). This is NOT an oversight on Patchi's part; it is how the
#   current standard is intentionally structured ("Keep Abstraction... leave
#   the details to the MASTG" — OWASP/masvs v2.0.0 release notes).
#   Confidence: HIGH for all 24 top-level control names/descriptions —
#   each was fetched individually from its official page at
#   https://mas.owasp.org/MASVS/controls/MASVS-<ID>/, not recalled from
#   memory. Descriptions below are reworded, not verbatim.
#
#   NOTE ON MASVS-L1/L2/R LEVELS: v2.0.0+ removed the old L1/L2/R
#   verification levels from MASVS itself (they now live as "MAS Testing
#   Profiles" inside MASTG, applied per-test rather than per-control). This
#   domain therefore does NOT use an L1/L2/R-based severity convention —
#   unlike ASVS, there is no current per-control level to map from.
#
#   EXPANSION SOURCE: to add genuinely checkable depth beyond MASVS's own
#   24 abstract statements, a subset of controls below are expanded with
#   sub-controls sourced from OWASP MASWE (the officially linked weakness
#   catalog, MASVS -> MASWE -> MASTG). Each MASWE-sourced sub-control cites
#   its real MASWE ID and was confirmed present in the official MASWE
#   navigation tree at https://mas.owasp.org/MASWE/ grouped by MASVS
#   category. Not every MASWE item is included — only ones concretely
#   checkable by static or dynamic analysis, per the brief's own guidance
#   to prioritize checkability over exhaustive transcription.
#
#   SEVERITY NOTE — same caveat as llm-integration: MASVS does not publish
#   per-control severity/impact ratings (unlike ASVS's L1/L2/L3 or the API
#   Top 10's Severe/Moderate table). Severities below are Patchi's own
#   judgment, with one exception that IS sourced from the standard itself:
#   OWASP's MASVS-RESILIENCE category introduction explicitly states that
#   "the lack of any of these measures does not necessarily cause
#   vulnerabilities - instead, they add threat-specific additional
#   protection" — this taxonomy honors that explicit disclaimer by rating
#   MASVS-RESILIENCE controls "low", not by treating missing anti-tampering
#   code the same as missing encryption.
# ============================================================================

domain_id: "mobile"
version: "1.0.0"
display_name: "Mobile Application Security"
source_standard: "OWASP MASVS 2.1.0 (2024-01-18), with sub-controls from the linked OWASP MASWE catalog"
component_type: "mobile"
weight: 0.85

activation_signals:
  required_any:
    - signal: "android_project_markers_present (AndroidManifest.xml, build.gradle with com.android.application plugin, or a src/main/java Android project layout)"
    - signal: "ios_project_markers_present (Info.plist, a .xcodeproj/.xcworkspace directory, or a Podfile/Package.swift referencing iOS deployment targets)"
    - signal: "cross_platform_mobile_framework_dependency (package manifest includes react-native, flutter/pubspec.yaml, xamarin, ionic/capacitor, or cordova config.xml)"
  excluded_if:
    - signal: "no_android_no_ios_no_cross_platform_framework (none of the required_any signals fired)"

controls:
  # ==== MASVS-STORAGE: Storage ====
  - control_id: "MOBILE-01"
    name: "Sensitive data securely stored"
    description: "Sensitive data (credentials, PII, cryptographic keys) intentionally stored by the app locally must be properly protected, using platform-provided secure storage (Android Keystore/EncryptedSharedPreferences, iOS Keychain) rather than plaintext files or unencrypted databases."
    source_clause: "OWASP MASVS 2.1.0, MASVS-STORAGE-1"
    severity: "high"
    check_method: "static"
    detector: "Semgrep / MobSF (rule: sensitive-looking values written to SharedPreferences, a plain SQLite database, or UserDefaults without an encryption wrapper)"
    remediation_ref: "fix-playbook://MOBILE-01"

  - control_id: "MOBILE-02"
    name: "Sensitive data not written to application logs"
    description: "Sensitive data (tokens, PII, credentials) must not be written to system/application logs, where it can be read by other apps or during debugging."
    source_clause: "OWASP MASVS 2.1.0, MASVS-STORAGE-1, expanded via OWASP MASWE-0001 (Insertion of Sensitive Data into Logs)"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: Log.d/Log.i/console.log/NSLog call with an argument referencing a token/password/PII-named variable)"
    remediation_ref: "fix-playbook://MOBILE-02"

  - control_id: "MOBILE-03"
    name: "Sensitive data prevented from leaking unintentionally"
    description: "The app must prevent unintentional leakage of sensitive data through side effects of platform APIs, such as unencrypted device backups, clipboard exposure, or auto-generated screenshots of sensitive screens."
    source_clause: "OWASP MASVS 2.1.0, MASVS-STORAGE-2"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: android:allowBackup not set to false in AndroidManifest.xml with no custom backup rules excluding sensitive data; or a sensitive screen missing FLAG_SECURE/isSecureTextEntry)"
    remediation_ref: "fix-playbook://MOBILE-03"

  - control_id: "MOBILE-04"
    name: "Device backups exclude sensitive data or are encrypted"
    description: "If the app's data is included in device-level backups, either the backup must be encrypted or sensitive data must be explicitly excluded from it."
    source_clause: "OWASP MASVS 2.1.0, MASVS-STORAGE-2, expanded via OWASP MASWE-0003 (Backup Unencrypted) and MASWE-0004 (Sensitive Data Not Excluded From Backup)"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: Android backup_rules.xml / iOS NSFileProtection settings that do not exclude directories containing sensitive data)"
    remediation_ref: "fix-playbook://MOBILE-04"

  # ==== MASVS-CRYPTO: Cryptography ====
  - control_id: "MOBILE-05"
    name: "Current, strong cryptography used per industry best practice"
    description: "The app must use up-to-date, strong cryptographic algorithms and modes, avoiding deprecated or broken primitives (DES, RC4, ECB mode, MD5/SHA-1 for security purposes)."
    source_clause: "OWASP MASVS 2.1.0, MASVS-CRYPTO-1"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep (rule: Cipher.getInstance(\"AES/ECB/...\") or use of DES/RC4/MD5/SHA-1 for security-sensitive operations)"
    remediation_ref: "fix-playbook://MOBILE-05"

  - control_id: "MOBILE-06"
    name: "No hardcoded cryptographic keys"
    description: "Cryptographic keys must never be hardcoded in source code, resource files, or configuration bundled into the app package."
    source_clause: "OWASP MASVS 2.1.0, MASVS-CRYPTO-2, expanded via OWASP MASWE-0013 (Hardcoded Cryptographic Keys in Use)"
    severity: "critical"
    check_method: "static"
    detector: "Gitleaks; Semgrep (rule: a SecretKeySpec/SecKeyCreateWithData constructor call using a literal byte array or string constant)"
    remediation_ref: "fix-playbook://MOBILE-06"

  - control_id: "MOBILE-07"
    name: "Cryptographic key management follows industry best practice"
    description: "Cryptographic keys must be generated, stored, and protected throughout their lifecycle following industry best practice, using hardware-backed storage (Android Keystore, iOS Secure Enclave/Keychain) where available."
    source_clause: "OWASP MASVS 2.1.0, MASVS-CRYPTO-2"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep (rule: key generation code that does not use the platform Keystore/Keychain APIs for long-lived sensitive keys)"
    remediation_ref: "fix-playbook://MOBILE-07"

  - control_id: "MOBILE-08"
    name: "Cryptographically secure random number generation"
    description: "Random values used for security purposes (keys, nonces, tokens) must be generated using a cryptographically secure random number generator, not a general-purpose PRNG."
    source_clause: "OWASP MASVS 2.1.0, MASVS-CRYPTO-2, expanded via OWASP MASWE-0027 (Improper Random Number Generation)"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep (rule: java.util.Random / Math.random() / arc4random() used for a security-sensitive value instead of SecureRandom / SecRandomCopyBytes)"
    remediation_ref: "fix-playbook://MOBILE-08"

  # ==== MASVS-AUTH: Authentication and Authorization ====
  - control_id: "MOBILE-09"
    name: "Secure authentication and authorization protocols used"
    description: "The app must use secure, standard authentication and authorization protocols (OAuth2/OIDC, platform SSO) and follow their relevant best practices, rather than custom-built schemes."
    source_clause: "OWASP MASVS 2.1.0, MASVS-AUTH-1"
    severity: "critical"
    check_method: "manual-review"
    detector: "manual-review only (requires assessing the actual auth protocol implementation against its specification)"
    remediation_ref: "fix-playbook://MOBILE-09"

  - control_id: "MOBILE-10"
    name: "No API keys or secrets hardcoded in the app package"
    description: "API keys, client secrets, and other credentials must not be hardcoded in the app binary/package, where they can be extracted via static analysis or decompilation."
    source_clause: "OWASP MASVS 2.1.0, MASVS-AUTH-1, expanded via OWASP MASWE-0005 (API Keys Hardcoded in the App Package)"
    severity: "critical"
    check_method: "static"
    detector: "Gitleaks; MobSF (secrets-in-APK/IPA scanning)"
    remediation_ref: "fix-playbook://MOBILE-10"

  - control_id: "MOBILE-11"
    name: "Local authentication performed securely per platform best practice"
    description: "Local authentication mechanisms (biometrics, device PIN) must be implemented correctly according to platform guidance, including for apps that rely solely on local authentication with no remote endpoint."
    source_clause: "OWASP MASVS 2.1.0, MASVS-AUTH-2"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep (rule: BiometricPrompt/LAContext usage that allows a weak fallback or does not cryptographically bind the result to a protected operation)"
    remediation_ref: "fix-playbook://MOBILE-11"

  - control_id: "MOBILE-12"
    name: "Biometric authentication cannot be trivially bypassed"
    description: "Biometric authentication implementations must resist common bypass techniques (e.g. accepting a successful callback without verifying it against a cryptographic operation actually gated by the biometric)."
    source_clause: "OWASP MASVS 2.1.0, MASVS-AUTH-2, expanded via OWASP MASWE-0044 (Biometric Authentication Can Be Bypassed)"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep (rule: BiometricPrompt.AuthenticationCallback.onAuthenticationSucceeded that sets an app-level flag instead of using a CryptoObject tied to a Keystore-protected key)"
    remediation_ref: "fix-playbook://MOBILE-12"

  - control_id: "MOBILE-13"
    name: "Sensitive operations require additional authentication"
    description: "Sensitive in-app operations (payments, changing security settings) must require additional authentication beyond the app's normal session state (step-up biometric/PIN/MFA)."
    source_clause: "OWASP MASVS 2.1.0, MASVS-AUTH-3"
    severity: "critical"
    check_method: "manual-review"
    detector: "manual-review only (requires identifying which operations are 'sensitive' for this specific app)"
    remediation_ref: "fix-playbook://MOBILE-13"

  # ==== MASVS-NETWORK: Network Communication ====
  - control_id: "MOBILE-14"
    name: "All network traffic secured per current best practice"
    description: "All network communication must be secured using TLS configured according to current best practice (no cleartext, no deprecated TLS versions, no disabled certificate validation)."
    source_clause: "OWASP MASVS 2.1.0, MASVS-NETWORK-1"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: android:usesCleartextTraffic=\"true\", an ATS exception (NSAllowsArbitraryLoads) in Info.plist, or a custom TrustManager/URLSession delegate that accepts all certificates)"
    remediation_ref: "fix-playbook://MOBILE-14"

  - control_id: "MOBILE-15"
    name: "No cleartext network traffic"
    description: "The app must not transmit sensitive data over unencrypted (HTTP/cleartext) connections."
    source_clause: "OWASP MASVS 2.1.0, MASVS-NETWORK-1, expanded via OWASP MASWE-0050 (Cleartext Traffic)"
    severity: "high"
    check_method: "dynamic"
    detector: "OWASP ZAP / MobSF dynamic traffic capture (passive scan for plaintext HTTP requests during app execution)"
    remediation_ref: "fix-playbook://MOBILE-15"

  - control_id: "MOBILE-16"
    name: "TLS certificate validation not disabled or weakened"
    description: "Certificate validation must not be disabled, weakened, or bypassed anywhere in the app's networking code, including in third-party SDKs."
    source_clause: "OWASP MASVS 2.1.0, MASVS-NETWORK-1, expanded via OWASP MASWE-0052 (Insecure Certificate Validation)"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: a TrustManager.checkServerTrusted() implementation with an empty body, or NSURLConnection/URLSession delegate methods that call the completion handler with .useCredential regardless of the challenge)"
    remediation_ref: "fix-playbook://MOBILE-16"

  - control_id: "MOBILE-17"
    name: "Identity pinning performed for developer-controlled endpoints"
    description: "The app must perform certificate or public-key pinning for all remote endpoints under the developer's own control, to defend against CA compromise and on-path interception."
    source_clause: "OWASP MASVS 2.1.0, MASVS-NETWORK-2"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: absence of a pinning configuration — Android Network Security Config <pin-set>, or an iOS pinning library/manual public-key comparison — for a networking client connecting to a first-party API host)"
    remediation_ref: "fix-playbook://MOBILE-17"

  # ==== MASVS-PLATFORM: Platform Interaction ====
  - control_id: "MOBILE-18"
    name: "Inter-process communication (IPC) mechanisms used securely"
    description: "Platform-provided IPC mechanisms (Android Intents/Content Providers/Broadcast Receivers, iOS URL schemes/Universal Links/app extensions) that the app exposes must be secured against unauthorized access or data injection from other apps."
    source_clause: "OWASP MASVS 2.1.0, MASVS-PLATFORM-1"
    severity: "high"
    check_method: "static"
    detector: "Semgrep / MobSF (rule: an exported Activity/Service/Receiver/ContentProvider in AndroidManifest.xml with android:exported=\"true\" and no permission/signature check)"
    remediation_ref: "fix-playbook://MOBILE-18"

  - control_id: "MOBILE-19"
    name: "Deep links validated before acting on their content"
    description: "Deep links / custom URL schemes must be validated (source, parameters, and target) before the app acts on them, to prevent unauthorized navigation or function invocation."
    source_clause: "OWASP MASVS 2.1.0, MASVS-PLATFORM-1, expanded via OWASP MASWE-0058 (Insecure Deep Links)"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: a deep-link/intent handler that extracts parameters and passes them directly to a sensitive action — navigation, data write, auth state change — with no validation)"
    remediation_ref: "fix-playbook://MOBILE-19"

  - control_id: "MOBILE-20"
    name: "WebViews configured securely"
    description: "WebViews must be configured to prevent sensitive data leakage and unintended functionality exposure, including disabling unnecessary JavaScript bridges to native code and restricting content loading to trusted origins."
    source_clause: "OWASP MASVS 2.1.0, MASVS-PLATFORM-2"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: WebView.addJavascriptInterface() exposing a broad native API to untrusted web content, or setJavaScriptEnabled(true) combined with loadUrl() on a user/externally-supplied URL)"
    remediation_ref: "fix-playbook://MOBILE-20"

  - control_id: "MOBILE-21"
    name: "JavaScript bridges in WebViews minimized and scoped"
    description: "Native functionality exposed to WebView JavaScript must be limited to the minimum necessary and must not expose sensitive operations to content loaded from untrusted or remote origins."
    source_clause: "OWASP MASVS 2.1.0, MASVS-PLATFORM-2, expanded via OWASP MASWE-0068 (JavaScript Bridges in WebViews)"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: a @JavascriptInterface-annotated class exposing methods that read/write sensitive data or invoke privileged operations)"
    remediation_ref: "fix-playbook://MOBILE-21"

  - control_id: "MOBILE-22"
    name: "Sensitive data protected in the user interface"
    description: "Sensitive data displayed in the UI (passwords, card numbers, OTPs in notifications) must be protected from unintentional exposure via platform mechanisms such as auto-generated screenshots, the app-switcher preview, or shoulder-surfing-prone display."
    source_clause: "OWASP MASVS 2.1.0, MASVS-PLATFORM-3"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: an Activity/View displaying sensitive fields with no FLAG_SECURE (Android) or equivalent screenshot-blur-on-background handling (iOS))"
    remediation_ref: "fix-playbook://MOBILE-22"

  # ==== MASVS-CODE: Code Quality ====
  - control_id: "MOBILE-23"
    name: "App requires an up-to-date platform version"
    description: "The app should require or encourage running on an up-to-date OS platform version, so users receive current platform-level security patches."
    source_clause: "OWASP MASVS 2.1.0, MASVS-CODE-1"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: Android minSdkVersion / iOS deployment target set well below the currently-supported OS baseline)"
    remediation_ref: "fix-playbook://MOBILE-23"

  - control_id: "MOBILE-24"
    name: "Mechanism exists to enforce app updates"
    description: "The app must have a mechanism to force users to update before continuing to use it, so that critical vulnerabilities discovered post-release can be remediated in the field."
    source_clause: "OWASP MASVS 2.1.0, MASVS-CODE-2"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only (feature-presence check)"
    remediation_ref: "fix-playbook://MOBILE-24"

  - control_id: "MOBILE-25"
    name: "No software components with known vulnerabilities"
    description: "The app must only use third-party libraries and components that do not have publicly known vulnerabilities."
    source_clause: "OWASP MASVS 2.1.0, MASVS-CODE-3, expanded via OWASP MASWE-0076 (Dependencies with Known Vulnerabilities)"
    severity: "high"
    check_method: "static"
    detector: "OSV-Scanner (run against the app's dependency manifest — build.gradle/Podfile/pubspec.yaml — and generated SBOM)"
    remediation_ref: "fix-playbook://MOBILE-25"

  - control_id: "MOBILE-26"
    name: "All untrusted input validated and sanitized"
    description: "Data entering the app through any entry point (UI, IPC, network, file system) must be treated as untrusted and validated/sanitized before use, to prevent classical injection attacks and insecure deserialization."
    source_clause: "OWASP MASVS 2.1.0, MASVS-CODE-4"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: string-concatenated SQL queries against a local database, or deserialization of untrusted data using an unsafe deserializer)"
    remediation_ref: "fix-playbook://MOBILE-26"

  - control_id: "MOBILE-27"
    name: "No SQL injection in local database queries or Content Providers"
    description: "Local database queries (including those exposed via Android Content Providers) must use parameterized queries, never string concatenation of untrusted input."
    source_clause: "OWASP MASVS 2.1.0, MASVS-CODE-4, expanded via OWASP MASWE-0086 (SQL Injection)"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: rawQuery()/execSQL() called with a string built via concatenation of a Content Provider URI segment or external input)"
    remediation_ref: "fix-playbook://MOBILE-27"

  - control_id: "MOBILE-28"
    name: "No insecure deserialization of untrusted data"
    description: "The app must not deserialize untrusted data (from IPC, network, or files) using deserialization mechanisms that can be abused to construct arbitrary objects or execute code."
    source_clause: "OWASP MASVS 2.1.0, MASVS-CODE-4, expanded via OWASP MASWE-0088 (Insecure Object Deserialization)"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: ObjectInputStream.readObject() / NSKeyedUnarchiver.unarchiveObject called on data from an untrusted source without a safe allowlist)"
    remediation_ref: "fix-playbook://MOBILE-28"

  # ==== MASVS-RESILIENCE: Resilience Against Reverse Engineering and Tampering ====
  # NOTE: OWASP's own MASVS-RESILIENCE introduction explicitly states these
  # controls are additional, threat-specific protection, and their absence
  # does not itself constitute a vulnerability — hence "low" severity below,
  # sourced from the standard's own framing rather than Patchi's judgment.
  - control_id: "MOBILE-29"
    name: "App validates platform integrity"
    description: "The app should validate that it is not running on a compromised (rooted/jailbroken) or virtualized/emulated platform, for apps where this threat model applies."
    source_clause: "OWASP MASVS 2.1.0, MASVS-RESILIENCE-1"
    severity: "low"
    check_method: "static"
    detector: "manual-review; Semgrep can flag whether any root/jailbreak-detection API call exists at all, as a coarse presence signal"
    remediation_ref: "fix-playbook://MOBILE-29"

  - control_id: "MOBILE-30"
    name: "Root/jailbreak detection implemented"
    description: "For apps where platform integrity is part of the threat model, root/jailbreak detection mechanisms should be implemented and kept current as bypass techniques evolve."
    source_clause: "OWASP MASVS 2.1.0, MASVS-RESILIENCE-1, expanded via OWASP MASWE-0097 (Root/Jailbreak Detection Not Implemented)"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only (presence and currency of root/jailbreak detection is context-dependent on the app's actual risk profile)"
    remediation_ref: "fix-playbook://MOBILE-30"

  - control_id: "MOBILE-31"
    name: "Anti-tampering mechanisms implemented"
    description: "The app should implement anti-tampering mechanisms (integrity checks on code/resources, signature verification) to protect against modification and repackaging, for apps where this threat model applies."
    source_clause: "OWASP MASVS 2.1.0, MASVS-RESILIENCE-2"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://MOBILE-31"

  - control_id: "MOBILE-32"
    name: "Anti-static-analysis mechanisms implemented"
    description: "The app should implement mechanisms (obfuscation, code hardening) to impede static analysis and comprehension of the app's functioning, for apps where IP protection or high resilience is part of the threat model."
    source_clause: "OWASP MASVS 2.1.0, MASVS-RESILIENCE-3"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://MOBILE-32"

  - control_id: "MOBILE-33"
    name: "Anti-dynamic-analysis techniques implemented"
    description: "The app should implement techniques to impede dynamic analysis and runtime instrumentation (debugger detection, hooking-framework detection), for apps where this threat model applies."
    source_clause: "OWASP MASVS 2.1.0, MASVS-RESILIENCE-4"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://MOBILE-33"

  # ==== MASVS-PRIVACY: Privacy ====
  - control_id: "MOBILE-34"
    name: "Access to sensitive data and resources minimized"
    description: "The app must request and access only the sensitive data/device resources (permissions) it genuinely needs for its functionality, following least-privilege."
    source_clause: "OWASP MASVS 2.1.0, MASVS-PRIVACY-1"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep / MobSF (rule: dangerous Android permissions declared in AndroidManifest.xml, or iOS Info.plist usage-description keys, with no corresponding feature usage found elsewhere in the code)"
    remediation_ref: "fix-playbook://MOBILE-34"

  - control_id: "MOBILE-35"
    name: "User identification/tracking prevented or minimized"
    description: "The app must avoid using persistent, cross-app-identifiable identifiers to track individual users beyond what is disclosed and necessary."
    source_clause: "OWASP MASVS 2.1.0, MASVS-PRIVACY-2, expanded via OWASP MASWE-0110 (Use of Unique Identifiers for User Tracking)"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: use of a hardware-derived identifier — IMEI, MAC address, Android ID — for tracking rather than a resettable advertising ID)"
    remediation_ref: "fix-playbook://MOBILE-35"

  - control_id: "MOBILE-36"
    name: "Transparent about data collection and usage"
    description: "The app must be transparent with users about what data it collects and how it is used, matching its actual behavior to its stated privacy policy and app-store data-safety declarations."
    source_clause: "OWASP MASVS 2.1.0, MASVS-PRIVACY-3"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only (requires comparing actual data flows against the published privacy policy/data-safety label)"
    remediation_ref: "fix-playbook://MOBILE-36"

  - control_id: "MOBILE-37"
    name: "Users offered control over their data"
    description: "The app must offer users meaningful control over their data (viewing, exporting, deleting, or restricting collection), consistent with applicable privacy regulations."
    source_clause: "OWASP MASVS 2.1.0, MASVS-PRIVACY-4"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only (feature-presence check)"
    remediation_ref: "fix-playbook://MOBILE-37"

