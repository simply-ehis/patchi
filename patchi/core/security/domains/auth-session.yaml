# ============================================================================
# Patchi Security Domain: auth-session
# ============================================================================
# SOURCE VERIFICATION NOTE:
#   Source standard: OWASP ASVS 5.0.0 (released 2025-05-30, confirmed current).
#   Confidence: HIGH. Every req_id/description/level below was extracted
#   directly from the official machine-readable CSV at the v5.0.0 git tag:
#   https://raw.githubusercontent.com/OWASP/ASVS/v5.0.0/5.0/docs_en/
#   OWASP_Application_Security_Verification_Standard_5.0.0_en.csv
#   (downloaded and parsed programmatically, not recalled from memory).
#   This domain covers the two ASVS chapters most directly about
#   authentication and session handling: V6 "Authentication" (47
#   requirements) and V7 "Session Management" (19 requirements) — 66 total.
#   Descriptions below are reworded, not verbatim, per copyright policy;
#   original requirement text is OWASP's, licensed CC-BY-SA 4.0.
#
#   SAME SEVERITY CONVENTION AS OTHER ASVS-SOURCED DOMAINS:
#   L1 -> "high", L2 -> "medium", L3 -> "low".
#
#   UNLIKE the other domains in this taxonomy, auth-session is NOT scoped
#   to one component_type — ASVS itself doesn't split authentication logic
#   by frontend/backend, and in practice session cookies, login forms, and
#   token verification span both. This domain activates only when the
#   scanner's static analysis actually finds authentication/session code,
#   per the activation_signals below, regardless of whether the surrounding
#   component is classified frontend-web or backend-api.
# ============================================================================

domain_id: "auth-session"
version: "1.0.0"
display_name: "Authentication & Session Management"
source_standard: "OWASP ASVS 5.0.0 (Chapter V6: Authentication; Chapter V7: Session Management)"
component_type: "backend-api,frontend-web"
weight: 0.9

activation_signals:
  required_any:
    - signal: "session_middleware_dependency_present (package manifest includes express-session, cookie-session, django.contrib.sessions, flask-login, flask-session, devise, warden, spring-security, next-auth, or similar)"
    - signal: "jwt_or_token_library_dependency_present (package manifest includes jsonwebtoken, pyjwt, jose, ruby-jwt, jjwt, or similar, OR code contains a JWT verification/signing call)"
    - signal: "login_route_pattern_detected (a route/view/controller matching /login, /signin, /auth, /session, /token, or an OAuth/OIDC/SAML callback path)"
    - signal: "password_handling_code_detected (code calling a password-hashing function such as bcrypt/argon2/scrypt/pbkdf2, or a database column/model field named password/password_hash)"
  excluded_if:
    - signal: "no_session_no_token_no_login_route_no_password_handling (none of the required_any signals fired anywhere in the codebase)"

controls:
  # ---- V6.1 Authentication Documentation ----
  - control_id: "AUTHSESS-01"
    name: "Documented anti-automation and rate-limiting controls for authentication"
    description: "Documentation must specify how rate limiting, anti-automation, and adaptive response defend against credential stuffing and brute force, including how these controls avoid enabling malicious account lockout of legitimate users."
    source_clause: "ASVS 5.0.0 V6.1.1"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-01"

  - control_id: "AUTHSESS-02"
    name: "Documented context-specific password blocklist"
    description: "A list of context-specific words (organization/product names, project codenames, department/role names, and permutations) must be documented for exclusion from allowed passwords."
    source_clause: "ASVS 5.0.0 V6.1.2"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-02"

  - control_id: "AUTHSESS-03"
    name: "All authentication pathways documented with consistent security controls"
    description: "If multiple authentication pathways exist, all must be documented together with the security controls and authentication strength that must be consistently enforced across them."
    source_clause: "ASVS 5.0.0 V6.1.3"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-03"

  # ---- V6.2 Password Security ----
  - control_id: "AUTHSESS-04"
    name: "Minimum password length of 8 characters"
    description: "User-set passwords must be at least 8 characters long (15+ strongly recommended)."
    source_clause: "ASVS 5.0.0 V6.2.1"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: password-field validation schema with minLength/min_length less than 8)"
    remediation_ref: "fix-playbook://AUTHSESS-04"

  - control_id: "AUTHSESS-05"
    name: "Users can change their password"
    description: "The application must provide password-change functionality for users."
    source_clause: "ASVS 5.0.0 V6.2.2"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only (presence/absence of a feature, not a code pattern)"
    remediation_ref: "fix-playbook://AUTHSESS-05"

  - control_id: "AUTHSESS-06"
    name: "Password-change requires current and new password"
    description: "Password-change functionality must require the user to submit both their current password and the new password."
    source_clause: "ASVS 5.0.0 V6.2.3"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: password-change handler that does not read/verify a current_password field before updating)"
    remediation_ref: "fix-playbook://AUTHSESS-06"

  - control_id: "AUTHSESS-07"
    name: "New passwords checked against a common-password list"
    description: "Passwords submitted at registration or change must be checked against at least the top 3000 most common passwords matching the app's length policy."
    source_clause: "ASVS 5.0.0 V6.2.4"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: password-validation function that does not call a common-password/blocklist check) — actual blocklist source is a known open dataset (e.g. the 'Have I Been Pwned' common-password list or SecLists)"
    remediation_ref: "fix-playbook://AUTHSESS-07"

  - control_id: "AUTHSESS-08"
    name: "No arbitrary character-composition rules on passwords"
    description: "Passwords of any character composition must be accepted; there must be no forced-mix rules requiring specific character classes."
    source_clause: "ASVS 5.0.0 V6.2.5"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: password validation regex requiring specific character-class combinations, e.g. requiring at least one uppercase AND one digit AND one symbol)"
    remediation_ref: "fix-playbook://AUTHSESS-08"

  - control_id: "AUTHSESS-09"
    name: "Password input field masked (type=password)"
    description: "Password input fields must use type=password to mask entry, optionally allowing temporary reveal of the whole password or last character."
    source_clause: "ASVS 5.0.0 V6.2.6"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: an <input> element bound to a password/passwd/pwd field using type=\"text\" instead of type=\"password\")"
    remediation_ref: "fix-playbook://AUTHSESS-09"

  - control_id: "AUTHSESS-10"
    name: "Paste and password-manager autofill permitted"
    description: "Password fields must permit paste functionality, browser password helpers, and external password managers rather than blocking them."
    source_clause: "ASVS 5.0.0 V6.2.7"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: onpaste handler that calls preventDefault() on a password field, or autocomplete=\"off\" set on a password/login field)"
    remediation_ref: "fix-playbook://AUTHSESS-10"

  - control_id: "AUTHSESS-11"
    name: "Password verified exactly as submitted, without silent modification"
    description: "The application must verify the user's password exactly as received, with no truncation, trimming, or case transformation before comparison."
    source_clause: "ASVS 5.0.0 V6.2.8"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: password value passed through .lower()/.upper()/substring/truncation before hashing or comparison)"
    remediation_ref: "fix-playbook://AUTHSESS-11"

  - control_id: "AUTHSESS-12"
    name: "Passwords up to at least 64 characters accepted"
    description: "The application must permit passwords of at least 64 characters."
    source_clause: "ASVS 5.0.0 V6.2.9"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: password-field validation schema with maxLength/max_length less than 64)"
    remediation_ref: "fix-playbook://AUTHSESS-12"

  - control_id: "AUTHSESS-13"
    name: "No mandatory periodic password rotation"
    description: "A password must remain valid until it's known to be compromised or the user rotates it voluntarily; the app must not force periodic credential rotation."
    source_clause: "ASVS 5.0.0 V6.2.10"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: a scheduled job or check enforcing password_expiry_days / forced rotation logic)"
    remediation_ref: "fix-playbook://AUTHSESS-13"

  - control_id: "AUTHSESS-14"
    name: "Context-specific word list enforced against new passwords"
    description: "The documented context-specific word list (see AUTHSESS-02) must actually be used to reject easily-guessed passwords built from it."
    source_clause: "ASVS 5.0.0 V6.2.11"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep can flag whether a password-validation function references a context-word list at all; correctness of the list requires manual-review"
    remediation_ref: "fix-playbook://AUTHSESS-14"

  - control_id: "AUTHSESS-15"
    name: "New passwords checked against a breached-password set"
    description: "Passwords submitted at registration or change must be checked against a database of known-breached passwords (e.g. via the Have I Been Pwned Pwned Passwords API using k-anonymity)."
    source_clause: "ASVS 5.0.0 V6.2.12"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: password-validation function with no call to a breached-password check service/library)"
    remediation_ref: "fix-playbook://AUTHSESS-15"

  # ---- V6.3 General Authentication Security ----
  - control_id: "AUTHSESS-16"
    name: "Credential-stuffing and brute-force controls match documented design"
    description: "Implemented anti-automation controls (rate limiting, lockout, CAPTCHA) must actually match what the security documentation (AUTHSESS-01) specifies."
    source_clause: "ASVS 5.0.0 V6.3.1"
    severity: "high"
    check_method: "dynamic"
    detector: "OWASP ZAP (brute-force/credential-stuffing active scan rule)"
    remediation_ref: "fix-playbook://AUTHSESS-16"

  - control_id: "AUTHSESS-17"
    name: "No default/well-known accounts present or enabled"
    description: "Default accounts such as root, admin, or sa must not exist in the application, or must be disabled."
    source_clause: "ASVS 5.0.0 V6.3.2"
    severity: "high"
    check_method: "dynamic"
    detector: "OWASP ZAP (default-credential active scan rule)"
    remediation_ref: "fix-playbook://AUTHSESS-17"

  - control_id: "AUTHSESS-18"
    name: "Multi-factor or combined-factor authentication required"
    description: "Application access must require multi-factor authentication or a documented combination of single-factor mechanisms; L3 requires a hardware-based, phishing-resistant factor with user-initiated intent confirmation."
    source_clause: "ASVS 5.0.0 V6.3.3"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-18"

  - control_id: "AUTHSESS-19"
    name: "No undocumented authentication pathways"
    description: "Every authentication pathway that actually exists must be documented, with consistent security controls and authentication strength; undocumented pathways must not exist."
    source_clause: "ASVS 5.0.0 V6.3.4"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only (requires comparing actual code routes against documentation)"
    remediation_ref: "fix-playbook://AUTHSESS-19"

  - control_id: "AUTHSESS-20"
    name: "Users notified of suspicious authentication attempts"
    description: "Users should be notified of suspicious authentication attempts, e.g. from an unusual location/client, partial MFA success, attempts after long inactivity, or success following several failures."
    source_clause: "ASVS 5.0.0 V6.3.5"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-20"

  - control_id: "AUTHSESS-21"
    name: "Email not used as an authentication factor"
    description: "Email must not be used as either a single-factor or multi-factor authentication mechanism."
    source_clause: "ASVS 5.0.0 V6.3.6"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-21"

  - control_id: "AUTHSESS-22"
    name: "Users notified after authentication-detail changes"
    description: "Users must be notified after credential resets or modifications to username/email address."
    source_clause: "ASVS 5.0.0 V6.3.7"
    severity: "low"
    check_method: "static"
    detector: "Semgrep (rule: credential-update handler with no call to a notification/email-sending function)"
    remediation_ref: "fix-playbook://AUTHSESS-22"

  - control_id: "AUTHSESS-23"
    name: "Valid users cannot be enumerated via failed authentication behavior"
    description: "Valid usernames must not be deducible from error messages, HTTP status codes, or response-time differences on login, registration, or forgot-password flows."
    source_clause: "ASVS 5.0.0 V6.3.8"
    severity: "low"
    check_method: "dynamic"
    detector: "OWASP ZAP (username-enumeration active scan rule)"
    remediation_ref: "fix-playbook://AUTHSESS-23"

  # ---- V6.4 Authentication Factor Lifecycle and Recovery ----
  - control_id: "AUTHSESS-24"
    name: "System-generated initial passwords are random, policy-compliant, and short-lived"
    description: "System-generated initial passwords/activation codes must be securely randomly generated, follow the password policy, expire quickly or after first use, and must not be allowed to become the permanent password."
    source_clause: "ASVS 5.0.0 V6.4.1"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: initial-password/activation-code generation not using a CSPRNG, e.g. Math.random() or a non-cryptographic RNG)"
    remediation_ref: "fix-playbook://AUTHSESS-24"

  - control_id: "AUTHSESS-25"
    name: "No password hints or knowledge-based secret questions"
    description: "The application must not use password hints or knowledge-based 'secret questions' as a recovery mechanism."
    source_clause: "ASVS 5.0.0 V6.4.2"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only (a feature-presence check)"
    remediation_ref: "fix-playbook://AUTHSESS-25"

  - control_id: "AUTHSESS-26"
    name: "Password-reset process does not bypass MFA"
    description: "The forgotten-password reset process must not allow bypassing any multi-factor authentication mechanism the user has enabled."
    source_clause: "ASVS 5.0.0 V6.4.3"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only (requires tracing the reset flow against the MFA-enabled account path)"
    remediation_ref: "fix-playbook://AUTHSESS-26"

  - control_id: "AUTHSESS-27"
    name: "Lost MFA factor requires enrollment-level identity proofing"
    description: "If a user loses an MFA factor, recovery must require identity proofing at the same strength as original enrollment."
    source_clause: "ASVS 5.0.0 V6.4.4"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-27"

  - control_id: "AUTHSESS-28"
    name: "Timely renewal reminders for expiring authentication mechanisms"
    description: "Renewal instructions for authentication mechanisms that expire (e.g. certificates) must be sent with enough lead time to act before expiry, with automated reminders where needed."
    source_clause: "ASVS 5.0.0 V6.4.5"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-28"

  - control_id: "AUTHSESS-29"
    name: "Admin-initiated password reset cannot reveal or set the user's password"
    description: "Administrators may trigger a password reset process for a user but must not be able to view or directly set that user's new password."
    source_clause: "ASVS 5.0.0 V6.4.6"
    severity: "low"
    check_method: "static"
    detector: "Semgrep (rule: an admin-facing route that directly sets a target user's password field rather than triggering a reset-token flow)"
    remediation_ref: "fix-playbook://AUTHSESS-29"

  # ---- V6.5 General Multi-factor authentication requirements ----
  - control_id: "AUTHSESS-30"
    name: "One-time secrets/codes usable only once"
    description: "Lookup secrets, out-of-band codes, and TOTPs must only be successfully consumable a single time."
    source_clause: "ASVS 5.0.0 V6.5.1"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: OTP/TOTP verification function that does not mark the code as consumed/invalidate it after successful use)"
    remediation_ref: "fix-playbook://AUTHSESS-30"

  - control_id: "AUTHSESS-31"
    name: "Low-entropy lookup secrets hashed with salt before storage"
    description: "Lookup secrets with under 112 bits of entropy must be hashed with an approved password-hashing algorithm and a 32-bit random salt when stored; higher-entropy secrets may use a standard hash."
    source_clause: "ASVS 5.0.0 V6.5.2"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: lookup-secret storage using an unsalted or non-approved hash function)"
    remediation_ref: "fix-playbook://AUTHSESS-31"

  - control_id: "AUTHSESS-32"
    name: "MFA secrets/codes generated with a CSPRNG"
    description: "Lookup secrets, out-of-band codes, and TOTP seeds must be generated using a cryptographically secure pseudo-random number generator."
    source_clause: "ASVS 5.0.0 V6.5.3"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: OTP/secret generation using Math.random(), random.random(), or another non-CSPRNG source)"
    remediation_ref: "fix-playbook://AUTHSESS-32"

  - control_id: "AUTHSESS-33"
    name: "Minimum 20 bits of entropy for lookup secrets / OOB codes"
    description: "Lookup secrets and out-of-band codes must have at least 20 bits of entropy (roughly 4 random alphanumeric characters or 6 random digits)."
    source_clause: "ASVS 5.0.0 V6.5.4"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: OTP code generated with fewer than 6 digits or an equivalent low-entropy character set)"
    remediation_ref: "fix-playbook://AUTHSESS-33"

  - control_id: "AUTHSESS-34"
    name: "Defined lifetime for OOB requests and TOTPs"
    description: "Out-of-band authentication requests/codes/tokens and TOTPs must have a bounded lifetime (OOB requests: max 10 minutes; TOTP: max 30 seconds)."
    source_clause: "ASVS 5.0.0 V6.5.5"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: OOB code / TOTP validity window configured beyond the specified maximums)"
    remediation_ref: "fix-playbook://AUTHSESS-34"

  - control_id: "AUTHSESS-35"
    name: "Authentication factors are revocable"
    description: "Any authentication factor, including physical devices, must be revocable in case of theft or loss."
    source_clause: "ASVS 5.0.0 V6.5.6"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only (feature-presence check)"
    remediation_ref: "fix-playbook://AUTHSESS-35"

  - control_id: "AUTHSESS-36"
    name: "Biometric authentication used only as a secondary factor"
    description: "Biometric mechanisms must only be used alongside a possession-based or knowledge-based factor, never as the sole authentication factor."
    source_clause: "ASVS 5.0.0 V6.5.7"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-36"

  - control_id: "AUTHSESS-37"
    name: "TOTP validated against a trusted server-side time source"
    description: "TOTP validation must use a trusted service's time source, not an untrusted or client-supplied time value."
    source_clause: "ASVS 5.0.0 V6.5.8"
    severity: "low"
    check_method: "static"
    detector: "Semgrep (rule: TOTP verification function accepting a client-supplied timestamp parameter instead of using server clock time)"
    remediation_ref: "fix-playbook://AUTHSESS-37"

  # ---- V6.6 Out-of-Band authentication mechanisms ----
  - control_id: "AUTHSESS-38"
    name: "PSTN/SMS OTP requires verified phone number and stronger alternative offered"
    description: "Phone/SMS-delivered OTPs must only be offered for a previously-verified phone number, alongside a stronger alternative (e.g. TOTP) and risk disclosure; L3 apps must not offer phone/SMS at all."
    source_clause: "ASVS 5.0.0 V6.6.1"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-38"

  - control_id: "AUTHSESS-39"
    name: "OOB codes bound to the originating authentication request"
    description: "Out-of-band authentication requests/codes/tokens must be bound to the specific authentication request that generated them and unusable for a different request."
    source_clause: "ASVS 5.0.0 V6.6.2"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: OOB code verification that does not check the code against a request-specific identifier/session binding)"
    remediation_ref: "fix-playbook://AUTHSESS-39"

  - control_id: "AUTHSESS-40"
    name: "Rate limiting on code-based out-of-band authentication"
    description: "A code-based OOB mechanism must be rate-limited against brute force, ideally alongside a code with at least 64 bits of entropy."
    source_clause: "ASVS 5.0.0 V6.6.3"
    severity: "medium"
    check_method: "dynamic"
    detector: "OWASP ZAP (brute-force active scan rule against the OOB code-verification endpoint)"
    remediation_ref: "fix-playbook://AUTHSESS-40"

  - control_id: "AUTHSESS-41"
    name: "Rate limiting on MFA push notifications to prevent push bombing"
    description: "Where push notifications are used for MFA, rate limiting must prevent push-bombing attacks; number matching is an additional mitigation."
    source_clause: "ASVS 5.0.0 V6.6.4"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-41"

  # ---- V6.7 Cryptographic authentication mechanism ----
  - control_id: "AUTHSESS-42"
    name: "Cryptographic authentication certificates protected from modification"
    description: "Certificates used to verify cryptographic authentication assertions must be stored in a way that protects them from tampering."
    source_clause: "ASVS 5.0.0 V6.7.1"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-42"

  - control_id: "AUTHSESS-43"
    name: "Cryptographic challenge nonce length and uniqueness"
    description: "The challenge nonce for cryptographic authentication must be at least 64 bits and statistically unique, or unique over the device's lifetime."
    source_clause: "ASVS 5.0.0 V6.7.2"
    severity: "low"
    check_method: "static"
    detector: "Semgrep (rule: challenge-nonce generation producing fewer than 64 bits)"
    remediation_ref: "fix-playbook://AUTHSESS-43"

  # ---- V6.8 Authentication with an Identity Provider ----
  - control_id: "AUTHSESS-44"
    name: "Identity cannot be spoofed across multiple identity providers"
    description: "If the app supports multiple IdPs, a user's identity from one IdP must not be spoofable via another (e.g. by identifier collision); users should be namespaced by IdP-ID plus IdP-internal user-ID."
    source_clause: "ASVS 5.0.0 V6.8.1"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only (requires reviewing the identity-linking logic)"
    remediation_ref: "fix-playbook://AUTHSESS-44"

  - control_id: "AUTHSESS-45"
    name: "Digital signatures on authentication assertions always validated"
    description: "The presence and validity of digital signatures on authentication assertions (JWTs, SAML assertions) must always be checked, rejecting unsigned or invalidly-signed assertions."
    source_clause: "ASVS 5.0.0 V6.8.2"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: JWT/SAML assertion parsing without a corresponding signature-verification call, or verification with signature checking disabled)"
    remediation_ref: "fix-playbook://AUTHSESS-45"

  - control_id: "AUTHSESS-46"
    name: "SAML assertions processed only once within validity period"
    description: "SAML assertions must be tracked as uniquely used within their validity period to prevent replay."
    source_clause: "ASVS 5.0.0 V6.8.3"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: SAML assertion-processing code with no assertion-ID replay cache/check)"
    remediation_ref: "fix-playbook://AUTHSESS-46"

  - control_id: "AUTHSESS-47"
    name: "Application enforces expected authentication strength from IdP claims"
    description: "If specific authentication strength/method/recency is expected for a function, the app must verify this via IdP-provided claims (e.g. OIDC acr/amr/auth_time), with a documented fallback (assume minimum strength) if the IdP omits this data."
    source_clause: "ASVS 5.0.0 V6.8.4"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-47"

  # ---- V7.1 Session Management Documentation ----
  - control_id: "AUTHSESS-48"
    name: "Session inactivity timeout and max lifetime documented"
    description: "The inactivity timeout and absolute maximum session lifetime must be documented, appropriate alongside other controls, with justification for any deviation from NIST SP 800-63B re-authentication guidance."
    source_clause: "ASVS 5.0.0 V7.1.1"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-48"

  - control_id: "AUTHSESS-49"
    name: "Concurrent-session policy documented"
    description: "Documentation must define the allowed number of concurrent sessions per account and the intended behavior once that maximum is reached."
    source_clause: "ASVS 5.0.0 V7.1.2"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-49"

  - control_id: "AUTHSESS-50"
    name: "Federated session-management systems documented"
    description: "Every system that creates/manages sessions as part of a federated identity ecosystem (e.g. SSO) must be documented along with controls coordinating session lifetime, termination, and re-authentication triggers."
    source_clause: "ASVS 5.0.0 V7.1.3"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-50"

  # ---- V7.2 Fundamental Session Management Security ----
  - control_id: "AUTHSESS-51"
    name: "Session token verification performed by a trusted backend service"
    description: "All session token verification must happen via a trusted backend service, not a client-trusted or externally-modifiable check."
    source_clause: "ASVS 5.0.0 V7.2.1"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only (requires tracing where verification logic executes)"
    remediation_ref: "fix-playbook://AUTHSESS-51"

  - control_id: "AUTHSESS-52"
    name: "Session tokens dynamically generated, not static API secrets"
    description: "Session management must use dynamically generated self-contained or reference tokens, never static, unchanging API secrets/keys as session identifiers."
    source_clause: "ASVS 5.0.0 V7.2.2"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: a session/auth token hardcoded as a static string constant, or a static API key reused as a session identifier)"
    remediation_ref: "fix-playbook://AUTHSESS-52"

  - control_id: "AUTHSESS-53"
    name: "Reference session tokens unique, CSPRNG-generated, >=128 bits entropy"
    description: "If reference tokens represent sessions, they must be unique, generated with a CSPRNG, and carry at least 128 bits of entropy."
    source_clause: "ASVS 5.0.0 V7.2.3"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: session-token generation using a non-CSPRNG source, or a token length implying fewer than 128 bits of entropy)"
    remediation_ref: "fix-playbook://AUTHSESS-53"

  - control_id: "AUTHSESS-54"
    name: "New session token issued and old one terminated on (re-)authentication"
    description: "On every user authentication or re-authentication, the application must generate a fresh session token and terminate the prior one, preventing session fixation."
    source_clause: "ASVS 5.0.0 V7.2.4"
    severity: "high"
    check_method: "dynamic"
    detector: "OWASP ZAP (session-fixation active scan rule)"
    remediation_ref: "fix-playbook://AUTHSESS-54"

  # ---- V7.3 Session Timeout ----
  - control_id: "AUTHSESS-55"
    name: "Inactivity timeout enforces re-authentication"
    description: "An inactivity timeout must be implemented that enforces re-authentication according to documented risk analysis."
    source_clause: "ASVS 5.0.0 V7.3.1"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: session configuration with no inactivity/idle timeout set, or an unbounded session lifetime)"
    remediation_ref: "fix-playbook://AUTHSESS-55"

  - control_id: "AUTHSESS-56"
    name: "Absolute maximum session lifetime enforced"
    description: "An absolute maximum session lifetime must be implemented that enforces re-authentication regardless of ongoing activity, per documented risk analysis."
    source_clause: "ASVS 5.0.0 V7.3.2"
    severity: "medium"
    check_method: "static"
    detector: "Semgrep (rule: session configuration with no absolute expiration set)"
    remediation_ref: "fix-playbook://AUTHSESS-56"

  # ---- V7.4 Session Termination ----
  - control_id: "AUTHSESS-57"
    name: "Terminated sessions cannot be reused"
    description: "Once a session is terminated (logout or expiry), it must be impossible to use it further — invalidated server-side for reference/stateful tokens, or handled via a revocation list/date cutoff/key rotation for self-contained tokens."
    source_clause: "ASVS 5.0.0 V7.4.1"
    severity: "high"
    check_method: "dynamic"
    detector: "OWASP ZAP (post-logout session-reuse active scan test)"
    remediation_ref: "fix-playbook://AUTHSESS-57"

  - control_id: "AUTHSESS-58"
    name: "All sessions terminated when an account is disabled or deleted"
    description: "Disabling or deleting a user account must terminate all of that account's active sessions."
    source_clause: "ASVS 5.0.0 V7.4.2"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: account-disable/delete handler with no corresponding call to a session-revocation function)"
    remediation_ref: "fix-playbook://AUTHSESS-58"

  - control_id: "AUTHSESS-59"
    name: "Option to terminate other sessions after credential change"
    description: "After a successful change or removal of an authentication factor (password reset/recovery, MFA update), the app must offer to terminate all other active sessions."
    source_clause: "ASVS 5.0.0 V7.4.3"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only (feature-presence check)"
    remediation_ref: "fix-playbook://AUTHSESS-59"

  - control_id: "AUTHSESS-60"
    name: "Logout easily accessible on every authenticated page"
    description: "Every page requiring authentication must provide easy, visible access to logout functionality."
    source_clause: "ASVS 5.0.0 V7.4.4"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only (UI/UX check)"
    remediation_ref: "fix-playbook://AUTHSESS-60"

  - control_id: "AUTHSESS-61"
    name: "Administrators can terminate sessions per-user or globally"
    description: "Application administrators must be able to terminate active sessions for an individual user or for all users."
    source_clause: "ASVS 5.0.0 V7.4.5"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only (feature-presence check)"
    remediation_ref: "fix-playbook://AUTHSESS-61"

  # ---- V7.5 Defenses Against Session Abuse ----
  - control_id: "AUTHSESS-62"
    name: "Full re-authentication required before sensitive account-attribute changes"
    description: "Modifying attributes that affect authentication (email, phone, MFA config, other recovery info) must require full re-authentication, not just an active session."
    source_clause: "ASVS 5.0.0 V7.5.1"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only (requires tracing the account-modification code path — closely related to AUTHSESS-08 in the backend-api domain)"
    remediation_ref: "fix-playbook://AUTHSESS-62"

  - control_id: "AUTHSESS-63"
    name: "Users can view and terminate their own active sessions"
    description: "Users must be able to view all their currently active sessions and terminate any or all of them after re-authenticating with at least one factor."
    source_clause: "ASVS 5.0.0 V7.5.2"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only (feature-presence check)"
    remediation_ref: "fix-playbook://AUTHSESS-63"

  - control_id: "AUTHSESS-64"
    name: "Secondary verification required before highly sensitive operations"
    description: "Highly sensitive transactions or operations must require further authentication (at least one factor) or secondary verification beyond an active session."
    source_clause: "ASVS 5.0.0 V7.5.3"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-64"

  # ---- V7.6 Federated Re-authentication ----
  - control_id: "AUTHSESS-65"
    name: "Federated session lifetime/termination matches documented behavior"
    description: "Session lifetime and termination between Relying Parties and Identity Providers must behave as documented, requiring re-authentication as needed (e.g. when max time between IdP auth events is exceeded)."
    source_clause: "ASVS 5.0.0 V7.6.1"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-65"

  - control_id: "AUTHSESS-66"
    name: "Session creation requires user consent or explicit action"
    description: "Creating a new application session must require the user's consent or an explicit action; sessions must not be created silently without user interaction."
    source_clause: "ASVS 5.0.0 V7.6.2"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://AUTHSESS-66"

