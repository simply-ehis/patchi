domain_id: "express-web"
version: "1.0.0"
display_name: "Express.js Web Hardening"
source_standard: "OWASP Express.js Security Cheat Sheet + Express.js Production Best Practices"
component_type: "backend-api"
cross_cutting: false
weight: 0.82

activation_signals:
  required_any:
    - signal: "import_pattern:express"
    - signal: "import_pattern:app.use("
    - signal: "import_pattern:app.get("
    - signal: "import_pattern:app.post("
    - signal: "import_pattern:router.get("
    - signal: "deps:express,@expressjs/*"
  excluded_if:
    - signal: "express_import_only_in_test_mocks"

controls:
  - control_id: "EXP-001"
    name: "CSRF protection missing for cookie-authenticated routes"
    description: "Detect Express applications that read session cookies (cookie-parser + express-session or similar) but do not mount the csurf middleware (or csrf-csrf, or a custom Origin-check middleware) for state-changing routes (POST/PUT/PATCH/DELETE). Cookie-authenticated endpoints are vulnerable to cross-site form POST CSRF: an attacker page can submit a form to /api/delete-account and the browser will include the user's session cookie. The check should flag any app.post / app.put / app.patch / app.delete that comes after cookie-parser is mounted but before csurf is mounted. Note: csurf is deprecated since 2020 but still widely used; the modern replacement is csrf-csrf (double-submit cookie pattern). Bearer-token-authenticated APIs (Authorization header, no cookies) are NOT vulnerable to CSRF."
    source_clause: "CWE-352"
    severity: "high"
    check_method: "static"
    detector: "semgrep:javascript.express-csrf-missing + semgrep:javascript.express-cookie-parser-without-csurf"
    remediation_ref: "fix-playbook://EXP-001"

  - control_id: "EXP-002"
    name: "Security headers missing (helmet not mounted)"
    description: "Detect Express applications that do not mount the helmet middleware (or equivalent manual headers) to set security headers: X-Content-Type-Options: nosniff, X-Frame-Options: DENY or SAMEORIGIN (clickjacking), Strict-Transport-Security (HSTS), Content-Security-Policy, X-DNS-Prefetch-Control, Referrer-Policy, X-Permitted-Cross-Domain-Policies. Without these headers, the app is vulnerable to MIME-type sniffing attacks (IE/Edge executing JSON as HTML), clickjacking (embedding the app in an iframe), and protocol downgrade attacks. The check should flag app.listen() or module.exports = app without app.use(helmet()) appearing earlier in the file or in a co-required file."
    source_clause: "OWASP A05:2021 - Security Misconfiguration"
    severity: "medium"
    check_method: "static"
    detector: "semgrep:javascript.express-without-helmet + custom check for missing X-Content-Type-Options header in tests"
    remediation_ref: "fix-playbook://EXP-002"

  - control_id: "EXP-003"
    name: "Body parser DoS via unbounded payload size"
    description: "Detect express.json, express.urlencoded, express.raw, express.text, or body-parser usage without an explicit limit option, or with a limit set higher than 1MB for typical APIs. Without a limit, an attacker can POST a multi-gigabyte JSON payload that Express will attempt to parse, exhausting memory and CPU (JSON.parse on a 1GB string takes ~30s and 5GB+ RAM). The default limit for express.json is 100kb which is safe, but many tutorials override it to '10mb' or higher. Flag any parser with limit > 1mb unless the route is specifically for file uploads (which should use multipart/form-data with multer, not JSON). Also flag express.urlencoded with extended=true and no limit (qs library can be slow on deeply nested objects)."
    source_clause: "CWE-400 + CWE-770"
    severity: "high"
    check_method: "static"
    detector: "semgrep:javascript.express-body-parser-without-limit + semgrep:javascript.express-json-large-limit"
    remediation_ref: "fix-playbook://EXP-003"

  - control_id: "EXP-004"
    name: "CORS wildcard with credentials"
    description: "Detect cors middleware configured with origin: '*' (or origin: true) combined with credentials: true. The CORS spec forbids this combination - browsers reject Access-Control-Allow-Origin: * when Access-Control-Allow-Credentials: true is set, so the request fails. To work around it, some code reflects the request Origin header back (origin: (origin) => origin) which is functionally equivalent to '*' but evades the spec check, allowing any site to make authenticated cross-origin requests. This is a critical CSRF-adjacent vuln: any malicious site can read the response of authenticated cross-origin requests. The fix is to set origin to an allow-list of trusted domains and credentials: true only for those."
    source_clause: "CWE-942 + OWASP A05:2021"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:javascript.express-cors-wildcard-with-credentials + semgrep:javascript.express-cors-reflect-origin-with-credentials"
    remediation_ref: "fix-playbook://EXP-004"

  - control_id: "EXP-005"
    name: "Insecure session cookies missing Secure / HttpOnly / SameSite"
    description: "Detect express-session, cookie-session, cookie-parser, or res.cookie() calls that do not set secure: true (cookie only sent over HTTPS), httpOnly: true (cookie not accessible via document.cookie), and sameSite: 'lax' or 'strict' (CSRF mitigation). Flag: express-session with no cookie.secure option (defaults to false), res.cookie('session', value) with no options object, cookie-session with no secure flag, and sameSite: 'none' without secure: true (browsers reject it). In production behind a TLS-terminating proxy, also set cookie.secure = true and trust proxy so X-Forwarded-Proto is honored. The default express-session cookie is not HttpOnly and not Secure - both must be set explicitly."
    source_clause: "CWE-614 + CWE-1004"
    severity: "high"
    check_method: "static"
    detector: "semgrep:javascript.express-session-insecure-cookie + semgrep:javascript.express-res-cookie-insecure"
    remediation_ref: "fix-playbook://EXP-005"

  - control_id: "EXP-006"
    name: "Template injection via render with user input"
    description: "Detect res.render, app.render, or template engine calls (ejs.render, pug.render, nunjucks.renderString, handlebars.compile) where the template string or a partial template path is derived from user input. Server-Side Template Injection (SSTI) allows RCE in most template engines: EJS via <%- code %>, Pug via #{code} with unescaped output, Nunjucks via {{ code }} with autoescape off, Handlebars via vulnerable helpers. The most common pattern is res.render(req.params.template) or ejs.render(req.body.html). Also flag res.render with a layout option derived from user input (layout injection). The fix is to use a static template name and pass user input as data, never as the template itself."
    source_clause: "CWE-94 + CWE-1336"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:javascript.express-render-user-template + semgrep:javascript.ejs-render-user-input + semgrep:javascript.pug-render-user-input"
    remediation_ref: "fix-playbook://EXP-006"

  - control_id: "EXP-007"
    name: "Error stack traces leaked to client"
    description: "Detect Express error handlers (app.use((err, req, res, next) => ...)) that send err.stack, err.message, or the raw err object to the client in production. The default Express error handler in development mode sends a full stack trace; in production (NODE_ENV=production) it sends a minimal response, but custom error handlers often re-introduce the leak by doing res.status(500).json({ error: err.message, stack: err.stack }). Stack traces reveal internal file paths, library versions, and sometimes secrets in error messages (e.g. database connection strings in Sequelize errors). The fix is to log the full error server-side and send only a generic message + correlation ID to the client."
    source_clause: "CWE-209"
    severity: "medium"
    check_method: "static"
    detector: "semgrep:javascript.express-error-handler-leak-stack + semgrep:javascript.express-res-json-error-with-stack"
    remediation_ref: "fix-playbook://EXP-007"
