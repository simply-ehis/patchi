domain_id: "configuration-hardening"
version: "1.0.0"
display_name: "Configuration Hardening and Secret Management"
source_standard: "OWASP Application Security Verification Standard (ASVS) 5.0.0, Chapter V13: Configuration (fetched and verified directly from the official ASVS 5.0.0 markdown source, github.com/OWASP/ASVS, July 2026)."
component_type: "backend-api"
cross_cutting: true
weight: 0.9

# NOTE ON SCOPE: V13.3 (Secret Management) overlaps conceptually with the extended
# taxonomy's proposed 'secrets-runtime-management' domain and with general-cryptography's
# key-management controls (V11.1.1/V11.1.2). The distinction: general-cryptography covers
# what algorithms/keys ARE and how they're chosen; V13.3 here covers WHERE secrets live
# operationally (vault vs. source code) and access-control around them. If a
# 'secrets-runtime-management' domain is built later specifically for Vault/Secrets-
# Manager integration patterns, treat V13.3's controls here as the baseline requirement
# and that domain as deeper implementation-specific guidance layered on top — don't
# duplicate scoring.

activation_signals:
  required_any:
    - signal: "has_backend_service_dependencies"   # any external DB/API/service the app talks to
    - signal: "has_deployable_web_server_config"    # nginx/Apache/app-server config present
    - signal: "has_secrets_or_credentials_usage"     # API keys, DB passwords, tokens anywhere in config
  excluded_if:
    - signal: "no_deployment_configuration_surface"  # a pure library/package with no deployable service of its own

controls:
  - control_id: "CONFIG-01"
    name: "Document all external communication needs"
    description: "All communication needs for the application must be documented, including external services the application relies upon and cases where an end user might supply an external location the application will then connect to (relevant to SSRF risk)."
    source_clause: "ASVS 5.0.0, V13.1.1"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only — documentation requirement"
    remediation_ref: "fix-playbook://CONFIG-01"

  - control_id: "CONFIG-02"
    name: "Document per-service connection limits and reached-limit behavior"
    description: "For each service the application uses, documentation must define the maximum number of concurrent connections and how the application behaves when that limit is reached, including fallback/recovery, to prevent denial-of-service conditions."
    source_clause: "ASVS 5.0.0, V13.1.2"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — documentation requirement"
    remediation_ref: "fix-playbook://CONFIG-02"

  - control_id: "CONFIG-03"
    name: "Document resource-management strategy per external system"
    description: "Documentation must define resource-management strategies for every external system/service used, including release procedures, timeouts, failure handling, and retry limits/delays/backoff; synchronous HTTP request-response operations should mandate short timeouts with disabled or strictly-limited retries to prevent cascading delays and resource exhaustion."
    source_clause: "ASVS 5.0.0, V13.1.3"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — documentation requirement"
    remediation_ref: "fix-playbook://CONFIG-03"

  - control_id: "CONFIG-04"
    name: "Document a secret-rotation schedule"
    description: "Documentation must define which secrets are critical to the application's security and a rotation schedule for them, based on the organization's threat model and business requirements."
    source_clause: "ASVS 5.0.0, V13.1.4"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — documentation requirement"
    remediation_ref: "fix-playbook://CONFIG-04"

  - control_id: "CONFIG-05"
    name: "Authenticate backend-to-backend communication with non-static credentials"
    description: "Communications between backend application components that don't use the app's standard user-session mechanism (APIs, middleware, data layers) must be authenticated using individual service accounts, short-term tokens, or certificate-based authentication — not unchanging credentials such as static passwords, API keys, or shared privileged accounts."
    source_clause: "ASVS 5.0.0, V13.2.1"
    severity: "high"
    check_method: "static"
    detector: "Static config/connection-string scan flagging backend service connections authenticated with a long-lived static password/API key rather than a short-lived token or certificate-based mechanism"
    remediation_ref: "fix-playbook://CONFIG-05"

  - control_id: "CONFIG-06"
    name: "Enforce least-privilege accounts for backend component communication"
    description: "Communications between backend application components, including local/OS services, APIs, middleware, and data layers, must be performed with accounts assigned the least privileges necessary."
    source_clause: "ASVS 5.0.0, V13.2.2"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only, though a static check can flag database/service accounts configured with broad/admin-level privileges as a candidate for review"
    remediation_ref: "fix-playbook://CONFIG-06"

  - control_id: "CONFIG-07"
    name: "Never use default credentials for service authentication"
    description: "If a credential is used for service authentication, it must not be a default credential (e.g. root/root, admin/admin)."
    source_clause: "ASVS 5.0.0, V13.2.3"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep rule / secrets-scan flagging known default-credential patterns in configuration files or connection strings"
    remediation_ref: "fix-playbook://CONFIG-07"

  - control_id: "CONFIG-08"
    name: "Allowlist permitted external destinations for outbound communication"
    description: "An allowlist must define the external resources/systems the application is permitted to communicate with (outbound requests, data loads, file access), implementable at the application layer, web server, firewall, or a combination."
    source_clause: "ASVS 5.0.0, V13.2.4"
    severity: "high"
    check_method: "static"
    detector: "CodeQL/Semgrep dataflow rule flagging outbound request/file-access code paths (especially where the destination is influenced by user input — SSRF risk) with no allowlist check against permitted destinations"
    remediation_ref: "fix-playbook://CONFIG-08"

  - control_id: "CONFIG-09"
    name: "Configure the web/app server with its own outbound allowlist"
    description: "The web or application server itself must be configured with an allowlist of resources/systems it can send requests to or load data/files from, as a defense-in-depth layer alongside application-level allowlisting."
    source_clause: "ASVS 5.0.0, V13.2.5"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only, supplemented by static config review of server-level egress rules"
    remediation_ref: "fix-playbook://CONFIG-09"

  - control_id: "CONFIG-10"
    name: "Follow documented per-connection configuration for external services"
    description: "Where the application connects to separate services, it must follow the documented configuration for each connection — maximum parallel connections, behavior at the connection limit, timeouts, and retry strategies."
    source_clause: "ASVS 5.0.0, V13.2.6"
    severity: "low"
    check_method: "manual-review"
    detector: "manual-review only — cross-referencing actual connection-pool/timeout configuration against documented values"
    remediation_ref: "fix-playbook://CONFIG-10"

  - control_id: "CONFIG-11"
    name: "Use a secrets management solution; never commit secrets to source or build artifacts"
    description: "A secrets management solution (key vault) must securely create, store, control access to, and destroy backend secrets. Secrets must never be included in application source code or build artifacts. L3 applications must use a hardware-backed solution (HSM)."
    source_clause: "ASVS 5.0.0, V13.3.1"
    severity: "critical"
    check_method: "static"
    detector: "Gitleaks/TruffleHog secrets-scan across source code and build artifact contents, flagging any hardcoded credential/API key/secret; also flags absence of any vault/secrets-manager integration where secrets usage is otherwise detected"
    remediation_ref: "fix-playbook://CONFIG-11"

  - control_id: "CONFIG-12"
    name: "Enforce least-privilege access to secret assets"
    description: "Access to secret assets stored in the vault/secrets manager must adhere to the principle of least privilege."
    source_clause: "ASVS 5.0.0, V13.3.2"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only, supplemented by static review of secrets-manager access-policy configuration"
    remediation_ref: "fix-playbook://CONFIG-12"

  - control_id: "CONFIG-13"
    name: "Perform cryptographic operations within an isolated security module"
    description: "All cryptographic operations must be performed using an isolated security module (a vault or hardware security module) to securely manage and protect key material from exposure outside that module."
    source_clause: "ASVS 5.0.0, V13.3.3"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only — an L3 requirement concerning infrastructure architecture rather than a single code pattern"
    remediation_ref: "fix-playbook://CONFIG-13"

  - control_id: "CONFIG-14"
    name: "Configure secrets to expire and rotate per documentation"
    description: "Secrets must be configured to expire and be rotated based on the application's documentation."
    source_clause: "ASVS 5.0.0, V13.3.4"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only — cross-referencing actual secrets-manager expiry/rotation configuration against the documented schedule"
    remediation_ref: "fix-playbook://CONFIG-14"

  - control_id: "CONFIG-15"
    name: "Exclude source-control metadata from deployed artifacts"
    description: "The application must be deployed either without any source-control metadata (.git, .svn folders) or in a way that these folders are inaccessible both externally and to the application itself."
    source_clause: "ASVS 5.0.0, V13.4.1"
    severity: "high"
    check_method: "static"
    detector: "Static deployment-artifact scan confirming no .git/.svn directory is present in the deployed build, or a web-server config check confirming these paths return 403/404 if present"
    remediation_ref: "fix-playbook://CONFIG-15"

  - control_id: "CONFIG-16"
    name: "Disable debug modes in production"
    description: "Debug modes must be disabled for all components in production environments to prevent exposure of debugging features and information leakage."
    source_clause: "ASVS 5.0.0, V13.4.2"
    severity: "critical"
    check_method: "static"
    detector: "Static config scan flagging DEBUG=True (Django), or equivalent framework-specific debug-mode flags left enabled in production configuration"
    remediation_ref: "fix-playbook://CONFIG-16"

  - control_id: "CONFIG-17"
    name: "Disable directory listing on web servers"
    description: "Web servers must not expose directory listings to clients unless explicitly intended."
    source_clause: "ASVS 5.0.0, V13.4.3"
    severity: "medium"
    check_method: "static"
    detector: "Static web-server config scan confirming autoindex/directory-listing is disabled"
    remediation_ref: "fix-playbook://CONFIG-17"

  - control_id: "CONFIG-18"
    name: "Disable the HTTP TRACE method in production"
    description: "Use of the HTTP TRACE method must not be supported in production environments, to avoid potential information leakage."
    source_clause: "ASVS 5.0.0, V13.4.4"
    severity: "medium"
    check_method: "static"
    detector: "Static web-server config scan confirming TRACE method is disabled; also checkable dynamically by sending a TRACE request to the live endpoint"
    remediation_ref: "fix-playbook://CONFIG-18"

  - control_id: "CONFIG-19"
    name: "Restrict exposure of internal documentation and monitoring endpoints"
    description: "Documentation (such as for internal APIs) and monitoring endpoints must not be exposed unless explicitly intended."
    source_clause: "ASVS 5.0.0, V13.4.5"
    severity: "high"
    check_method: "static"
    detector: "Static route-enumeration scan cross-referenced with the app's public-facing route documentation, flagging internal API-docs or actuator/health/metrics endpoints reachable without authentication"
    remediation_ref: "fix-playbook://CONFIG-19"

  - control_id: "CONFIG-20"
    name: "Do not expose detailed backend component version information"
    description: "The application must not expose detailed version information of backend components in response headers or error pages."
    source_clause: "ASVS 5.0.0, V13.4.6"
    severity: "low"
    check_method: "static"
    detector: "Dynamic check inspecting response headers and error pages for detailed version strings; static config check for server-signature-hiding settings"
    remediation_ref: "fix-playbook://CONFIG-20"

  - control_id: "CONFIG-21"
    name: "Restrict the web tier to serving only intended file extensions"
    description: "The web tier must be configured to only serve files with specific, intended file extensions, to prevent unintentional information, configuration, and source code leakage."
    source_clause: "ASVS 5.0.0, V13.4.7"
    severity: "high"
    check_method: "static"
    detector: "Static web-server config scan confirming an extension allowlist (or explicit denylist of source/config/backup extensions) is configured for static file serving"
    remediation_ref: "fix-playbook://CONFIG-21"

deprecated_by: null
