# ============================================================================
# Patchi Security Domain: supply-chain-local-tool
# ============================================================================
# SOURCE VERIFICATION NOTE:
#   Source standard: SLSA (Supply-chain Levels for Software Artifacts) v1.2,
#   the current Approved specification maintained by OpenSSF/Linux
#   Foundation — confirmed via slsa.dev, superseding v1.1 (2025) and v1.0
#   (April 2023). SLSA has two relevant tracks for this domain: the Build
#   track (levels 0-3, focused on build provenance and isolation) and the
#   Source track (levels 1-4, focused on version control and change
#   history integrity). Confidence: HIGH — every control below is drawn
#   directly from the official requirement tables at
#   https://slsa.dev/spec/v1.2/build-requirements and
#   https://slsa.dev/spec/v1.2/source-requirements, fetched directly, not
#   recalled from memory. Descriptions are reworded, not verbatim.
#
#   ADAPTATION NOTE: SLSA is written primarily for hosted services/package
#   ecosystems. This domain adapts it for a locally-installed CLI tool per
#   the original brief: the CLI's own release pipeline is the "build
#   platform" being evaluated (Build track), the CLI's own source
#   repository is the "Source Control System" being evaluated (Source
#   track), and — because a CLI tool is installed and then runs with the
#   user's own privileges on their machine, unlike a hosted service the
#   user never touches directly — extra weight is given to
#   installation-time integrity: what a user's machine actually verifies
#   before trusting a downloaded binary, install script, or dependency.
#   This last category isn't a distinct SLSA track; it's SLSA's consumer-
#   side verification obligations (from Verifying Artifacts) applied
#   specifically to the moment a human runs `npm install -g`, `pip install`,
#   `curl | bash`, or a self-update check.
#
#   THIS DOMAIN EXTENDS AN EXISTING 3-CONTROL STUB (SUPPLY-01 through
#   SUPPLY-03: dependency pinning, postinstall script audit, release
#   provenance) rather than replacing it. Those three are preserved below
#   with their original control_ids and re-mapped to precise SLSA source
#   clauses now that fuller research has been done.
#
#   SEVERITY NOTE: same convention as the other non-tabulated-severity
#   domains — SLSA does not publish per-requirement severity, so ratings
#   below are Patchi's judgment, calibrated by exploit outcome: gaps that
#   let an attacker inject code into the build or a user's install
#   (unforgeable provenance, isolated builds, install-time signature
#   verification, dependency pinning) are critical/high; gaps that weaken
#   evidence/governance without being the direct injection vector
#   (SBOM publication, VSA distribution) are medium.
# ============================================================================

domain_id: "supply-chain-local-tool"
version: "1.1.0"
display_name: "Supply Chain Security for Locally-Installed CLI Tools"
source_standard: "SLSA v1.2 (Build track + Source track), adapted for locally-installed CLI tools"
component_type: "cli"
weight: 0.8

activation_signals:
  required_any:
    - signal: "cli_entrypoint_declared (package.json 'bin' field, Python pyproject.toml [project.scripts]/setup.py console_scripts entry_points, Cargo.toml [[bin]], or a Go main package building a standalone executable)"
    - signal: "release_pipeline_present (a .github/workflows/*release*.yml, goreleaser.yml, or equivalent CI job that builds and publishes a distributable artifact)"
    - signal: "install_script_present (a top-level install.sh, install.ps1, or a README instructing curl ... | sh / iwr ... | iex)"
  excluded_if:
    - signal: "no_cli_entrypoint_no_release_pipeline_no_install_script (none of the required_any signals fired; likely a library or hosted service, not a locally-installed tool)"

controls:
  # ==== Preserved from original stub, re-mapped to precise SLSA clauses ====
  - control_id: "SUPPLY-01"
    name: "Dependency versions pinned via an enforced lockfile"
    description: "All dependencies must be pinned to specific, known-good versions via the ecosystem's lockfile (package-lock.json, Cargo.lock, poetry.lock, go.sum), and the CI/release pipeline must use a lockfile-respecting install command so a floating/unpinned resolution can never silently substitute a different version."
    source_clause: "SLSA v1.2 does not itself specify dependency-pinning mechanics (the Dependencies track is not yet published); this control operationalizes the Build track's 'Follow a consistent build process' producer requirement for a CLI tool's own dependency resolution, and reflects the broader supply-chain consensus (also reflected in OWASP CICD-SEC-3) that unpinned dependencies undermine build reproducibility"
    severity: "critical"
    check_method: "static"
    detector: "OSV-Scanner (checks lockfile presence/currency); Semgrep (rule: a CI install step using a non-lockfile-respecting command, e.g. npm install instead of npm ci, when a lockfile exists in the repo)"
    remediation_ref: "fix-playbook://SUPPLY-01"

  - control_id: "SUPPLY-02"
    name: "Install-time (postinstall/preinstall) scripts audited"
    description: "Any postinstall/preinstall/build script that runs automatically when the CLI tool or one of its dependencies is installed must be reviewed, since these scripts execute arbitrary code on the installing user's machine with no separate confirmation step."
    source_clause: "SLSA v1.2 Build track, 'Follow a consistent build process' (producer requirement); directly relevant given SLSA's own threat model explicitly names build-script tampering as a supply-chain attack vector"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep / manual-review (rule: a package.json scripts.postinstall/preinstall entry, or an equivalent setup.py/Cargo build.rs, that downloads and executes remote code or performs unexpected network calls)"
    remediation_ref: "fix-playbook://SUPPLY-02"

  - control_id: "SUPPLY-03"
    name: "Build provenance generated and published for every release"
    description: "The release pipeline must generate SLSA-format (or equivalent) provenance for every published artifact, unambiguously identifying the output by cryptographic digest and describing how it was built, and this provenance must be distributed alongside the artifact so consumers can retrieve it."
    source_clause: "SLSA v1.2 Build track, Provenance Generation: 'Provenance Exists' (Build L1 requirement)"
    severity: "high"
    check_method: "static"
    detector: "manual-review / slsa-github-generator or equivalent reusable workflow (checking whether the release pipeline invokes a provenance-generating build action)"
    remediation_ref: "fix-playbook://SUPPLY-03"

  # ==== Build track: provenance authenticity and integrity ====
  - control_id: "SUPPLY-04"
    name: "Release provenance cryptographically signed (authentic)"
    description: "Provenance attestations must be digitally signed by a key accessible only to the build platform component that generated them, so consumers can verify the provenance wasn't tampered with after the build and can identify which build platform they're trusting."
    source_clause: "SLSA v1.2 Build track, Provenance Generation: 'Provenance is Authentic' (Build L2 requirement)"
    severity: "high"
    check_method: "static"
    detector: "manual-review / cosign (checking whether release artifacts have a corresponding signed .sigstore bundle or in-toto attestation published alongside them)"
    remediation_ref: "fix-playbook://SUPPLY-04"

  - control_id: "SUPPLY-05"
    name: "Provenance generated by a trusted control plane, not user-controlled build steps (unforgeable)"
    description: "Every field in the provenance (other than a narrow, documented set of exceptions) must be generated or verified by the build platform's trusted control plane; user-controlled build steps must not be able to inject or alter provenance contents, and any signing key must be inaccessible to the environment running those build steps."
    source_clause: "SLSA v1.2 Build track, Provenance Generation: 'Provenance is Unforgeable' (Build L3 requirement)"
    severity: "critical"
    check_method: "manual-review"
    detector: "manual-review only (requires assessing the release pipeline's architecture: whether the signing key is ever exposed to the same job/container that runs untrusted build/test steps)"
    remediation_ref: "fix-playbook://SUPPLY-05"

  - control_id: "SUPPLY-06"
    name: "Releases built on a hosted build platform, not a maintainer's personal workstation"
    description: "All build steps producing a released artifact must run on hosted infrastructure (a CI service like GitHub Actions), not on an individual maintainer's own machine, so the build isn't dependent on that individual's endpoint security."
    source_clause: "SLSA v1.2 Build track, Isolation Strength: 'Hosted' (Build L2 requirement)"
    severity: "high"
    check_method: "static"
    detector: "manual-review / Semgrep (rule: a release/publish script intended to be run manually from a local machine — e.g. an npm publish or cargo publish command in a README's 'how to release' section — with no corresponding CI-triggered release workflow)"
    remediation_ref: "fix-playbook://SUPPLY-06"

  - control_id: "SUPPLY-07"
    name: "Build environment isolated and ephemeral between releases"
    description: "The build platform must ensure build steps run in an isolated, ephemeral environment free of unintended external influence: no access to build-platform secrets from within the build, no ability for concurrent or prior builds to influence the current one, and no build-cache poisoning across builds."
    source_clause: "SLSA v1.2 Build track, Isolation Strength: 'Isolated' (Build L3 requirement)"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only (requires assessing the CI provider's runner isolation model and whether the release job uses a fresh, single-use runner)"
    remediation_ref: "fix-playbook://SUPPLY-07"

  # ==== Consumer-side / installation-time integrity (SLSA's Verifying Artifacts applied to a local install) ====
  - control_id: "SUPPLY-08"
    name: "Published artifacts signed, with signatures verifiable at install time"
    description: "Released binaries/packages should be signed (via Sigstore/cosign, GPG, or the package ecosystem's native signing mechanism) so that a user or their package manager can verify the artifact's authenticity before installing it, rather than trusting an unauthenticated download."
    source_clause: "SLSA v1.2 Build track, 'Distribute provenance' (producer requirement) combined with Verifying Artifacts guidance for consumers"
    severity: "critical"
    check_method: "static"
    detector: "manual-review / cosign verify (checking the release process for a signing step and confirming signature-verification instructions are published for end users)"
    remediation_ref: "fix-playbook://SUPPLY-08"

  - control_id: "SUPPLY-09"
    name: "Shell-pipe install scripts (curl | bash) avoided, or checksummed and served over an integrity-protected channel"
    description: "If the project offers a one-line 'curl ... | sh' style install method, the downloaded script must be served exclusively over HTTPS from a domain the project controls, and the project should also publish a safer alternative (a versioned, checksummed download, or a package-manager-native install) since pipe-to-shell installs execute unreviewed remote content with no built-in integrity check."
    source_clause: "SLSA v1.2's general threat model (build/distribution tampering) applied to the specific case of a CLI tool's install script, which is functionally a build/distribution artifact even though it isn't compiled"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep / manual-review (rule: README or documentation containing a curl ... | sh or iwr ... | iex pattern with no accompanying checksum verification step or safer alternative)"
    remediation_ref: "fix-playbook://SUPPLY-09"

  - control_id: "SUPPLY-10"
    name: "Self-update mechanism verifies the new version's signature/checksum before applying it"
    description: "If the CLI tool has a self-update or auto-update feature, it must verify the downloaded update's signature or checksum against a value obtained from a trusted, independent channel before replacing the running binary, preventing a compromised update-distribution point from pushing malicious code."
    source_clause: "SLSA v1.2's Verifying Artifacts consumer guidance, applied to the CLI's own self-update flow acting as both a distributor and a consumer of its own releases"
    severity: "critical"
    check_method: "static"
    detector: "Semgrep (rule: a self-update code path that downloads and executes/replaces the binary with no signature or checksum verification step beforehand)"
    remediation_ref: "fix-playbook://SUPPLY-10"

  - control_id: "SUPPLY-11"
    name: "Third-party dependency integrity/hash verification enabled at install time"
    description: "The package manager used to install the CLI's own dependencies must have integrity/hash verification enabled (npm's package-lock.json integrity fields enforced via npm ci, pip's --require-hashes, cargo's Cargo.lock checksums), not bypassed."
    source_clause: "SLSA v1.2's general supply-chain integrity principles applied to the CLI's dependency-installation step, consistent with OWASP CICD-SEC-3's checksum/signature verification guidance"
    severity: "high"
    check_method: "static"
    detector: "Semgrep (rule: package-manager configuration or CI install command with hash/integrity verification explicitly disabled or bypassed)"
    remediation_ref: "fix-playbook://SUPPLY-11"

  - control_id: "SUPPLY-12"
    name: "Package name and publish scope defended against dependency confusion / typosquatting"
    description: "If the project is published under an organizational or scoped package name, common typosquatted variants should be reserved or monitored, and internal/private package names must never be reused as public package names without the scoping/namespace protection the registry offers."
    source_clause: "SLSA's general supply-chain threat model combined with the well-documented dependency-confusion attack class SLSA and OWASP CICD-SEC-3 both reference"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only (requires checking the registry for similarly-named packages and confirming the project's actual package name is properly scoped/namespaced)"
    remediation_ref: "fix-playbook://SUPPLY-12"

  # ==== Source track: the CLI project's own repository ====
  - control_id: "SUPPLY-13"
    name: "Source repository uses a version control system with immutable, uniquely identifiable revisions"
    description: "The CLI's source must be stored in a modern version control system where each revision is immutably and uniquely identified (e.g. by a Git commit SHA), forming the baseline for all higher source-track guarantees."
    source_clause: "SLSA v1.2 Source track, Level 1: Version controlled; Source Control System requirement 'Revisions are immutable and uniquely identifiable'"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only (trivially satisfied by any Git-hosted project, but worth confirming for projects using non-standard or partially-scripted release processes outside version control)"
    remediation_ref: "fix-playbook://SUPPLY-13"

  - control_id: "SUPPLY-14"
    name: "Force-push prohibited on branches used for releases"
    description: "The branch(es) from which releases are cut must be protected against force-push / history rewriting, so a branch can only ever be updated to a revision that descends from its current one, preserving a reliable change history."
    source_clause: "SLSA v1.2 Source track, Organization requirement 'Configure the SCS to control access and enforce history' (Source L2); Source Control System requirement 'History'"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only (requires checking the SCM platform's branch protection settings for 'allow force pushes' being disabled on release branches)"
    remediation_ref: "fix-playbook://SUPPLY-14"

  - control_id: "SUPPLY-15"
    name: "Release tags protected from being moved or deleted"
    description: "Tags marking releases must be protected so they cannot be moved to point at a different revision or deleted after creation, since a movable release tag would let an attacker retroactively swap what code a given version number refers to."
    source_clause: "SLSA v1.2 Source track, Organization requirement 'Configure the SCS to control access and enforce history' (Source L2, tag protection sub-requirement)"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only (requires checking the SCM platform's tag protection rules)"
    remediation_ref: "fix-playbook://SUPPLY-15"

  - control_id: "SUPPLY-16"
    name: "Release branches require passing status checks before merge (continuous technical controls)"
    description: "The organization must enforce technical controls — required CI checks, required reviews — continuously on the branches used for releases, with evidence of that enforcement being unbroken over time, not merely documented as a policy."
    source_clause: "SLSA v1.2 Source track, Organization requirement 'Continuous technical controls' (Source L3); Source Control System requirement 'Continuity'"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only (requires checking branch protection settings for required status checks and confirming they haven't been disabled/re-enabled in a way that breaks continuity)"
    remediation_ref: "fix-playbook://SUPPLY-16"

  - control_id: "SUPPLY-17"
    name: "Two-party review required for changes to release branches"
    description: "Changes to the branches used for releases should require approval from a trusted person other than the change's author before merging, making it harder for a single compromised or malicious account to introduce changes unilaterally."
    source_clause: "SLSA v1.2 Source track, Source Control System requirement 'Two-party review' (Source L4)"
    severity: "high"
    check_method: "manual-review"
    detector: "manual-review only (requires checking branch protection settings for 'require pull request reviews before merging' with at least one required approving review from someone other than the author)"
    remediation_ref: "fix-playbook://SUPPLY-17"

  - control_id: "SUPPLY-18"
    name: "Actor identity and authentication documented for the source control system"
    description: "The project must document how contributors and maintainers are identified and authenticated (e.g. GitHub account + org membership, or a more sophisticated scheme), and activity on the repository should be attributable to authenticated identities."
    source_clause: "SLSA v1.2 Source track, Source Control System requirement 'Identity Management'"
    severity: "medium"
    check_method: "manual-review"
    detector: "manual-review only"
    remediation_ref: "fix-playbook://SUPPLY-18"

  # ==== Software composition / vulnerability hygiene, tying back to the release pipeline ====
  - control_id: "SUPPLY-19"
    name: "Software Bill of Materials (SBOM) generated and published per release"
    description: "An SBOM listing all dependencies (direct and transitive) should be generated for each release and published alongside the release artifact, giving consumers visibility into what the CLI tool actually ships."
    source_clause: "SLSA v1.2's recommended attestation formats and future-directions guidance on composition transparency; also reflected in OWASP CICD-SEC-9's guidance on SBOMs for pipeline-produced artifacts"
    severity: "medium"
    check_method: "static"
    detector: "OWASP CycloneDX / Syft (SBOM generation tooling; checking whether the release pipeline includes an SBOM-generation step)"
    remediation_ref: "fix-playbook://SUPPLY-19"

  - control_id: "SUPPLY-20"
    name: "Known-vulnerability scanning of dependencies integrated into the release pipeline"
    description: "The release pipeline should run dependency vulnerability scanning before publishing, blocking or flagging releases that would ship a dependency with a known, unpatched vulnerability."
    source_clause: "Reflects SLSA's Security Best Practices guidance ('promptly fixing known vulnerabilities') applied specifically to the CLI's own release gate"
    severity: "high"
    check_method: "static"
    detector: "OSV-Scanner integrated as a CI gate on the release workflow"
    remediation_ref: "fix-playbook://SUPPLY-20"

  - control_id: "SUPPLY-21"
    name: "Package registry publish credentials protected with MFA and scoped tokens"
    description: "Credentials used to publish the CLI tool to a package registry (npm, PyPI, crates.io, etc.) must be protected with multi-factor authentication, and automated publishing from CI should use short-lived, scoped tokens (e.g. npm's trusted publishing / OIDC, PyPI's Trusted Publishers) rather than a long-lived personal access token."
    source_clause: "SLSA v1.2 Build track, Security Best Practices ('using proper access controls... implementing proper management of cryptographic secrets'), applied to the specific credential that would let an attacker publish a malicious version directly"
    severity: "critical"
    check_method: "manual-review"
    detector: "manual-review only (requires checking the registry account's MFA status and whether CI publishing uses OIDC/trusted-publishing instead of a stored long-lived token)"
    remediation_ref: "fix-playbook://SUPPLY-21"

