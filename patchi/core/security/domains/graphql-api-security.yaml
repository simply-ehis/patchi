domain_id: "graphql-api-security"
version: "1.0.0"
display_name: "GraphQL API Security"
source_standard: "OWASP Application Security Verification Standard (ASVS) 5.0.0, Chapter V4: API and Web Service, Section V4.3: GraphQL (fetched and verified directly from the official ASVS 5.0.0 CSV release, github.com/OWASP/ASVS, July 2026). Supplement with the OWASP GraphQL Cheat Sheet for broader coverage beyond these two ASVS-sourced controls if a more exhaustive GraphQL-specific control set is desired later."
component_type: "backend-api"
cross_cutting: false
weight: 0.7

# NOTE ON SCOPE: this is a small, focused domain — ASVS itself only dedicates 2 direct
# requirements to GraphQL specifically, since most GraphQL security concerns (injection,
# authorization, rate limiting) are actually general API concerns already covered by
# backend-api's broader controls. This domain exists to capture the two genuinely
# GraphQL-specific mechanics ASVS calls out, not to duplicate backend-api's general
# coverage. Only activate this domain if the app actually exposes a GraphQL endpoint.

activation_signals:
  required_any:
    - signal: "has_graphql_server_library"
    - signal: "has_graphql_schema_file"
  excluded_if:
    - signal: "no_graphql_endpoint"

controls:
  - control_id: "GRAPHQL-01"
    name: "Limit query depth/cost to prevent GraphQL DoS"
    description: "A query allowlist, depth limiting, amount limiting, or query cost analysis must be used to prevent GraphQL or data-layer expression denial-of-service resulting from expensive, deeply-nested queries."
    source_clause: "ASVS 5.0.0, V4.3.1"
    severity: "high"
    check_method: "static"
    detector: "Static config/code review confirming a query complexity/depth-limiting library or a persisted-query allowlist is configured on the GraphQL server"
    remediation_ref: "fix-playbook://GRAPHQL-01"

  - control_id: "GRAPHQL-02"
    name: "Disable GraphQL introspection in production unless intentionally public"
    description: "GraphQL introspection queries must be disabled in the production environment unless the GraphQL API is specifically meant to be used/discovered by other parties."
    source_clause: "ASVS 5.0.0, V4.3.2"
    severity: "medium"
    check_method: "static"
    detector: "Static GraphQL server config check confirming introspection is disabled in production, or a dynamic check sending an introspection query to the live production endpoint and confirming it's rejected"
    remediation_ref: "fix-playbook://GRAPHQL-02"

deprecated_by: null
last_reviewed: "2026-07-09"
