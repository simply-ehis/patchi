domain_id: "jvm-hardening"
version: "1.0.0"
display_name: "JVM Hardening (Java/Spring)"
source_standard: "OWASP Top 10 (2021) + CIS Java Application Benchmark v1.0.0"
component_type: "backend-api"
cross_cutting: false
weight: 0.9

activation_signals:
  required_any:
    - signal: "files_matching:*.java,*.kt,*.scala"
    - signal: "build_file:pom.xml,build.gradle,build.gradle.kts"
    - signal: "import_pattern:org.springframework.boot"
    - signal: "import_pattern:javax.servlet"
  excluded_if:
    - signal: "jvm_files_only_in_test_fixtures"

controls:
  - control_id: "JVM-001"
    name: "Insecure deserialization via ObjectInputStream"
    description: "Detect use of java.io.ObjectInputStream.readObject() on untrusted data. This is the canonical CWE-502 pattern exploited by ysoserial payloads against WebLogic, JBoss, and Jenkins. The check should flag any new ObjectInputStream() wrapped around user-controlled InputStreams (HTTP request body, JMS message, Redis value, file from upload). Also flag Spring @RequestBody on POJOs that contain Object-typed fields, and XStream, Jackson with default typing, and Fastjson pre-1.2.83 with autotype enabled. Prefer JSON, Protobuf, or explicit allow-listing of classes via ObjectInputFilter."
    source_clause: "CWE-502"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:java.insecure-deserialization + spotbugs:DESERIALIZATION_GADGET"
    remediation_ref: "fix-playbook://JVM-001"

  - control_id: "JVM-002"
    name: "Active debug code in production"
    description: "Detect debug-only code paths that may execute in production. Flag: (1) System.out.println() and e.printStackTrace() calls in non-test code, (2) Spring @Profile(\"dev\") or @ConditionalOnProperty beans that are accidentally activated, (3) JVM -agentlib:jdwp flags in Dockerfile ENTRYPOINT or shell scripts, (4) Spring DevTools dependency in compile scope (should be runtime + optional), (5)@EnableWebMvc debug=true or logging.level.root=DEBUG in application.yml not guarded by Spring profile."
    source_clause: "CWE-489"
    severity: "high"
    check_method: "static"
    detector: "semgrep:java.debug-code-in-production + custom check for application.yml debug flags"
    remediation_ref: "fix-playbook://JVM-002"

  - control_id: "JVM-003"
    name: "Environment information exposure via Actuator"
    description: "Detect Spring Boot Actuator endpoints exposed without authentication. By default Spring Boot 2.x+ exposes only /health, but misconfigurations frequently expose /env, /heapdump, /threaddump, /configprops, /mappings, /beans which leak secrets, classpath data, internal architecture, and can be used for RCE via /env + /restart. The check should flag management.endpoints.web.exposure.include=* in application.yml, management.security.enabled=false (Spring Boot 1.x), and missing spring.security user/password config when actuator is on classpath."
    source_clause: "CWE-526 + OWASP A05:2021"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:java.spring-actuator-wildcard-exposure + custom yaml key check"
    remediation_ref: "fix-playbook://JVM-003"

  - control_id: "JVM-004"
    name: "Verbose error pages leak stack traces"
    description: "Detect configurations that return stack traces, SQL errors, or Spring framework internals to clients. Flag Spring Boot server.error.include-stacktrace=always or =on-trace-param without an equivalent GlobalExceptionHandler @ControllerAdvice. Also flag servlet containers (Tomcat, Jetty) without custom error pages defined in web.xml or via ErrorPageRegistrar, and JSP files that dump <%= exception %> directly into the response body."
    source_clause: "CWE-209"
    severity: "medium"
    check_method: "static"
    detector: "semgrep:java.spring-stacktrace-exposure + semgrep:java.jsp-exception-dump"
    remediation_ref: "fix-playbook://JVM-004"

  - control_id: "JVM-005"
    name: "Reflection abuse with user-controlled input"
    description: "Detect use of java.lang.reflect with user-controlled class names or method names. Flag Class.forName(userInput), Method.invoke(obj, userInputArgs), and Spring BeanWrapperImpl on user-controlled property paths (CVE-2022-22965 Spring4Shell pattern). Also flag ScriptEngineManager().getEngineByName(\"nashorn\").eval(userInput) and javax.script invocations. The fix is to use an allow-list of permitted class/method names and reject any input not on the list."
    source_clause: "CWE-470"
    severity: "critical"
    check_method: "static"
    detector: "semgrep:java.reflection-on-user-input + semgrep:java.script-engine-eval"
    remediation_ref: "fix-playbook://JVM-005"

  - control_id: "JVM-006"
    name: "Runtime.exec / ProcessBuilder with user input"
    description: "Detect Runtime.getRuntime().exec() or ProcessBuilder().command() calls where any argument is derived from user input. This is CWE-78 OS command injection. Even when arguments are passed as an array (not a single shell string), argument injection may still be possible (e.g., --help or -exec flags passed to find/ffmpeg). The check should flag all Runtime.exec and ProcessBuilder patterns in non-test code and require a manual review to confirm the command and arguments are from a static allow-list."
    source_clause: "CWE-78"
    severity: "critical"
    check_method: "manual-review"
    detector: "manual-review of all Runtime.exec and ProcessBuilder call sites"
    remediation_ref: "fix-playbook://JVM-006"

  - control_id: "JVM-007"
    name: "Hardcoded credentials and secrets"
    description: "Detect hardcoded passwords, API keys, JWT secrets, AWS credentials, database connection strings, and private keys in Java/Kotlin/Scala source files. Flag string literals assigned to fields named password, secret, apiKey, token, accessKey, privateKey, jdbcUrl. Also flag JKS/PKCS12 keystore files committed to source control, and Spring @Value annotations that read from a hardcoded default rather than environment variable. Use the truffleHog-style entropy check on string literals above 16 chars in config-like classes."
    source_clause: "CWE-798"
    severity: "high"
    check_method: "static"
    detector: "semgrep:java.hardcoded-credentials + trufflehog entropy scan"
    remediation_ref: "fix-playbook://JVM-007"
