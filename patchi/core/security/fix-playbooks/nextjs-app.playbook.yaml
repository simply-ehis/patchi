playbooks:
- blast_radius_notes: Automated fix for NJS-NEXT-001
  control_id: NJS-NEXT-001
  deterministic_tool: null
  fix_strategy: llm-template
  human_review_required: false
  llm_fix_template: 'Fix Server Actions without rate limiting or reCAPTCHA: Detect
    Next.js 14+ Server Actions (''use server'' functions, or async functions exported
    from a page/layout with ''use server'' directive) that perform state-changing
    operations (write to DB, send email, charge payment) without rate limiting or
    bot protection. Server Actions are POST endpoints automatically created by Next.js
    at unpredictable URLs (/__nextjs_original-stack-frame, but the action ID is in
    the request body) - they are NOT protected by CSRF tokens by default (Next.js
    relies on Origin header check, similar to SvelteKit). An attacker can call a Server
    Action directly via fetch() without rendering the page. Flag any ''use server''
    function that does not call a rate-limiter (e.g. rate-limiter-flexible, upstash/ratelimit)
    or verify a reCAPTCHA token.'
  playbook_version: 1.0.0
  verification_checks:
  - Verify NJS-NEXT-001 is properly addressed
- blast_radius_notes: Automated fix for NJS-NEXT-002
  control_id: NJS-NEXT-002
  deterministic_tool: null
  fix_strategy: llm-template
  human_review_required: false
  llm_fix_template: 'Fix Sensitive data leaked via getServerSideProps / Server Component
    return: Detect Next.js pages with getServerSideProps (Pages Router) or Server
    Components (App Router, default in src/app/) that return objects containing sensitive
    fields to the client. In Next.js, anything returned from getServerSideProps is
    serialized as JSON and sent to the client as props (visible in __NEXT_DATA__ script
    tag in the HTML source). In App Router, anything returned from a Server Component
    is serialized as RSC payload (visible in the page source as encoded JSON). Flag:
    return { user } (spreads full DB record), return { session } (leaks session token),
    return { dbPassword, ...safeFields }. The fix is to destructure and return ONLY
    the fields the component renders: return { id: user.id, email: user.email }.'
  playbook_version: 1.0.0
  verification_checks:
  - Verify NJS-NEXT-002 is properly addressed
- blast_radius_notes: Automated fix for NJS-NEXT-003
  control_id: NJS-NEXT-003
  deterministic_tool: null
  fix_strategy: llm-template
  human_review_required: false
  llm_fix_template: 'Fix Middleware matcher bypass: Detect Next.js middleware (middleware.ts
    in root or src/) with a matcher config that does not cover all sensitive routes,
    allowing auth/CSRF checks in the middleware to be bypassed. Common bypass patterns:
    (1) matcher: [''/api/*''] but sensitive pages under /admin are not protected;
    (2) matcher using negative lookahead that an attacker can evade with URL encoding
    (/admin%2Fsecret bypasses /admin/(?!login)); (3) middleware that checks auth but
    the matcher excludes /_next/static which is correct, but also excludes /api/auth
    which lets attackers hit the callback directly. The check should flag any middleware
    whose matcher does not include all routes that the middleware''s auth check is
    meant to protect.'
  playbook_version: 1.0.0
  verification_checks:
  - Verify NJS-NEXT-003 is properly addressed
- blast_radius_notes: Automated fix for NJS-NEXT-004
  control_id: NJS-NEXT-004
  deterministic_tool: null
  fix_strategy: llm-template
  human_review_required: false
  llm_fix_template: 'Fix Image optimization SSRF: Detect Next.js Image Optimization
    (next/image with the default loader, or the /_next/image endpoint) configured
    to allow remote images from arbitrary domains, enabling Server-Side Request Forgery.
    By default, next.config.js remotePatterns is empty (safe). Misconfigurations include:
    remotePatterns: [{ hostname: ''**'' }] (allow any host), remotePatterns with protocol:
    ''http'' allowing internal-network SSRF, or a custom image loader that fetches
    arbitrary URLs. The /_next/image?url=...&w=...&q=... endpoint fetches the URL
    server-side, so an attacker can use it to scan internal services (http://169.254.169.254
    for AWS metadata, http://localhost:6379 for Redis, etc.). The fix is to enumerate
    allowed hosts explicitly and reject all others.'
  playbook_version: 1.0.0
  verification_checks:
  - Verify NJS-NEXT-004 is properly addressed
- blast_radius_notes: Automated fix for NJS-NEXT-005
  control_id: NJS-NEXT-005
  deterministic_tool: null
  fix_strategy: llm-template
  human_review_required: false
  llm_fix_template: 'Fix Server-only secret leaked via process.env in Client Component:
    Detect Client Components (files with ''use client'' directive, or components imported
    by a Client Component) that reference process.env.SECRET_NAME or process.env.DATABASE_URL,
    leaking server-only secrets into the client bundle. Next.js only exposes env vars
    prefixed with NEXT_PUBLIC_ to the client; referencing process.env.SECRET in a
    Client Component evaluates to undefined at runtime BUT Next.js''s bundler may
    inline the value at build time if the env var is set, leaking it. Flag any ''use
    client'' file that references process.env.<non-NEXT_PUBLIC_> or imports from a
    file that does. Also flag next.config.js env: { SECRET: process.env.SECRET } which
    exposes the var to the client unconditionally.'
  playbook_version: 1.0.0
  verification_checks:
  - Verify NJS-NEXT-005 is properly addressed
- blast_radius_notes: Automated fix for NJS-NEXT-006
  control_id: NJS-NEXT-006
  deterministic_tool: null
  fix_strategy: llm-template
  human_review_required: false
  llm_fix_template: 'Fix API route handler with weak input validation: Detect Next.js
    API Route Handlers (app/api/*/route.ts with GET/POST/etc. functions, or pages/api/*.ts
    with req/res) that read user input from req.body, req.query, req.headers, or searchParams
    without validation via Zod, Yup, Joi, or similar. The Next.js App Router searchParams
    and request.json() return untyped data - TypeScript types are assertions, not
    validations. Flag any route handler that does request.json() and uses the result
    without a schema.parse() call. Also flag handlers that use req.query.id as a number
    without Number.isFinite check (NaN propagation), and handlers that interpolate
    req.query into SQL or fs paths without sanitization.'
  playbook_version: 1.0.0
  verification_checks:
  - Verify NJS-NEXT-006 is properly addressed
- blast_radius_notes: Automated fix for NJS-NEXT-007
  control_id: NJS-NEXT-007
  deterministic_tool: null
  fix_strategy: llm-template
  human_review_required: false
  llm_fix_template: 'Fix Unsafe redirect in middleware or route handler: Detect Next.js
    middleware or route handlers that call NextResponse.redirect() or NextResponse.rewrite()
    with a URL derived from user input (searchParams.get(''next''), req.headers.get(''referer''),
    request.nextUrl.searchParams) without an allow-list. Open redirect in Next.js
    is exploitable for phishing (a legitimate-looking URL on your domain redirects
    to an attacker site) and, when combined with session cookies, for token leakage.
    The check should flag redirect(url.searchParams.get(''next'')), redirect(req.headers.get(''referer'')
    || ''/''), and any redirect to a URL constructed with new URL(userInput) without
    origin comparison. The fix is to validate the redirect target against an allow-list
    of paths, or confirm target.origin === request.nextUrl.origin.'
  playbook_version: 1.0.0
  verification_checks:
  - Verify NJS-NEXT-007 is properly addressed
