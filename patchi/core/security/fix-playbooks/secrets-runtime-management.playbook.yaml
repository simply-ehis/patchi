playbooks:
- blast_radius_notes: Failing to renew dynamic secrets before lease expiry causes authentication
    failures at runtime; implementing active renewal requires understanding lease lifetimes.
  control_id: SECRETS-01
  deterministic_tool: null
  fix_strategy: llm-template-fill
  human_review_required: true
  llm_fix_template: "\"Given code that reads dynamic secrets without active renewal:\n\
    \ implement a background renewal/re-fetch mechanism that refreshes secrets\n before\
    \ their lease expiry (e.g. at 75% of lease lifetime); handle\n renewal failures\
    \ gracefully with retry logic; preserve the\n application's access to secrets.\"\n"
  playbook_version: 1.0.0
  verification_checks:
  - Confirm secrets are renewed before lease expiry.
  - Confirm application handles renewal failures gracefully.
  - Confirm no authentication failures occur due to expired secrets.
- blast_radius_notes: Migrating high-sensitivity secrets from env vars to file-mounts
    requires updating application code to read from file paths instead of environment
    variables.
  control_id: SECRETS-02
  deterministic_tool: null
  fix_strategy: llm-template-fill
  human_review_required: true
  llm_fix_template: "\"Given high-sensitivity secrets passed via environment variables:\n\
    \ migrate to file-mounted secrets (Kubernetes Secret volumes or\n Vault sidecar\
    \ file injection) and update the application's config\n loading to read from file\
    \ paths; ensure file permissions restrict\n access; preserve the application's\
    \ access to the secrets.\"\n"
  playbook_version: 1.0.0
  verification_checks:
  - Confirm secrets are no longer passed via environment variables.
  - Confirm application correctly reads secrets from file mounts.
  - Confirm file permissions restrict access to the secret files.
- blast_radius_notes: Replacing static credentials with dynamic short-lived ones requires
    the application to handle credential rotation and renewal; may require code changes.
  control_id: SECRETS-03
  deterministic_tool: null
  fix_strategy: llm-template-fill
  human_review_required: true
  llm_fix_template: "\"Given static long-lived credentials for database or service\n\
    \ authentication: replace with dynamic short-lived credentials obtained\n from a\
    \ secrets management system (Vault, cloud IAM); implement\n automatic credential\
    \ renewal before expiry; preserve the\n application's authentication functionality.\"\n"
  playbook_version: 1.0.0
  verification_checks:
  - Confirm static credentials are replaced with dynamic ones.
  - Confirm credentials are automatically renewed before expiry.
  - Confirm application authentication still works with dynamic credentials.
- blast_radius_notes: Setting a short cache TTL reduces the window for stale credentials
    but increases secrets engine load; handling auth failure invalidation prevents
    serving revoked credentials.
  control_id: SECRETS-04
  deterministic_tool: 'set short cache TTL for cached secrets and implement auth failure
    cache invalidation'
  fix_strategy: deterministic-autofix
  human_review_required: false
  llm_fix_template: null
  playbook_version: 1.0.0
  verification_checks:
  - Confirm cached secrets expire after the configured TTL.
  - Confirm auth failures trigger immediate cache invalidation.
- blast_radius_notes: Disabling core dumps and encrypting swap prevents secrets from
    being written to disk; may affect debugging capabilities for non-secrets processes.
  control_id: SECRETS-05
  deterministic_tool: 'set RLIMIT_CORE=0 to disable core dumps and configure encrypted
    swap (LUKS/dm-crypt)'
  fix_strategy: deterministic-autofix
  human_review_required: false
  llm_fix_template: null
  playbook_version: 1.0.0
  verification_checks:
  - Confirm core dumps are disabled (RLIMIT_CORE=0).
  - Confirm swap is encrypted or disabled.
  - Confirm secrets are not written to disk in core dumps or swap.
- blast_radius_notes: Scoping sidecar auto-auth policy to specific secret paths requires
    understanding which secrets each workload needs; overly broad policies weaken security.
  control_id: SECRETS-06
  deterministic_tool: null
  fix_strategy: manual-only
  human_review_required: true
  llm_fix_template: null
  playbook_version: 1.0.0
  verification_checks:
  - A human reviews each sidecar's auto-auth policy and scopes it to specific secret
    paths.
  - Confirm workloads can only access the secrets they legitimately need.
