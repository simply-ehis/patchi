  deterministic_tool: null
  fix_strategy: llm-template-fill
  human_review_required: true
  llm_fix_template: "\"Given lookup-secret storage using {unsalted_or_weak_hash}:\
    \ replace with an\n approved password-hashing algorithm (bcrypt/argon2/scrypt)\
    \ using a 32-bit+\n random salt for secrets under 112 bits of entropy; preserve\
    \ verification logic\n shape, adding a migration path for already-stored secrets.\"\
    \n"
  playbook_version: 1.0.0
  verification_checks:
