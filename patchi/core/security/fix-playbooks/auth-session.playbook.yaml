- blast_radius_notes: Localized to the password-validation schema; existing users
    with shorter passwords are unaffected until their next password change.
  control_id: AUTHSESS-04
  deterministic_tool: framework password-validation schema (change minLength to 8+)
  fix_strategy: deterministic-autofix
  human_review_required: true
  llm_fix_template: null
  playbook_version: 1.0.0
  verification_checks:
  - Re-run the Semgrep rule and confirm minLength >= 8.
  - Attempt registration with a 7-character password and confirm rejection.
- blast_radius_notes: Feature-build task, not a small patch.
  control_id: AUTHSESS-05
  deterministic_tool: null
  fix_strategy: manual-only
  human_review_required: true
  llm_fix_template: null
  playbook_version: 1.0.0
  verification_checks:
  - A human confirms a password-change feature exists and is reachable from account
    settings.
- blast_radius_notes: Localized to the password-change handler.
  control_id: AUTHSESS-06
  deterministic_tool: null
  fix_strategy: llm-template-fill
  human_review_required: true
  llm_fix_template: "\"Given a password-change handler {handler} that doesn't verify\
    \ the current\n password: require and verify {current_password_field} against\
    \ the stored hash\n before accepting {new_password_field}; reject with 401/403\
    \ on mismatch;\n preserve the success path for correct current-password submissions.\"\
    \n"
  playbook_version: 1.0.0
  verification_checks:
  - Submit a change request with a wrong current password and confirm rejection.
  - Confirm a correct current password still allows the change.
- blast_radius_notes: Localized to the password-validation function; adds a lookup,
    no schema change.
  control_id: AUTHSESS-07
  deterministic_tool: null
  fix_strategy: llm-template-fill
  human_review_required: true
  llm_fix_template: "\"Given a password-validation function {validator} lacking a\
    \ common-password\n check: add a lookup against a top-3000+ common-password list\
    \ (e.g. a SecLists\n dataset) filtered to the app's length policy; reject matches\
    \ with a clear error;\n preserve existing length/composition checks.\"\n"
  playbook_version: 1.0.0
  verification_checks:
  - Attempt registration with a known top-100 common password and confirm rejection.
- blast_radius_notes: Localized to the validation regex; removing composition rules
    is safe and recommended by current NIST/ASVS guidance.
  control_id: AUTHSESS-08
  deterministic_tool: null
  fix_strategy: llm-template-fill
  human_review_required: false
  llm_fix_template: "\"Given a password-validation regex {regex} enforcing character-class\
    \ composition:\n remove the composition requirement, retaining only length bounds\
    \ (see AUTHSESS-04\n and AUTHSESS-12); preserve any breached/common-password checks\
    \ already present.\"\n"
  playbook_version: 1.0.0
  verification_checks:
  - Submit an all-lowercase, all-digit, or all-symbol password meeting length requirements
    and confirm it is now accepted.
- blast_radius_notes: Single template/component attribute change.
  control_id: AUTHSESS-09
  deterministic_tool: change input type attribute from text to password in the template/component
  fix_strategy: deterministic-autofix
  human_review_required: false
  llm_fix_template: null
  playbook_version: 1.0.0
  verification_checks:
  - Re-run the Semgrep rule and confirm zero findings.
  - Confirm the field visually masks input in a browser.
- blast_radius_notes: Single markup/handler change.
  control_id: AUTHSESS-10
  deterministic_tool: remove onpaste preventDefault() handler and autocomplete="off"
    from the password field markup
  fix_strategy: deterministic-autofix
  human_review_required: false
  llm_fix_template: null
  playbook_version: 1.0.0
  verification_checks:
  - Confirm paste now works in the password field in a manual browser test.
  - Confirm a password manager can autofill the field.
- blast_radius_notes: Touches the core password-hashing/verification path; requires
    a rehash-on-login migration for existing accounts, not an atomic change.
  control_id: AUTHSESS-11
  deterministic_tool: null
  fix_strategy: llm-template-fill
  human_review_required: true
  llm_fix_template: "\"Given a password-verification path that applies {transformation}\
    \ (lower()/\n upper()/truncation) before hashing/comparison: remove {transformation}\
    \ so the\n raw submitted password is hashed/compared exactly as received; note\
    \ this\n requires a migration step for already-hashed passwords stored under the\
    \ old\n transformed scheme (rehash on next successful login).\"\n"
  playbook_version: 1.0.0
  verification_checks:
  - Confirm a password containing mixed case or exceeding any prior truncation length
    now authenticates correctly.
- blast_radius_notes: Localized to the validation schema; confirm the hashing algorithm
    used (e.g. bcrypt's 72-byte input limit) doesn't silently truncate long passwords.
  control_id: AUTHSESS-12
  deterministic_tool: framework password-validation schema (raise maxLength to >=
    64)
  fix_strategy: deterministic-autofix
  human_review_required: true
  llm_fix_template: null
  playbook_version: 1.0.0
  verification_checks:
  - Attempt registration with a 64-character password and confirm acceptance.
