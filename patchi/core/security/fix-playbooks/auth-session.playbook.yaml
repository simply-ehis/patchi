  deterministic_tool: null
  fix_strategy: llm-template-fill
  human_review_required: true
  llm_fix_template: "\"Given an OTP/TOTP verification function {verify_fn} lacking\
    \ single-use\n enforcement: after successful verification, mark the code/token\
    \ as consumed\n (e.g. in a used-codes cache with TTL matching the code's lifetime)\
    \ and reject\n reuse; preserve the success path for first use.\"\n"
  playbook_version: 1.0.0
  verification_checks:
  - Attempt to reuse a just-validated code and confirm rejection.
- blast_radius_notes: Touches the lookup-secret storage/verification path; existing
