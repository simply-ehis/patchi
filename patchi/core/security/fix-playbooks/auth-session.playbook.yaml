- blast_radius_notes: Touches login, registration, and password-recovery handlers;
    low functional risk since only error-path messaging changes.
  control_id: AUTHSESS-23
  deterministic_tool: null
  fix_strategy: llm-template-fill
  human_review_required: true
  llm_fix_template: "\"Given login/registration/forgot-password handlers that return\
    \ different error\n messages, status codes, or response times for 'user exists'\
    \ vs 'user doesn't\n exist': unify the response (same generic message, same status\
    \ code) for both\n cases, and pad response timing if a measurable difference remains\
    \ (e.g. always\n perform a dummy hash comparison on the 'not found' path); preserve\
    \ correct\n behavior on the success path.\"\n"
  playbook_version: 1.0.0
  verification_checks:
  - Compare responses/timing for a valid vs. invalid username on all three flows and
    confirm no distinguishing signal remains.
- blast_radius_notes: Localized to the initial-credential generation function.
  control_id: AUTHSESS-24
  deterministic_tool: null
  fix_strategy: llm-template-fill
  human_review_required: true
  llm_fix_template: "\"Given initial-password/activation-code generation using {weak_rng}:\
    \ replace with\n a CSPRNG (e.g. crypto.randomBytes, secrets.token_urlsafe); enforce\
    \ the same\n password policy on the generated value; set a short expiration and\
    \ mark it\n unusable as a permanent password (force change on first use); preserve\
    \ the\n delivery mechanism (email/SMS).\"\n"
  playbook_version: 1.0.0
  verification_checks:
  - Re-run the Semgrep rule and confirm zero findings.
  - Confirm a newly generated initial password expires or forces a change as expected.
