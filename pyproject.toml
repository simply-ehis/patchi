[project]
name = "patchi"
version = "0.7.1"
description = "Patchi — AI-powered code security and quality agent colony (smart orchestrator, pre-1.0.0 dev preview)"
readme = "README.md"
license = {text = "Patchi Freemium — Free for personal & teams <3, enterprise contact idemudiaehis6@gmail.com"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "asyncio-mqtt>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "websockets>=12.0",
]
all = ["dev", "web"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["patchi*"]

[tool.ruff]
target-version = "py311"
line-length = 100
# lint settings moved to [tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "T20", # flake8-print
]
ignore = []
# NOTE: TOML inline tables are single-line only (v1.0)
per-file-ignores = { "tests/*" = ["S101", "T201", "T203"], "patchi/core/security/domain_loader.py" = ["E501"] }
preview = false

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
timeout = 60
timeout_method = "thread"
timeout_func_only = false
markers = [
    "slow: tests that take >30s (external binaries, heavy integration)",
    "integration: tests that require network, subprocess, or external tools",
    "web: tests that exercise the web server / websocket",
    "ai: tests that require AI provider keys",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestCollectionWarning",
    "ignore:.*coroutine.*never awaited:RuntimeWarning",
]
addopts = "-q --tb=short --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
show_error_codes = true
namespace_packages = true
exclude = [
    "build",
    "dist",
    ".venv",
    ".mypy_cache",
]
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
ignore_missing_imports = true

# NOTE: markers live in [tool.pytest.ini_options] above. A separate
# [tool.pytest.*] table here makes newer pytest abort with
# "both [tool.pytest] and [tool.pytest.ini_options]" — do not re-add.