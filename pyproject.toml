[project]
name = "patchi"
version = "0.7.8"
description = "Patchi — AI-powered code security and quality agent colony (smart orchestrator, pre-1.0.0 dev preview)"
readme = "README.md"
license = {text = "Proprietary — Free for personal/education/open-source, enterprise contact idemudiaehis6@gmail.com"}
requires-python = ">=3.11"
dependencies = [
    # Core
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
    "loguru>=0.7",
    "watchfiles>=0.21",
    "psutil>=5.9",
    # Web dashboard
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "websockets>=12.0",
    # Testing
    "playwright>=1.44",
    "Pillow>=10.0",
    "aiohttp>=3.9",
    "pixelmatch>=0.3",
    # AI/ML
    "scikit-learn>=1.4",
    # Security
    "pymetasploit3>=1.0",
    # AST parsing
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-rust>=0.21",
    "tree-sitter-svelte>=0.1",
    "tree-sitter-java>=0.21",
    "tree-sitter-go>=0.21",
    "tree-sitter-c>=0.21",
    "tree-sitter-cpp>=0.21",
    "tree-sitter-swift>=0.1",
    "tree-sitter-ruby>=0.1",
    "tree-sitter-php>=0.1",
    "tree-sitter-c-sharp>=0.1",
    "tree-sitter-kotlin>=0.1",
    "tree-sitter-dart>=0.1",
    "tree-sitter-bash>=0.1",
    "tree-sitter-css>=0.1",
    "tree-sitter-sql>=0.1",
    "tree-sitter-html>=0.1",
    # Testing framework
    "pytest-xdist>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "vulture>=2.11",
]
pentest = [
    "shannon>=0.1",
]
# External security tools (not Python packages — install separately)
# These are used by pentest adapters when available
external-tools = [
    # "nuclei",       # CVE scanning — go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
    # "sqlmap",       # SQL injection — pip install sqlmap or docker pull paoloo/sqlmap
    # "dalfox",       # XSS testing — go install github.com/hahwul/dalfox/v2@latest
    # "ffuf",         # Directory fuzzing — go install github.com/ffuf/ffuf/v2@latest
    # "zap",          # Web app security — docker pull ghcr.io/zaproxy/zaproxy:stable
    # "codeql",       # SAST analysis — download from github.com/github/codeql-cli-binaries
]
all = ["dev", "pentest"]

[project.scripts]
p = "patchi.cli.main:main"
patchi = "patchi.cli.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["patchi*"]

[tool.ruff]
target-version = "py311"
line-length = 100
preview = false

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "T20", # flake8-print
]
ignore = []
# NOTE: TOML inline tables are single-line only (v1.0)
# T201 ignored for CLI commands and dev scripts: print() IS the user-facing output there.
per-file-ignores = { "tests/*" = ["S101", "T201", "T203"], "patchi/core/security/domain_loader.py" = ["E501"], "patchi/cli/commands/*" = ["T201"], "tools/*" = ["T201"] }

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
timeout = 60
timeout_method = "thread"
timeout_func_only = false
markers = [
    "slow: tests that take >30s (external binaries, heavy integration)",
    "integration: tests that require network, subprocess, or external tools",
    "web: tests that exercise the web server / websocket",
    "ai: tests that require AI provider keys",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestCollectionWarning",
    "ignore:.*coroutine.*never awaited:RuntimeWarning",
]
addopts = "-q --tb=short --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
show_error_codes = true
namespace_packages = true
exclude = [
    "build",
    "dist",
    ".venv",
    ".mypy_cache",
]
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
ignore_missing_imports = true

# NOTE: markers live in [tool.pytest.ini_options] above. A separate
# [tool.pytest.*] table here makes newer pytest abort with
# "both [tool.pytest] and [tool.pytest.ini_options]" — do not re-add.

