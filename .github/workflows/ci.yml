name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check patchi/

      - name: Type check with mypy
        run: mypy patchi/ --ignore-missing-imports || true

      - name: Validate security domain data
        # Malformed domains/ or fix-playbooks/ YAML previously crashed every
        # scan (KeyError in DomainLoader). Gate it here so PRs fail fast.
        # tools/gates/taxonomy_parity.py regenerates the taxonomy into a
        # temp dir and byte-compares — catches hand-edited YAML and
        # generator bumps without regeneration in one shot.
        run: python tools/gates/taxonomy_parity.py

      - name: Run tests
        run: |
          # Hermetic suite: PATCHI_OFFLINE=1 (same contract as ci-audit.sh) so
          # network-probing agents (OSV/CVE, live app crawling, runtime
          # validation) skip network calls — deterministic and fast.
          export PATCHI_OFFLINE=1
          pytest tests/ -x -q --tb=short --timeout=120

      - name: Run language support tests
        run: pytest tests/test_language_support.py -v --timeout=60

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      - name: Run security agents on fixtures
        run: |
          python -c "
          from patchi.core.security.injection_agent import InjectionAgent
          from patchi.core.security.ssrf_agent import SSRFProtectionAgent
          from patchi.core.security.catch_block_auditor import CatchBlockAuditor
          from patchi.core.agents.base import AgentInput
          from pathlib import Path

          root = Path('tests/fixtures/languages')
          inp = AgentInput(root=root, scope=[], brain={}, config={})

          for AgentCls in [InjectionAgent, SSRFProtectionAgent, CatchBlockAuditor]:
              agent = AgentCls()
              result = agent._run(inp)
              print(f'{agent.name}: {len(result.findings)} findings')
          "

  dev-check:
    # Run the same p dev check gate the pre-commit hook uses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run p dev check gate
        run: |
          # Use fast mode on PRs for quick feedback, full mode on main
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python -m patchi dev check --fast
          else
            python -m patchi dev check
          fi

  audit:
    # Full audit gate: CLI/agent-linking audit + dynamic agent smoke sweep +
    # full test suite. Every future change is checked for the bug classes found
    # in the deep audit (agent crashes, silent de-registration, fabricated
    # findings, CLI registry drift).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full audit gate
        run: ./scripts/ci-audit.sh
